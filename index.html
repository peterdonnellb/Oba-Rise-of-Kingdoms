<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Oba – Rise of Kingdoms</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Afacad:ital,wght@0,400..700;1,400..700&display=swap');

    :root {
      --regal-plum: #4B167A;
      --antique-gold: #D4AF37;
      --amethyst-purple: #8E44AD;
      --warm-gold: #F2C14E;
      --midnight-blue: #1B2A6B;
      --coastal-gold: #C9A227;
      --terracotta: #A65A2A;
      --muted-gold: #BF922A;
      --near-black: #141218;
      --vivid-gold: #FFD700;
      --cream: #f0e6d3;
      --cream-muted: #d4c8bc;
      --tech-border: #3a2a1a;
    }
    body {
      font-family: 'Afacad', sans-serif;
      background: var(--near-black);
      color: var(--cream);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      z-index: 10;
      transition: opacity 0.4s ease;
      overflow-y: auto;
    }
    .screen.active { display: flex; }

    /* ─── MAIN MENU with background ─── */
    #menu-screen {
      background: var(--near-black);
      justify-content: center;
      padding: 20px 10px;
      position: relative;
    }
    #menu-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('menu_background.png');
      background-size: cover;
      background-position: center;
      opacity: 0.5;
      z-index: 0;
    }
    #menu-screen > * { position: relative; z-index: 1; }

    .menu-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
    }

    #menu-logo-container {
      width: 100%;
      max-width: 600px;
      max-height: 20vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }
    #menu-logo-container img {
      width: 100%;
      height: auto;
      max-height: 20vh;
      object-fit: contain;
    }
    #menu-text-logo {
      font-family: 'MedievalSharp', cursive;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      color: var(--antique-gold);
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.2), 0 4px 12px rgba(0,0,0,0.9);
      letter-spacing: 4px;
      line-height: 1.1;
      text-align: center;
    }
    #menu-text-logo::before,
    #menu-text-logo::after {
      content: '⚔';
      font-size: 1.8rem;
      opacity: 0.3;
      margin: 0 6px;
      color: var(--amethyst-purple);
    }
    .menu-subtitle {
      font-size: 1.3rem;
      color: var(--vivid-gold);
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 2rem;
      opacity: 0.85;
      font-weight: 300;
      text-align: center;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
    }
    .menu-btn {
      font-family: 'Afacad', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 14px 36px;
      margin: 6px 0;
      border: 2px solid var(--antique-gold);
      border-radius: 6px;
      background: rgba(75, 22, 122, 0.3);
      color: var(--cream);
      cursor: pointer;
      transition: all 0.25s ease;
      min-width: 220px;
      text-align: center;
      letter-spacing: 2px;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }
    .menu-btn:active { transform: scale(0.96); }
    .menu-btn.primary {
      border-color: var(--vivid-gold);
      background: rgba(212, 175, 55, 0.15);
      font-size: 1.2rem;
      padding: 16px 44px;
      color: var(--vivid-gold);
    }
    .menu-btn.primary:hover { background: rgba(212, 175, 55, 0.25); }
    .menu-btn.secondary {
      border-color: #4a3528;
      background: rgba(74, 53, 40, 0.15);
      color: #b8957a;
    }
    .menu-btn.secondary:hover { background: rgba(74, 53, 40, 0.35); }
    .menu-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .menu-decoration {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, rgba(142, 68, 173, 0.08) 0%, transparent 70%);
    }
    .menu-decoration.tl { top: -120px; left: -120px; }
    .menu-decoration.br { bottom: -120px; right: -120px; }
    .menu-decoration.tr { top: -120px; right: -120px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%); }

    /* ─── NEW GAME WIZARD ─── */
    #newgame-screen {
      background: var(--near-black);
      position: relative;
      padding: 16px 12px;
      overflow-y: auto;
      justify-content: flex-start;
    }
    #newgame-screen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('menu_background.png');
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      z-index: 0;
    }
    #newgame-screen > * { position: relative; z-index: 1; }

    .ng-step {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      gap: 16px;
      padding: 10px 0;
    }
    .ng-step.active { display: flex; }

    .ng-step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px 8px 4px;
      border-bottom: 1px solid rgba(201, 162, 39, 0.2);
    }
    .ng-step-header .back-btn {
      font-size: 1.2rem;
      padding: 6px 16px;
      border: none;
      background: rgba(20,18,24,0.5);
      color: #b8957a;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.2s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .ng-step-header .back-btn:active { background: rgba(74,53,40,0.3); }
    .ng-step-header h2 {
      font-family: 'MedievalSharp', cursive;
      font-size: 1.6rem;
      color: var(--antique-gold);
      letter-spacing: 2px;
      margin: 0;
      flex: 1;
      text-align: center;
    }
    .ng-step-header .placeholder { width: 60px; }

    .ng-mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      padding: 4px 0;
    }
    .ng-mode-btn {
      padding: 20px 12px;
      background: rgba(27, 42, 107, 0.35);
      border: 2px solid rgba(201, 162, 39, 0.2);
      border-radius: 14px;
      color: var(--cream-muted);
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 80px;
      justify-content: center;
    }
    .ng-mode-btn:active { transform: scale(0.96); }
    .ng-mode-btn.selected {
      border-color: var(--vivid-gold);
      background: rgba(255, 215, 0, 0.08);
      color: var(--vivid-gold);
    }
    .ng-mode-btn .mode-desc {
      font-size: 0.7rem;
      font-weight: 400;
      color: #6b5a4a;
    }
    .ng-mode-btn.selected .mode-desc { color: #b8957a; }

    .ng-tribe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-height: 50vh;
      overflow-y: auto;
      padding: 4px 0;
    }
    .ng-tribe-item {
      padding: 10px 4px;
      border-radius: 12px;
      border: 2px solid transparent;
      background: rgba(20,18,24,0.4);
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.8rem;
      text-align: center;
      color: #b8a898;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .ng-tribe-item:active { background: rgba(212,175,55,0.15); }
    .ng-tribe-item.active {
      border-color: var(--coastal-gold);
      background: rgba(212,175,55,0.12);
      color: var(--cream);
      box-shadow: 0 0 20px rgba(212,175,55,0.05);
    }
    .ng-tribe-item .tribe-icon {
      font-size: 2.4rem;
      display: block;
      line-height: 1.2;
    }
    .ng-tribe-item .tribe-name { font-size: 0.7rem; font-weight: 600; }
    .ng-tribe-item .tribe-desc { font-size: 0.55rem; color: #6b5a4a; }

    .ng-opponent-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
      padding: 4px 0;
    }
    #opponent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }
    #opponent-list .opp-tag {
      background: rgba(30,18,12,0.6);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid #3a281e;
      font-size: 0.8rem;
      color: var(--cream-muted);
    }
    .ng-actions-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      width: 100%;
    }
    .ng-actions-row button {
      font-size: 0.9rem;
      padding: 8px 18px;
      border: 1px solid #4a3528;
      background: rgba(20,12,8,0.5);
      color: var(--cream-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      flex: 1;
    }
    .ng-actions-row button:active { background: rgba(74,53,40,0.3); }
    .ng-actions-row button.danger {
      border-color: #6a2a1a;
      color: #b85a4a;
    }

    .ng-custom-options {
      display: none;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      padding: 8px 0;
      border-top: 1px solid rgba(42,26,16,0.3);
      margin-top: 8px;
    }
    .ng-custom-options.show { display: flex; }
    .ng-custom-options .ng-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      background: rgba(20,18,24,0.3);
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .ng-custom-options .ng-option label {
      font-size: 0.9rem;
      color: var(--cream-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .ng-custom-options .ng-option input,
    .ng-custom-options .ng-option select {
      background: #1a0e08;
      border: 1px solid #3a281e;
      color: var(--cream);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
      width: 70px;
    }
    .ng-custom-options .ng-option select { width: auto; }

    .ng-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px;
      font-size: 0.9rem;
      color: var(--cream-muted);
      width: 100%;
      padding: 8px 0;
    }
    .ng-summary .sum-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid rgba(42,26,16,0.2);
    }
    .ng-summary .sum-row .label { color: #6b5a4a; }
    .ng-summary .sum-row .value { color: var(--cream); font-weight: 500; }

    .ng-start-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.4rem;
      font-weight: 700;
      border: 2px solid var(--vivid-gold);
      border-radius: 12px;
      background: rgba(255, 215, 0, 0.08);
      color: var(--vivid-gold);
      cursor: pointer;
      transition: 0.25s;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .ng-start-btn:active { background: rgba(255,215,0,0.2); transform: scale(0.98); }

    /* ─── GAME SCREEN ─── */
    #game-screen {
      background: var(--near-black);
      padding: 0;
      justify-content: flex-start;
    }
    #game-canvas-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #1B2A6B 0%, #0a0f2a 100%);
      cursor: grab;
      touch-action: none;
    }
    #gameCanvas:active { cursor: grabbing; }

    #game-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #game-ui>* { pointer-events: auto; }

    .gui-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 6px 8px;
      background: linear-gradient(180deg, rgba(27, 42, 107, 0.85) 0%, transparent 100%);
      flex-wrap: wrap;
      gap: 4px;
    }
    .gui-top-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .gui-top-left .tribe-name {
      font-size: 0.9rem;
      color: var(--warm-gold);
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .gui-top-left .tribe-name .tribe-icon img { width: 22px; height: 22px; border-radius: 4px; }
    .gui-top-left .turn-counter {
      font-size: 0.75rem;
      color: var(--coastal-gold);
      font-weight: 600;
      background: rgba(0,0,0,0.3);
      padding: 1px 8px;
      border-radius: 12px;
      border: 1px solid rgba(201, 162, 39, 0.2);
    }
    .gui-top-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .gui-resource {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 0.7rem;
      color: var(--cream-muted);
      background: rgba(20, 18, 24, 0.6);
      padding: 1px 6px;
      border-radius: 10px;
      border: 1px solid rgba(201, 162, 39, 0.15);
      backdrop-filter: blur(2px);
    }
    .gui-resource .icon { font-size: 0.8rem; }
    .gui-resource .val {
      font-weight: 700;
      color: var(--cream);
      min-width: 16px;
      text-align: center;
    }
    .gui-resource.gold .val { color: var(--vivid-gold); }
    .gui-menu-btn {
      padding: 2px 10px;
      border: 1px solid #4a3528;
      background: rgba(20,18,24,0.6);
      color: #b8957a;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.65rem;
      transition: 0.2s;
      letter-spacing: 0.5px;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .gui-menu-btn:active { background: rgba(74,53,40,0.4); }
    .gui-menu-btn.tech-btn {
      border-color: var(--coastal-gold);
      color: var(--coastal-gold);
    }
    .gui-menu-btn.tech-btn:hover { background: rgba(201, 162, 39, 0.1); }

    .gui-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px 8px;
      background: linear-gradient(0deg, rgba(27, 42, 107, 0.85) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .gui-unit-info {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      background: rgba(20,18,24,0.7);
      border-radius: 6px;
      border: 1px solid rgba(166, 90, 42, 0.3);
      min-height: 26px;
      flex: 1 1 120px;
      flex-wrap: wrap;
    }
    .gui-unit-info .unit-name {
      font-weight: 700;
      color: var(--terracotta);
      font-size: 0.7rem;
      min-width: 40px;
    }
    .gui-unit-info .unit-stats {
      font-size: 0.6rem;
      color: #b8957a;
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }
    .gui-unit-info .unit-stats span {
      display: flex;
      align-items: center;
      gap: 1px;
    }
    .gui-unit-info .unit-stats .stat-val {
      color: var(--cream);
      font-weight: 600;
    }
    .gui-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .gui-action-btn {
      padding: 4px 12px;
      border: 1px solid #3a281e;
      background: rgba(20,18,24,0.6);
      color: var(--cream-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.7rem;
      transition: 0.2s;
      letter-spacing: 0.3px;
      font-family: inherit;
      font-weight: 500;
      -webkit-tap-highlight-color: transparent;
      min-height: 32px;
    }
    .gui-action-btn:active:not(:disabled) { background: rgba(74,53,40,0.3); }
    .gui-action-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .gui-action-btn.primary {
      border-color: var(--coastal-gold);
      color: var(--coastal-gold);
      background: rgba(201, 162, 39, 0.1);
    }
    .gui-action-btn.primary:active:not(:disabled) { background: rgba(201, 162, 39, 0.2); }
    .gui-action-btn.danger {
      border-color: #6a2a1a;
      color: #b85a4a;
    }
    .gui-action-btn.end-turn {
      border-color: var(--vivid-gold);
      background: rgba(255, 215, 0, 0.06);
      color: var(--vivid-gold);
      font-weight: 600;
    }
    .gui-action-btn.end-turn:active:not(:disabled) { background: rgba(255, 215, 0, 0.15); }
    .gui-action-btn.heal {
      border-color: #4caf50;
      color: #4caf50;
      background: rgba(76, 175, 80, 0.08);
    }
    .gui-action-btn.heal:active:not(:disabled) { background: rgba(76, 175, 80, 0.2); }
    .gui-action-btn.invigorate {
      border-color: #9b59b6;
      color: #9b59b6;
      background: rgba(155, 89, 182, 0.08);
    }
    .gui-action-btn.invigorate:active:not(:disabled) { background: rgba(155, 89, 182, 0.2); }

    /* ─── POPUP ACTION MENU ─── */
    #action-popup {
      position: absolute;
      background: rgba(20, 18, 24, 0.95);
      backdrop-filter: blur(8px);
      border: 2px solid var(--coastal-gold);
      border-radius: 10px;
      padding: 6px 4px;
      display: none;
      flex-direction: column;
      gap: 3px;
      min-width: 120px;
      z-index: 50;
      pointer-events: auto;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      transition: opacity 0.15s ease;
    }
    #action-popup button {
      background: rgba(27, 42, 107, 0.3);
      border: 1px solid rgba(201, 162, 39, 0.15);
      border-radius: 4px;
      color: var(--cream);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-family: 'Afacad', sans-serif;
      cursor: pointer;
      transition: 0.15s;
      text-align: left;
      white-space: nowrap;
      font-weight: 500;
      letter-spacing: 0.3px;
      -webkit-tap-highlight-color: transparent;
      min-height: 36px;
    }
    #action-popup button:hover:not(:disabled) {
      background: rgba(201, 162, 39, 0.2);
      border-color: var(--coastal-gold);
    }
    #action-popup button:active:not(:disabled) { transform: scale(0.96); }
    #action-popup button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    #action-popup button.primary {
      border-color: var(--vivid-gold);
      color: var(--vivid-gold);
      background: rgba(255, 215, 0, 0.08);
    }
    #action-popup button.primary:hover:not(:disabled) { background: rgba(255, 215, 0, 0.18); }
    #action-popup button.danger {
      border-color: #6a2a1a;
      color: #b85a4a;
    }
    #action-popup button.danger:hover:not(:disabled) { background: rgba(106, 42, 26, 0.2); }
    #action-popup button.heal-btn {
      border-color: #4caf50;
      color: #4caf50;
    }
    #action-popup button.heal-btn:hover:not(:disabled) { background: rgba(76, 175, 80, 0.15); }
    #action-popup button.invigorate-btn {
      border-color: #9b59b6;
      color: #9b59b6;
    }
    #action-popup button.invigorate-btn:hover:not(:disabled) { background: rgba(155, 89, 182, 0.15); }
    #action-popup .action-icon {
      margin-right: 4px;
      font-size: 0.9rem;
    }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: radial-gradient(ellipse at 50% 40%, var(--regal-plum) 0%, var(--near-black) 100%);
      border: 2px solid var(--antique-gold);
      border-radius: 14px;
      padding: 24px 20px;

<!-- ════════════════════════════════════════════════════════════════ -->
<!-- MAIN MENU -->

    <button class="menu-btn primary" onclick="showNewGameWizard()">⚔ New Game</button>

<!-- NEW GAME WIZARD -->

<div id="newgame-screen" class="screen">
  <!-- Step 1: Mode -->
  <div id="step-mode" class="ng-step active">
    <div class="ng-step-header">
      <button class="back-btn" onclick="showScreen('menu-screen')">←</button>
      <h2>Choose Mode</h2>
      <div class="placeholder"></div>
    </div>
    <div class="ng-mode-grid">
      <button class="ng-mode-btn selected" data-mode="conquest" onclick="selectMode(this)">
        ⚔ Conquest
        <span class="mode-desc">Defeat all enemies</span>
      </button>
      <button class="ng-mode-btn" data-mode="sandsoftime" onclick="selectMode(this)">
        ⏳ Sands of Time
        <span class="mode-desc">Control most hexes</span>
      </button>
      <button class="ng-mode-btn" data-mode="oba" onclick="selectMode(this)">
        👑 Oba
        <span class="mode-desc">Conquest · Aggressive AI</span>
      </button>

  </div>

  <!-- Step 3: Opponents & Options -->
  <div id="step-opponents" class="ng-step">
    <div class="ng-step-header">
      <button class="back-btn" onclick="goToStep('step-tribe')">←</button>

      <div class="placeholder"></div>
    </div>

    <div class="ng-actions-row">

    <div class="ng-summary" id="campaign-summary">

<script>
// ─── ASSET PATHS ──────────────────────────────────────────────
const TRIBE_IDS = ['zulu', 'ashanti', 'yoruba', 'maasai', 'berber', 'hausa', 'dogon', 'songhai', 'oromo', 'tutsi', 'swahili', 'nubian'];
const UNIT_TYPES = ['scout', 'foot', 'mounted', 'shield', 'ranged', 'elite', 'tank', 'general'];
const NAVAL_TYPES = ['raft', 'galley', 'warship'];

const ASSET_PATHS = {};
for (const id of TRIBE_IDS) ASSET_PATHS[`tribe_${id}`] = `tribe_${id}.png`;
for (const tribe of TRIBE_IDS) {
  for (const unit of [...UNIT_TYPES, ...NAVAL_TYPES]) {
    ASSET_PATHS[`${tribe}_${unit}`] = `${tribe}_${unit}.png`;
  }
}
ASSET_PATHS['settlement_village'] = 'settlement_village.png';
ASSET_PATHS['settlement_town'] = 'settlement_town.png';
ASSET_PATHS['settlement_city'] = 'settlement_city.png';
ASSET_PATHS['settlement_capital'] = 'settlement_capital.png';
ASSET_PATHS['hex_plains'] = 'hex_plains.png';
ASSET_PATHS['hex_forest'] = 'hex_forest.png';
ASSET_PATHS['hex_mountain'] = 'hex_mountain.png';
ASSET_PATHS['hex_water'] = 'hex_water.png';
ASSET_PATHS['hex_hill'] = 'hex_hill.png';
ASSET_PATHS['resource_gold'] = 'resource_gold.png';
ASSET_PATHS['resource_food'] = 'resource_food.png';
ASSET_PATHS['resource_wood'] = 'resource_wood.png';
ASSET_PATHS['resource_stone'] = 'resource_stone.png';
ASSET_PATHS['resource_fish'] = 'resource_fish.png';
ASSET_PATHS['ui_gold'] = 'ui_gold.png';
ASSET_PATHS['ui_sword'] = 'ui_sword.png';
ASSET_PATHS['ui_shield'] = 'ui_shield.png';
ASSET_PATHS['ui_move'] = 'ui_move.png';
ASSET_PATHS['ui_health'] = 'ui_health.png';
ASSET_PATHS['logo_oba'] = 'logo_oba.png';
ASSET_PATHS['menu_background'] = 'menu_background.png';
ASSET_PATHS['veteran'] = 'veteran.png';
ASSET_PATHS['legendary'] = 'legendary.png';
ASSET_PATHS['library'] = 'library.png';
ASSET_PATHS['university'] = 'university.png';

const RESOURCE_MAP = {
  '🪙': 'resource_gold',
  '🌾': 'resource_food',
  '🪵': 'resource_wood',
  '🪨': 'resource_stone',
  '🐟': 'resource_fish'
};

let images = {};
let imagesLoaded = false;

function loadImages(callback) {
  const total = Object.keys(ASSET_PATHS).length;
  let loaded = 0;
  for (const [key, path] of Object.entries(ASSET_PATHS)) {
    const img = new Image();
    img.onload = () => {
      loaded++;
      if (key === 'logo_oba') {
        const logoImg = document.getElementById('main-logo');
        const textLogo = document.getElementById('menu-text-logo');
        if (logoImg) { logoImg.src = path; logoImg.style.display = 'block'; if (textLogo) textLogo.style.display = 'none'; }
      }
      if (loaded === total) { imagesLoaded = true; if (callback) callback(); }
    };
    img.onerror = () => {
      loaded++;
      if (key === 'logo_oba') {
        const logoImg = document.getElementById('main-logo');
        const textLogo = document.getElementById('menu-text-logo');
        if (logoImg) logoImg.style.display = 'none';
        if (textLogo) textLogo.style.display = 'block';
      }
      if (loaded === total) { imagesLoaded = true; if (callback) callback(); }
    };
    img.src = path;
    images[key] = img;
  }
}

// ─── UNIQUE SETTLEMENT NAMES ────────────────────────────────
const SETTLEMENT_NAMES = [
  'Timbuktu', 'Gao', 'Koumbi Saleh', 'Djenne', 'Niani', 'Walata', 'Oualata', 'Audaghost',
  'Kano', 'Zaria', 'Katsina', 'Gobir', 'Zamfara', 'Nupe', 'Oyo', 'Ile Ife', 'Benin City',

  'Kilwa', 'Mombasa', 'Zanzibar', 'Pemba', 'Malindi', 'Sofala', 'Mogadishu', 'Lamu',
  'Pate', 'Merca', 'Gedi', 'Barawa', 'Gobro', 'Tabwa', 'Ujiji', 'Tabora',
  'Mbanza Kongo', 'Kigali', 'Bujumbura', 'Gitega', 'Meroe', 'Nakfa', 'Massawa',
  'Bulawayo', 'Great Zimbabwe', 'Khami', 'Durban', 'Maputo', 'Luanda', 'Benguela',
  'Chinguetti', 'Ouadane', 'Idjil', 'Azawad', 'Agadez', 'Bilma', 'Djado', 'Tadmekka',
  'Essouk', 'Araouane', 'Taoudenni', 'Tassili', 'Hoggar', 'Tibesti', 'Borkou',
  'Nubia', 'Dongola', 'Soba', 'Alodia', 'Makuria', 'Nobatia', 'Blemmye', 'Beja',
  'Axum', 'Adulis', 'Matara', 'Yeha', 'Kush', 'Napata', 'Meroe',
  'Grand-Bassam', 'Assinie', 'Axim', 'Sekondi', 'Cape Coast', 'Anomabu', 'Shama',
  'Ouidah', 'Porto-Novo', 'Lagos', 'Calabar', 'Bonny', 'Brass', 'Opobo'
];

let usedSettlementNames = [];

function getUniqueSettlementName() {
  const available = SETTLEMENT_NAMES.filter(n => !usedSettlementNames.includes(n));
  if (available.length === 0) {
    const prefixes = ['New', 'Great', 'Ancient', 'Golden', 'Sacred'];
    const suffix = SETTLEMENT_NAMES[Math.floor(Math.random() * SETTLEMENT_NAMES.length)];
    return prefixes[Math.floor(Math.random() * prefixes.length)] + ' ' + suffix;
  }
  const name = available[Math.floor(Math.random() * available.length)];
  usedSettlementNames.push(name);
  return name;
}

function resetSettlementNames() {
  usedSettlementNames = [];
}

// ─── TECH TREE ──────────────────────────────────────────────
const TECH_TREE = [
  { id: 'masonry', name: 'Masonry', cost: 30, bonus: 'city_defense', desc: '+1 defense for all cities', requires: [], tier: 0 },

    tiers[tech.tier].push(tech);
  }
  return tiers;

// ─── TECH HELPERS ────────────────────────────────────────────
function isTechAvailable(tribe, techId) {
  if (tribe.techs.includes(techId)) return true;
  const tech = TECH_TREE.find(t => t.id === techId);
  if (!tech) return false;
  if (tech.requires && tech.requires.length > 0) {
    for (const req of tech.requires) {
      if (!tribe.techs.includes(req)) return false;
    }
  }
  return true;
}
function getAvailableTechs(tribe) {
  return TECH_TREE.filter(t => !tribe.techs.includes(t.id) && isTechAvailable(tribe, t.id));
}
function getAvailableUnits(tribe) {
  const tribeData = TRIBES_DATA.find(t => t.id === tribe.id);
  if (!tribeData) return {};
  const result = {};
  for (const [type, def] of Object.entries(tribeData.units)) {
    if (!def.techRequired || tribe.techs.includes(def.techRequired)) {
      result[type] = def;
    }
  }
  return result;
}
function getAvailableWonders(tribe) {
  return WONDERS.filter(w => !tribe.wonders.includes(w.id) && (w.requires ? tribe.techs.includes(w.requires) : true));
}
function getTechCost(techId) { const tech = TECH_TREE.find(t => t.id === techId); return tech ? tech.cost : 999; }
function getWonderCost(wonderId) { const w = WONDERS.find(w => w.id === wonderId); return w ? w.cost : 999; }
function isTechResearched(tribe, techId) { return tribe.techs.includes(techId); }
function isWonderBuilt(tribe, wonderId) { return tribe.wonders.includes(wonderId); }

// ─── TECH TREE VIEW ──────────────────────────────────────────
function showTechTree() {
  const player = G.tribes.find(t => t.isPlayer);
  if (!player) return;
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = '📜 Technology Tree';

  const tiers = getTechsByTier();
  const tierNames = ['Foundations', 'Craftsmanship', 'Advancement', 'Mastery'];
  let html = `<div class="tech-tree-container">`;

  for (let tier = 0; tier <= 3; tier++) {
    const techs = tiers[tier] || [];
    if (techs.length === 0) continue;
    html += `<div class="tech-group-label">— ${tierNames[tier] || `Tier ${tier}`} —</div>`;
    html += `<div class="tech-row">`;
    for (const tech of techs) {
      const researched = player.techs.includes(tech.id);
      const available = isTechAvailable(player, tech.id);
      const inProgress = isTechBeingResearched(tech.id);
      let status = researched ? '✅ Researched' : (inProgress ? `⏳ ${getTechResearcher(tech.id)}` : (available ? '🔓 Available' : '🔒 Locked'));
      let statusClass = researched ? 'done' : (inProgress ? 'inprogress' : (available ? 'avail' : 'locked'));
      let nodeClass = 'tech-node';
      if (researched) nodeClass += ' researched';
      else if (available && !inProgress) nodeClass += ' available';
      else nodeClass += ' locked';

      let onclick = '';
      if (available && !researched && !inProgress) {
        onclick = `onclick="assignTechToCity('${tech.id}')"`;
      } else if (inProgress) {
        onclick = `onclick="alert('Already being researched in ${getTechResearcher(tech.id)}')"`;
      }

      html += `<div class="${nodeClass}" ${onclick}>
        <div class="tech-name">${tech.name}</div>
        <div class="tech-cost">${tech.cost} 🔬</div>
        <div class="tech-status ${statusClass}">${status}</div>
        <div style="font-size:0.5rem;color:#6b5a4a;margin-top:2px;">${tech.desc}</div>
      </div>`;
    }
    html += `</div>`;
    if (tier < 3 && tiers[tier + 1] && tiers[tier + 1].length > 0) {
      html += `<div style="text-align:center;color:#4a3528;font-size:1.2rem;">⬇</div>`;
    }
  }

  // Wonders
  html += `<div class="tech-group-label" style="margin-top:12px;">— Wonders —</div>`;
  html += `<div class="tech-row">`;
  for (const wonder of WONDERS) {
    const built = player.wonders.includes(wonder.id);
    const available = wonder.requires ? player.techs.includes(wonder.requires) : true;
    let status = built ? '✅ Built' : (available ? '🔓 Available' : '🔒 Locked');
    let statusClass = built ? 'done' : (available ? 'avail' : 'locked');
    let nodeClass = 'tech-node';
    if (built) nodeClass += ' researched';
    else if (available) nodeClass += ' available';
    else nodeClass += ' locked';
    let onclick = '';
    if (available && !built) {
      onclick = `onclick="alert('Build wonders through city production!')"`;
    }
    html += `<div class="${nodeClass}" ${onclick}>
      <div class="tech-name">${wonder.name}</div>
      <div class="tech-cost">${wonder.cost} 🏗️</div>
      <div class="tech-status ${statusClass}">${status}</div>
      <div style="font-size:0.5rem;color:#6b5a4a;">${wonder.desc}</div>
    </div>`;
  }
  html += `</div>`;

  html += `</div>`;
  html += `<div style="text-align:center;font-size:0.7rem;color:#6b5a4a;margin-top:8px;">💡 Click an available tech to assign it to a city for research.</div>`;

  document.getElementById('modal-body').innerHTML = html;
  const actions = document.getElementById('modal-actions');
  actions.innerHTML = `<button class="primary" onclick="closeModal()">Close</button>`;
  overlay.classList.add('active');
}

// ─── TECH RESEARCH ASSIGNMENT ──────────────────────────────
function isTechBeingResearched(techId) {
  const player = G.tribes.find(t => t.isPlayer);
  if (!player) return false;
  for (const city of player.cities) {
    if (city.project && city.project.type === 'tech' && city.project.id === techId) {
      return true;
    }
  }
  return false;
}

function getTechResearcher(techId) {
  const player = G.tribes.find(t => t.isPlayer);
  if (!player) return 'Unknown';
  for (const city of player.cities) {
    if (city.project && city.project.type === 'tech' && city.project.id === techId) {
      return city.name;
    }
  }
  return 'Unknown';
}

function assignTechToCity(techId) {
  const player = G.tribes.find(t => t.isPlayer);
  if (!player) return;
  if (isTechBeingResearched(techId)) {
    alert('This technology is already being researched in ' + getTechResearcher(techId));
    return;
  }
  if (player.techs.includes(techId)) {
    alert('Already researched!');
    return;
  }
  if (!isTechAvailable(player, techId)) {
    alert('Prerequisites not met!');
    return;
  }

  // Find idle cities (no project)
  const idleCities = player.cities.filter(c => !c.project);
  if (idleCities.length === 0) {
    alert('All your cities are busy with other projects. Free one up first.');
    return;
  }

  // Show modal with city selection
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = 'Assign Research: ' + TECH_TREE.find(t => t.id === techId).name;
  let html = '<p>Choose a city to research this technology:</p><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">';
  for (const city of idleCities) {
    html += `<button style="padding:6px;background:rgba(20,12,8,0.7);border:1px solid #3a281e;border-radius:4px;color:var(--cream);cursor:pointer;font-family:inherit;font-size:0.9rem;" 
              onclick="assignTechToCityConfirm('${techId}', ${city.id})">${city.name}</button>`;
  }
  html += '</div>';
  document.getElementById('modal-body').innerHTML = html;
  const actions = document.getElementById('modal-actions');
  actions.innerHTML = `<button onclick="closeModal();showTechTree();">Cancel</button>`;
  overlay.classList.add('active');
  window._pendingTechId = techId;
}

function assignTechToCityConfirm(techId, cityId) {
  const player = G.tribes.find(t => t.isPlayer);
  if (!player) return;
  const city = player.cities.find(c => c.id === cityId);
  if (!city) { alert('City not found'); return; }
  if (city.project) { alert('City is already busy!'); return; }
  if (isTechBeingResearched(techId)) { alert('Tech already being researched elsewhere.'); return; }
  if (player.techs.includes(techId)) { alert('Already researched.'); return; }
  if (!isTechAvailable(player, techId)) { alert('Prerequisites not met.'); return; }

  setCityProject(city, 'tech', techId);
  closeModal();
  updateUI();
  render();
  alert(`Researching ${TECH_TREE.find(t=>t.id===techId).name} in ${city.name}!`);
  showTechTree(); // refresh
  saveGame();
}
