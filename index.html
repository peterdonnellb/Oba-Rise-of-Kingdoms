// ─── POPUP ACTION MENU ──────────────────────────────────
const popup = document.getElementById('action-popup');

function showActionPopup(x, y) {
  const rect = canvas.getBoundingClientRect();
  const popupRect = popup.getBoundingClientRect();
  let left = x - popupRect.width / 2;
  let top = y - popupRect.height - 10;
  if (left < 10) left = 10;
  if (left + popupRect.width > rect.width - 10) left = rect.width - popupRect.width - 10;
  if (top < 10) top = 10;
  if (top + popupRect.height > rect.height - 10) top = rect.height - popupRect.height - 10;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  popup.style.display = 'flex';
}
function hideActionPopup() {
  popup.style.display = 'none';
}
function updateActionPopup() {
  const unit = G.selectedUnit;
  const player = G.tribes.find(t => t.isPlayer);
  
  if (!unit && G.selectedCity) {
    const city = G.selectedCity;
    const hasCity = city && city.owner === player.id;
    const manageBtn = popup.querySelector('[data-action="manage-city"]');
    const upgradeBtn = popup.querySelector('[data-action="upgrade-city"]');
    manageBtn.style.display = 'block';
    upgradeBtn.style.display = 'block';
    if (hasCity) {
      const cost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
      const reduced = player.techs.includes('architecture') ? Math.floor(cost * 0.8) : cost;
      upgradeBtn.disabled = city.level >= 4 || player.gold < reduced;
    }
    popup.querySelectorAll('button').forEach(b => {
      if (b.dataset.action !== 'manage-city' && b.dataset.action !== 'upgrade-city') {
        b.style.display = 'none';
      }
    });
    return;
  }
  
  if (!unit || !player || unit.tribeId !== player.id) {
    hideActionPopup();
    return;
  }
  
  popup.querySelectorAll('button').forEach(b => {
    b.style.display = 'block';
  });
  
  const moveBtn = popup.querySelector('[data-action="move"]');
  const attackBtn = popup.querySelector('[data-action="attack"]');
  const skipBtn = popup.querySelector('[data-action="skip"]');
  const healBtn = popup.querySelector('[data-action="heal"]');
  const invigorateBtn = popup.querySelector('[data-action="invigorate"]');
  const buildHarborBtn = popup.querySelector('[data-action="build-harbor"]');
  const buildRaftBtn = popup.querySelector('[data-action="build-raft"]');
  const manageCityBtn = popup.querySelector('[data-action="manage-city"]');
  const upgradeCityBtn = popup.querySelector('[data-action="upgrade-city"]');

  const canAct = !unit.hasMoved && !unit.hasAttacked && !unit.hasHealed && !unit.hasUsedAbility;
  
  moveBtn.disabled = unit.hasMoved || G.turnPhase !== 'player';
  attackBtn.disabled = unit.hasAttacked || G.turnPhase !== 'player' || !canAct;
  skipBtn.disabled = unit.hasMoved || G.turnPhase !== 'player';
  
  healBtn.disabled = unit.hasMoved || unit.hasAttacked || unit.hasHealed || unit.hasUsedAbility || 
                     unit.hp >= unit.maxHp || G.turnPhase !== 'player';
  healBtn.style.display = 'block';
  
  if (unit.isGeneral) {
    invigorateBtn.style.display = 'block';
    invigorateBtn.disabled = unit.hasMoved || unit.hasAttacked || unit.hasHealed || unit.hasUsedAbility || 
                             G.turnPhase !== 'player';
  } else {
    invigorateBtn.style.display = 'none';
  }

  buildHarborBtn.disabled = !canBuildHarbor(unit);
  buildRaftBtn.disabled = !canBuildRaft(unit);

  const tile = G.map[unit.r]?.[unit.q];
  const city = tile && tile.city ? tile.city : null;
  const hasCity = city && city.owner === player.id;
  
  if (hasCity) {
    manageCityBtn.style.display = 'block';
    manageCityBtn.disabled = false;
    const cost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
    const reduced = player.techs.includes('architecture') ? Math.floor(cost * 0.8) : cost;
    upgradeCityBtn.style.display = 'block';
    upgradeCityBtn.disabled = city.level >= 4 || player.gold < reduced;
    G.selectedCity = city;
  } else {
    manageCityBtn.style.display = 'none';
    upgradeCityBtn.style.display = 'none';
  }

  if (unit && !unit.isNaval) {
    buildHarborBtn.style.display = 'block';
    buildRaftBtn.style.display = 'block';
  } else {
    buildHarborBtn.style.display = 'none';
    buildRaftBtn.style.display = 'none';
  }
}

popup.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const action = btn.dataset.action;
    if (action === 'move') {
      if (G.selectedHex) {
        tryMoveUnit();
      }
    } else if (action === 'attack') {
      if (G.selectedHex) {
        tryAttackUnit();
      }
    } else if (action === 'skip') {
      if (G.selectedUnit) {
        G.selectedUnit.hasMoved = true;
        G.selectedUnit = null;
        updateUI(); render(); hideActionPopup();
        saveGame();
      }
    } else if (action === 'heal') {
      tryHealUnit();
    } else if (action === 'invigorate') {
      tryInvigorate();
    } else if (action === 'build-harbor') {
      if (G.selectedUnit) {
        if (buildHarbor(G.selectedUnit)) {
          updateVisibility();
          updateUI(); render(); hideActionPopup();
        }
      }
    } else if (action === 'build-raft') {
      if (G.selectedUnit) {
        if (buildRaft(G.selectedUnit)) {
          updateVisibility();
          updateUI(); render(); hideActionPopup();
        }
      }
    } else if (action === 'manage-city') {
      if (G.selectedCity) {
        openCityProduction();
      } else if (G.selectedHarbor) {
        manageHarbor();
      } else if (G.selectedUnit) {
        const tile = G.map[G.selectedUnit.r]?.[G.selectedUnit.q];
        if (tile && tile.city && tile.city.owner === G.selectedUnit.tribeId) {
          G.selectedCity = tile.city;
          openCityProduction();
        }
      }
    } else if (action === 'upgrade-city') {
      if (G.selectedCity) {
        upgradeCity(G.selectedCity);
      } else if (G.selectedUnit) {
        const tile = G.map[G.selectedUnit.r]?.[G.selectedUnit.q];
        if (tile && tile.city && tile.city.owner === G.selectedUnit.tribeId) {
          G.selectedCity = tile.city;
          upgradeCity(G.selectedCity);
        }
      }
    }
  });
});

// ─── RENDER ──────────────────────────────────────────────────
function render() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  const w = canvas.width, h = canvas.height;

  const grad = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w*0.75);
  grad.addColorStop(0, '#1B2A6B');
  grad.addColorStop(1, '#0a0f2a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  const size = G.hexSize;
  if (!camera.centered) centerCamera();

  ctx.save();
  ctx.translate(camera.x, camera.y);
  ctx.scale(camera.zoom, camera.zoom);

  const player = G.tribes.find(t => t.isPlayer);
  const influenceMap = computeInfluenceMap();

  let reachableTiles = [];
  let attackableTiles = [];
  if (G.selectedUnit && G.selectedUnit.tribeId === player.id && !G.gameOver && G.turnPhase === 'player') {
    const unit = G.selectedUnit;
    // Only compute reachable if unit hasn't moved
    if (!unit.hasMoved) {
      const queue = [{ q: unit.q, r: unit.r, dist: 0 }];
      const visited = new Set();
      visited.add(hexKey(unit.q, unit.r));
      while (queue.length > 0) {
        const cur = queue.shift();
        if (cur.dist > 0) {
          const tile = G.map[cur.r]?.[cur.q];
          if (tile && !tile.unit && isTilePassable(cur.q, cur.r, unit.isNaval)) {
            reachableTiles.push({ q: cur.q, r: cur.r });
          }
        }
        if (cur.dist >= unit.move) continue;
        const neighbors = hexNeighbors(cur.q, cur.r);
        for (const n of neighbors) {
          if (!inMap(n.q, n.r)) continue;
          const key = hexKey(n.q, n.r);
          if (visited.has(key)) continue;
          const tile = G.map[n.r]?.[n.q];
          if (!tile) continue;
          if (tile.unit && tile.unit.tribeId !== unit.tribeId) continue;
          if (!isTilePassable(n.q, n.r, unit.isNaval)) continue;
          const cost = getUnitMoveCost(unit, n.q, n.r);
          if (cur.dist + cost > unit.move) continue;
          visited.add(key);
          queue.push({ q: n.q, r: n.r, dist: cur.dist + cost });
        }
      }
    }
    // Only compute attackable if unit hasn't attacked
    if (!unit.hasAttacked) {
      for (const enemy of G.units) {
        if (enemy.tribeId === unit.tribeId) continue;
        if (!enemy.active) continue;
        const dist = hexDistance({ q: unit.q, r: unit.r }, { q: enemy.q, r: enemy.r });
        if (dist <= unit.attackRange && dist > 0) {
          attackableTiles.push({ q: enemy.q, r: enemy.r });
        }
      }
    }
  }

  for (let r = 0; r < G.mapHeight; r++) {
    for (let q = 0; q < G.mapWidth; q++) {
      const tile = G.map[r]?.[q];
      if (!tile) continue;
      const pos = hexToPixel(q, r, size);
      const cx = pos.x, cy = pos.y;

      const isVisible = tile.visible;
      const isExplored = tile.explored;

      const pts = hexPolygonShortened(cx, cy, size * 0.98);
      const hexPath = new Path2D();
      hexPath.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) hexPath.lineTo(pts[i].x, pts[i].y);
      hexPath.closePath();

      if (!isExplored) {
        ctx.fillStyle = '#0a0f1a';
        ctx.fill(hexPath);
        ctx.strokeStyle = 'rgba(60,50,40,0.3)';
        ctx.lineWidth = 1.0 / camera.zoom;
        ctx.stroke(hexPath);
        continue;
      }

      const hasCity = tile.city !== null && tile.city !== undefined;
      const city = tile.city;
      const hasHarbor = tile.harbor !== null && tile.harbor !== undefined;
      const harbor = tile.harbor;

      // ─── Terrain background ───
      if (isVisible && !hasCity && !hasHarbor) {
        let terrainKey = 'hex_plains';
        if (tile.terrain === 'forest') terrainKey = 'hex_forest';
        else if (tile.terrain === 'mountain') terrainKey = 'hex_mountain';
        else if (tile.terrain === 'water') terrainKey = 'hex_water';
        else if (tile.terrain === 'hill') terrainKey = 'hex_hill';
        const img = images[terrainKey];
        if (img && img.complete && img.naturalWidth > 0) {
          ctx.save();
          ctx.clip(hexPath);
          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          for (const p of pts) {
            if (p.x < minX) minX = p.x;
            if (p.x > maxX) maxX = p.x;
            if (p.y < minY) minY = p.y;
            if (p.y > maxY) maxY = p.y;
          }
          ctx.drawImage(img, minX, minY, maxX - minX, maxY - minY);
          ctx.restore();
        } else {
          let color = '#2a1a10';
          if (isVisible) {
            switch (tile.terrain) {
              case 'plains': color = '#4a6a3a'; break;
              case 'forest': color = '#2d5a2a'; break;
              case 'mountain': color = '#6a5a4a'; break;
              case 'water': color = '#1a3a5a'; break;
              case 'hill': color = '#5a6a4a'; break;
            }
          } else {
            color = '#1a2a1a';
          }
          ctx.fillStyle = color;
          ctx.fill(hexPath);
        }
        if (tile.isRiver) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, size * 0.3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(64,164,223,0.25)';
          ctx.fill();
          ctx.restore();
        }
      } else if (isVisible && (hasCity || hasHarbor)) {
        let bgColor = '#3a2a1a';
        if (hasCity && city && !city.isNeutral && city.owner) {
          const tribe = G.tribes.find(t => t.id === city.owner);
          if (tribe) bgColor = tribe.color;
        } else if (hasHarbor && harbor.owner) {
          const tribe = G.tribes.find(t => t.id === harbor.owner);
          if (tribe) bgColor = tribe.secondary || tribe.color;
        }
        ctx.fillStyle = bgColor;
        ctx.fill(hexPath);
        if (tile.isRiver) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, size * 0.3, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(64,164,223,0.2)';
          ctx.fill();
          ctx.restore();
        }
      } else {
        let color = '#1a2a1a';
        ctx.fillStyle = color;
        ctx.fill(hexPath);
      }

      // ─── Influence border ───
      const key = hexKey(q, r);
      const influenceColor = influenceMap[key];
      if (influenceColor && (isVisible || tile.owner === player.id)) {
        ctx.save();
        ctx.strokeStyle = influenceColor;
        ctx.lineWidth = 5 / camera.zoom;
        ctx.stroke(hexPath);
        ctx.restore();
      }

      // ─── Border ───
      let borderColor = '#d0c4b8';
      let borderWidth = 1.0 / camera.zoom;
      if (isVisible && tile.owner) {
        const tribe = G.tribes.find(t => t.id === tile.owner);
        if (tribe) {
          borderColor = tribe.color;
          borderWidth = 2.5 / camera.zoom;
        }
      }
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = borderWidth;
      ctx.stroke(hexPath);

      // ─── Reachable/attackable highlights ───
      if (isVisible) {
        const isReachable = reachableTiles.some(t => t.q === q && t.r === r);
        const isAttackable = attackableTiles.some(t => t.q === q && t.r === r);
        if (isReachable || isAttackable) {
          ctx.save();
          ctx.clip(hexPath);
          ctx.fillStyle = isAttackable ? 'rgba(255,0,0,0.3)' : 'rgba(0,255,0,0.25)';
          ctx.fillRect(pts[0].x, pts[0].y, pts[2].x - pts[0].x, pts[3].y - pts[0].y);
          ctx.restore();
          ctx.strokeStyle = isAttackable ? '#ff0000' : '#00ff00';
          ctx.lineWidth = 2.0 / camera.zoom;
          ctx.stroke(hexPath);
        }
      }

      // ─── City influence ring ───
      if (isVisible && hasCity) {
        const radius = city.level === 1 ? 0 : city.level === 2 ? 1 : city.level >= 3 ? 2 : 0;
        if (radius > 0) {
          ctx.beginPath();
          ctx.arc(cx, cy, size * (0.85 + radius * 0.3), 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255,215,0,0.15)';
          ctx.lineWidth = 1.5 / camera.zoom;
          ctx.setLineDash([3 / camera.zoom, 5 / camera.zoom]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // ─── Draw elements on visible tiles ───
      if (isVisible) {
        // ─── Resource icon ───
        if (tile.resource && !hasCity && !hasHarbor) {
          const resKey = RESOURCE_MAP[tile.resource];
          const resImg = resKey ? images[resKey] : null;
          if (resImg && resImg.complete && resImg.naturalWidth > 0) {
            const rSize = size * 0.4;
            ctx.drawImage(resImg, cx - rSize/2, cy + size*0.2 - rSize/2, rSize, rSize);
          } else {
            ctx.save();
            ctx.font = `${size * 0.35}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.shadowColor = 'rgba(0,0,0,0.7)';
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#f0e6d3';
            ctx.fillText(tile.resource, cx, cy + size * 0.42);
            ctx.restore();
          }
        }

        // ─── City ───
        if (hasCity) {
          let settlementKey = 'settlement_village';
          if (city.level === 2) settlementKey = 'settlement_town';
          else if (city.level === 3) settlementKey = 'settlement_city';
          else if (city.level >= 4) settlementKey = 'settlement_capital';
          const sImg = images[settlementKey];
          const cs = size * 1.3;
          if (sImg && sImg.complete && sImg.naturalWidth > 0) {
            ctx.drawImage(sImg, cx - cs/2, cy - cs/2 - size*0.05, cs, cs);
          } else {
            ctx.font = `${size * 0.8}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const icon = city.isNeutral ? '🏚️' : city.level === 1 ? '🏘️' : city.level === 2 ? '🏙️' : city.level >= 3 ? '🏛️' : '🏙️';
            ctx.fillStyle = '#f0e6d3';
            ctx.fillText(icon, cx, cy - size * 0.05);
          }
          // Library/University indicators with images
          if (city.hasLibrary) {
            const libImg = images['library'];
            if (libImg && libImg.complete && libImg.naturalWidth > 0) {
              const lSize = size * 0.25;
              ctx.drawImage(libImg, cx + size * 0.35 - lSize/2, cy - size * 0.4 - lSize/2, lSize, lSize);
            } else {
              ctx.save();
              ctx.font = `${size * 0.25}px sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#4fc3f7';
              ctx.fillText('📚', cx + size * 0.35, cy - size * 0.4);
              ctx.restore();
            }
          }
          if (city.hasUniversity) {
            const uniImg = images['university'];
            if (uniImg && uniImg.complete && uniImg.naturalWidth > 0) {
              const uSize = size * 0.3;
              ctx.drawImage(uniImg, cx - size * 0.35 - uSize/2, cy - size * 0.4 - uSize/2, uSize, uSize);
            } else {
              ctx.save();
              ctx.font = `${size * 0.3}px sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = '#ab47bc';
              ctx.fillText('🏛️', cx - size * 0.35, cy - size * 0.4);
              ctx.restore();
            }
          }
          if (city.name) {
            ctx.save();
            ctx.font = `${size * 0.2}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillStyle = 'rgba(240,230,211,0.6)';
            ctx.fillText(city.name, cx, cy + size * 0.55);
            ctx.restore();
          }
          if (!city.isNeutral && city.owner) {
            const tribe = G.tribes.find(t => t.id === city.owner);
            if (tribe) {
              const iconSize = size * 0.3;
              const ix = cx - iconSize/2;
              const iy = cy + size * 0.6 - iconSize/2;
              const iconKey = `tribe_${tribe.id}`;
              const iconImg = images[iconKey];
              if (iconImg && iconImg.complete && iconImg.naturalWidth > 0) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(ix + iconSize/2, iy + iconSize/2, iconSize/2 + 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fill();
                ctx.drawImage(iconImg, ix, iy, iconSize, iconSize);
                ctx.restore();
              } else {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `${iconSize * 0.9}px sans-serif`;
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#ffffff';
                ctx.fillText(tribe.icon, ix + iconSize/2, iy + iconSize/2);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 2.5;
                ctx.strokeText(tribe.icon, ix + iconSize/2, iy + iconSize/2);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(tribe.icon, ix + iconSize/2, iy + iconSize/2);
                ctx.restore();
              }
            }
          }
          // ─── Production ring ───
          if (city.project) {
            let cost = 0;
            let ringColor = '#ffd700';
            let progressVal = city.progress;
            if (city.project.type === 'unit') {
              const tribeData = TRIBES_DATA.find(t => t.id === city.owner);
              if (tribeData) {
                const unitDef = tribeData.units[city.project.id];
                if (unitDef) cost = unitDef.cost;
              }
              ringColor = '#ffd700';
            } else if (city.project.type === 'tech') {
              cost = getTechCost(city.project.id);
              const cityTribe = getTribe(city.owner);
              progressVal = cityTribe ? cityTribe.researchProgress[city.project.id] || 0 : 0;
              ringColor = '#4fc3f7';
            } else if (city.project.type === 'wonder') {
              cost = getWonderCost(city.project.id);
              ringColor = '#ab47bc';
            }
            if (cost > 0 && progressVal > 0) {
              const pct = Math.min(1, progressVal / cost);
              ctx.beginPath();
              ctx.arc(cx, cy + size * 0.4, size * 0.2, -Math.PI/2, -Math.PI/2 + pct * 2 * Math.PI);
              ctx.strokeStyle = ringColor;
              ctx.lineWidth = 3.0 / camera.zoom;
              ctx.stroke();
            }
          }
          ctx.beginPath();
          ctx.arc(cx, cy + size * 0.4, size * 0.2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,215,0,0.12)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255,215,0,0.25)';
          ctx.lineWidth = 1.5 / camera.zoom;
          ctx.stroke();
        }

        // ─── Harbor ───
        if (hasHarbor) {
          const hSize = size * 0.5;
          ctx.save();
          ctx.font = `${hSize}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 15 / camera.zoom;
          ctx.fillStyle = '#f0e6d3';
          ctx.fillText('⚓', cx, cy - size * 0.05);
          ctx.shadowBlur = 0;
          ctx.restore();
          if (harbor.project) {
            const tribeData = TRIBES_DATA.find(t => t.id === harbor.owner);
            let cost = 0;
            if (tribeData) {
              const unitDef = tribeData.units[harbor.project.id];
              if (unitDef) cost = unitDef.cost;
            }
            if (cost > 0) {
              const pct = Math.min(1, harbor.production / cost);
              ctx.beginPath();
              ctx.arc(cx, cy + size * 0.4, size * 0.18, -Math.PI/2, -Math.PI/2 + pct * 2 * Math.PI);
              ctx.strokeStyle = '#00bcd4';
              ctx.lineWidth = 2.5 / camera.zoom;
              ctx.stroke();
            }
          }
        }

        // ─── Unit ───
        if (tile.unit) {
          const unit = tile.unit;
          const tribe = G.tribes.find(t => t.id === unit.tribeId);
          const unitKey = tribe ? `${tribe.id}_${unit.type}` : 'unit_foot';
          const img = images[unitKey];
          const us = size * 0.7;

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy - size * 0.05, us * 0.6, 0, Math.PI * 2);
          const tribeColor = tribe ? tribe.color : '#ffffff';
          ctx.fillStyle = tribeColor + '59';
          ctx.fill();
          ctx.restore();
          
          if (unit.boosted) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy - size * 0.05, us * 0.75, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(155,89,182,0.6)';
            ctx.lineWidth = 3 / camera.zoom;
            ctx.setLineDash([3 / camera.zoom, 4 / camera.zoom]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();
          }

          if (unit.isNaval) {
            ctx.save();
            ctx.shadowColor = 'rgba(0,200,255,0.6)';
            ctx.shadowBlur = 30 / camera.zoom;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
          } else {
            ctx.save();
            ctx.shadowColor = 'rgba(255,220,100,0.7)';
            ctx.shadowBlur = 45 / camera.zoom;
          }

          if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, cx - us/2, cy - us/2 - size*0.05, us, us);
          } else {
            const tData = TRIBES_DATA.find(t => t.id === unit.tribeId);
            const icon = tData ? tData.icon : '⚔️';
            ctx.font = `${size * 0.7}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#f0e6d3';
            ctx.fillText(icon, cx, cy - size * 0.05);
          }
          ctx.restore();

          // ─── Veteran / Legendary icon ───
          if (unit.veteranLevel > 0) {
            const iconKey = unit.veteranLevel === 1 ? 'veteran' : 'legendary';
            const vImg = images[iconKey];
            const vSize = unit.veteranLevel === 1 ? size * 0.25 : size * 0.3;
            const vx = cx + us/2 - vSize/2;
            const vy = cy - size*0.05 - us/2 - vSize/2;
            if (vImg && vImg.complete && vImg.naturalWidth > 0) {
              ctx.drawImage(vImg, vx, vy, vSize, vSize);
            } else {
              ctx.save();
              ctx.font = `${vSize}px sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillStyle = unit.veteranLevel === 1 ? '#ffaa00' : '#ff4444';
              ctx.shadowColor = 'rgba(0,0,0,0.9)';
              ctx.shadowBlur = 6;
              ctx.fillText(unit.veteranLevel === 1 ? '★' : '⭐', vx + vSize/2, vy + vSize/2);
              ctx.restore();
            }
          }

          const hpPct = unit.hp / unit.maxHp;
          const barW = size * 0.5, barH = 5 / camera.zoom;
          const bx = cx - barW/2, by = cy + size * 0.42;
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(bx, by, barW, barH);
          ctx.fillStyle = hpPct > 0.5 ? '#4caf50' : hpPct > 0.25 ? '#ff9800' : '#e53935';
          ctx.fillRect(bx, by, barW * hpPct, barH);

          if (G.selectedUnit && G.selectedUnit.id === unit.id) {
            ctx.beginPath();
            ctx.arc(cx, cy, size * 0.6, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 2.5 / camera.zoom;
            ctx.setLineDash([4 / camera.zoom, 6 / camera.zoom]);
            ctx.stroke();
            ctx.setLineDash([]);
          }
        }

        // Selection highlights
        if (G.selectedHex && G.selectedHex.q === q && G.selectedHex.r === r) {
          ctx.beginPath();
          ctx.arc(cx, cy, size * 0.45, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255,215,0,0.2)';
          ctx.lineWidth = 2 / camera.zoom;
          ctx.stroke();
        }

        if (G.selectedCity && G.selectedCity.q === q && G.selectedCity.r === r) {
          ctx.beginPath();
          ctx.arc(cx, cy, size * 0.55, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0,255,200,0.4)';
          ctx.lineWidth = 2 / camera.zoom;
          ctx.stroke();
        }
        if (G.selectedHarbor && G.selectedHarbor.q === q && G.selectedHarbor.r === r) {
          ctx.beginPath();
          ctx.arc(cx, cy, size * 0.55, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(0,200,255,0.5)';
          ctx.lineWidth = 2 / camera.zoom;
          ctx.stroke();
        }
      } else {
        if (tile.city) {
          ctx.font = `${size * 0.4}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(100,80,60,0.4)';
          ctx.fillText('🏚️', cx, cy);
        }
        if (tile.unit) {
          ctx.font = `${size * 0.4}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(100,80,60,0.4)';
          ctx.fillText('⚔️', cx, cy);
        }
      }
    }
  }
  ctx.restore();

  if (G.eliminationMessages.length > 0) {
    const msg = G.eliminationMessages[G.eliminationMessages.length - 1];
    ctx.fillStyle = 'rgba(255,200,100,0.9)';
    ctx.font = '18px Afacad, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText(msg, w/2, 60);
  }

  if (G.gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, w, h);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '52px MedievalSharp, serif';

// ─── CANVAS INTERACTION ──────────────────────────────────
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let camStartX = 0, camStartY = 0;
let mouseDownPos = { x: 0, y: 0 };
let isClick = false;
let lastTouchDist = 0;
let touchStartPos = { x: 0, y: 0 };

// Improved unit selection: click on a unit pixel instead of hex grid
function handleClick(sx, sy) {
  if (G.gameOver || G.turnPhase !== 'player') return;
  const rect = canvas.getBoundingClientRect();
  // sx, sy are in canvas coordinates (already scaled)
  // Use them directly.

  // Check if clicked on a unit (proximity-based)
  const player = G.tribes.find(t => t.isPlayer);
  if (!player) return;

  // Convert screen coordinates to world coordinates using camera
  const world = screenToWorld(sx, sy);

  // Check if we clicked on a unit belonging to the player
  let clickedUnit = null;
  let minDist = 40; // threshold in world units (pixels)
  for (const unit of G.units) {
    if (!unit.active) continue;
    if (unit.tribeId !== player.id) continue;
    // Get pixel position of unit
    const pos = hexToPixel(unit.q, unit.r, G.hexSize);
    const dx = pos.x - world.x;
    const dy = pos.y - world.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < minDist) {
      minDist = dist;
      clickedUnit = unit;
    }
  }

  if (clickedUnit) {
    G.selectedUnit = clickedUnit;
    G.selectedCity = null;
    G.selectedHarbor = null;
    // Check if unit is on a city
    const tile = G.map[clickedUnit.r]?.[clickedUnit.q];
    if (tile && tile.city && tile.city.owner === player.id) {
      G.selectedCity = tile.city;
    }
    showActionPopup(sx, sy);
    updateUI(); render();
    return;
  }

  // If no unit, try to select a city or harbor via hex grid
  const hex = getHexFromScreen(sx, sy);
  if (!inMap(hex.q, hex.r)) return;
  G.selectedHex = hex;
  const tile = G.map[hex.r]?.[hex.q];

  if (tile && tile.city && tile.visible) {
    const city = tile.city;
    if (city.owner === player.id) {
      G.selectedCity = city;
      G.selectedUnit = null;
      G.selectedHarbor = null;
      openCityProduction();
      return;
    }
  }

  if (tile && tile.harbor && tile.visible) {
    const harbor = tile.harbor;
    if (harbor.owner === player.id) {
      G.selectedHarbor = harbor;
      G.selectedUnit = null;
      G.selectedCity = null;
      manageHarbor();
      return;
    }
  }

  // If clicked on an enemy unit, initiate attack if we have a selected unit
  if (G.selectedUnit && tile && tile.unit && tile.unit.tribeId !== player.id) {
    const dist = hexDistance({ q: G.selectedUnit.q, r: G.selectedUnit.r }, { q: hex.q, r: hex.r });
    if (dist <= G.selectedUnit.attackRange && !G.selectedUnit.hasAttacked) {
      tryAttackUnit();
      return;
    }
  }

  // If clicked on a reachable tile and we have a selected unit, try to move
  if (G.selectedUnit && tile && !tile.unit && isTilePassable(hex.q, hex.r, G.selectedUnit.isNaval)) {
    const dist = hexDistance({ q: G.selectedUnit.q, r: G.selectedUnit.r }, { q: hex.q, r: hex.r });
    if (dist <= G.selectedUnit.move && !G.selectedUnit.hasMoved) {
      // Set the hex before moving
      G.selectedHex = hex;
      tryMoveUnit();
      return;
    }
  }

  // Deselect
  G.selectedUnit = null;
  G.selectedCity = null;
  G.selectedHarbor = null;
  hideActionPopup();
  updateUI(); render();
}

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
  mouseDownPos.x = sx;
  mouseDownPos.y = sy;
  camStartX = camera.x;
  camStartY = camera.y;
  isClick = true;
  isDragging = false;
});

canvas.addEventListener('mousemove', (e) => {
  if (e.buttons === 0) { isDragging = false; return; }
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
  const dx = sx - mouseDownPos.x;
  const dy = sy - mouseDownPos.y;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
    isClick = false;
    isDragging = true;
    camera.x = camStartX + dx;
    camera.y = camStartY + dy;
    render();
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (isClick) {
    const rect = canvas.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
    handleClick(sx, sy);
  }
  isDragging = false;
});

canvas.addEventListener('mouseleave', () => { isDragging = false; });

// Touch events - fixed panning
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touches = e.touches;
  if (touches.length === 1) {
    const t = touches[0];
    const rect = canvas.getBoundingClientRect();
    const sx = (t.clientX - rect.left) * (canvas.width / rect.width);
    const sy = (t.clientY - rect.top) * (canvas.height / rect.height);
    mouseDownPos.x = sx;
    mouseDownPos.y = sy;
    touchStartPos.x = sx;
    touchStartPos.y = sy;
    camStartX = camera.x;
    camStartY = camera.y;
    isClick = true;
    isDragging = false;
  } else if (touches.length === 2) {
    const t1 = touches[0], t2 = touches[1];
    const rect = canvas.getBoundingClientRect();
    const sx1 = (t1.clientX - rect.left) * (canvas.width / rect.width);
    const sy1 = (t1.clientY - rect.top) * (canvas.height / rect.height);
    const sx2 = (t2.clientX - rect.left) * (canvas.width / rect.width);
    const sy2 = (t2.clientY - rect.top) * (canvas.height / rect.height);
    const dist = Math.hypot(sx2 - sx1, sy2 - sy1);
    lastTouchDist = dist;
    isDragging = false;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touches = e.touches;
  if (touches.length === 1) {
    const t = touches[0];
    const rect = canvas.getBoundingClientRect();
    const sx = (t.clientX - rect.left) * (canvas.width / rect.width);
    const sy = (t.clientY - rect.top) * (canvas.height / rect.height);
    const dx = sx - mouseDownPos.x;
    const dy = sy - mouseDownPos.y;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
      isClick = false;
      isDragging = true;
    }
    if (isDragging) {
      camera.x = camStartX + dx;
      camera.y = camStartY + dy;
      render();
    }
  } else if (touches.length === 2) {
    const t1 = touches[0], t2 = touches[1];
    const rect = canvas.getBoundingClientRect();
    const sx1 = (t1.clientX - rect.left) * (canvas.width / rect.width);
    const sy1 = (t1.clientY - rect.top) * (canvas.height / rect.height);
    const sx2 = (t2.clientX - rect.left) * (canvas.width / rect.width);
    const sy2 = (t2.clientY - rect.top) * (canvas.height / rect.height);
    const dist = Math.hypot(sx2 - sx1, sy2 - sy1);
    if (lastTouchDist > 0) {
      const scale = dist / lastTouchDist;
      const newZoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom * scale));
      if (newZoom !== camera.zoom) {
        const cx = (sx1 + sx2) / 2, cy = (sy1 + sy2) / 2;
        const worldBefore = screenToWorld(cx, cy);
        camera.zoom = newZoom;
        const worldAfter = screenToWorld(cx, cy);
        camera.x += (worldAfter.x - worldBefore.x) * camera.zoom;
        camera.y += (worldAfter.y - worldBefore.y) * camera.zoom;
        camera.centered = true;
        render();
      }
    }
    lastTouchDist = dist;
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (e.touches.length === 0) {
    if (isClick) {
      const rect = canvas.getBoundingClientRect();
      const sx = (mouseDownPos.x) * (canvas.width / rect.width);
      const sy = (mouseDownPos.y) * (canvas.height / rect.height);
      handleClick(sx, sy);
    }
    isDragging = false;
    lastTouchDist = 0;
  }
}, { passive: false });

// ─── MOUSE WHEEL ZOOM ──────────────────────────────
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const sy = (e.clientY - rect.top) * (canvas.height / rect.height);

  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  const newZoom = Math.min(camera.maxZoom, Math.max(camera.minZoom, camera.zoom + delta));

  if (newZoom === camera.zoom) return;

  const worldBefore = screenToWorld(sx, sy);
  camera.zoom = newZoom;
  const worldAfter = screenToWorld(sx, sy);

  camera.x += (worldAfter.x - worldBefore.x) * camera.zoom;
  camera.y += (worldAfter.y - worldBefore.y) * camera.zoom;
  camera.centered = true;

  render();
}, { passive: false });

function updateOpponentList() {
  const container = document.getElementById('opponent-list');
  container.innerHTML = '';
  // Default opponents based on mode
  let selected = G.opponents;
  if (!selected || selected.length === 0) {
    // Generate default list based on selected tribe and mode
    const playerTribe = document.querySelector('#step-tribe .ng-tribe-item.active');
    const playerId = playerTribe ? playerTribe.dataset.tribe : 'zulu';
    const avail = TRIBES_DATA.filter(t => t.id !== playerId);
    const shuffled = avail.sort(() => Math.random() - 0.5);
    if (selectedMode === 'oba') {
      selected = avail.map(t => t.id);
    } else if (selectedMode === 'sandsoftime' || selectedMode === 'conquest') {
      selected = shuffled.slice(0, 5).map(t => t.id);
    } else if (selectedMode === 'custom') {
      const count = parseInt(document.getElementById('custom-opponents').value) || 5;
      selected = shuffled.slice(0, Math.min(count, shuffled.length)).map(t => t.id);
    }
    G.opponents = selected;
  }
  for (const id of selected) {
    const t = TRIBES_DATA.find(t => t.id === id);
    if (t) {
      const span = document.createElement('span');
      span.className = 'opp-tag';
      span.textContent = `${t.icon} ${t.name}`;
      container.appendChild(span);
    }
  }
  if (selected.length === 0) { container.textContent = 'No opponents selected.'; container.style.color = '#6b4f3a'; }
  updateCampaignSummary();
}

    div.dataset.tribe = t.id;
    const iconKey = `tribe_${t.id}`;
    const iconImg = images[iconKey];
    let iconHtml = '';
    if (iconImg && iconImg.complete && iconImg.naturalWidth > 0) {
      iconHtml = `<img src="${iconImg.src}" style="width:36px;height:36px;display:block;margin:0 auto;border-radius:4px;" />`;
    } else {
      iconHtml = `<span class="tribe-icon">${t.icon}</span>`;
    }
    div.innerHTML = iconHtml + `<span class="tribe-name">${t.name}</span><span class="tribe-desc">${t.desc}</span>`;
    div.addEventListener('click', () => {
      document.querySelectorAll('#step-tribe .ng-tribe-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
      // Update opponent list if needed
      updateOpponentList();
    });
    grid.appendChild(div);
  });
}

// ─── MAIN INIT ──────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const textLogo = document.getElementById('menu-text-logo');
  if (textLogo) textLogo.style.display = 'block';

  // Enable Load Game if save exists
  const loadBtn = document.getElementById('load-game-btn');
  if (checkSaveExists()) {
    loadBtn.disabled = false;
    loadBtn.classList.remove('secondary');
    loadBtn.classList.add('primary');
  }

  showScreen('menu-screen');

  loadImages(() => {
    showScreen('menu-screen');
    populateTribeGrid();
    // Init opponents for summary
    const playerTribe = document.querySelector('#step-tribe .ng-tribe-item.active');
    const playerId = playerTribe ? playerTribe.dataset.tribe : 'zulu';
    const avail = TRIBES_DATA.filter(t => t.id !== playerId);
    const shuffled = avail.sort(() => Math.random() - 0.5);
    G.opponents = shuffled.slice(0, 5).map(t => t.id);
    updateOpponentList();

    // Handle mode selection events
    document.querySelectorAll('.ng-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectMode(btn);
        // Update opponent list when mode changes (custom may change count)
        updateOpponentList();
      });
    });

    // Add AI / Remove AI buttons for opponents
    document.getElementById('add-ai-btn').addEventListener('click', () => {
      const playerTribe = document.querySelector('#step-tribe .ng-tribe-item.active');
      const playerId = playerTribe ? playerTribe.dataset.tribe : 'zulu';
      const avail = TRIBES_DATA.filter(t => t.id !== playerId && !G.opponents.includes(t.id));
      if (avail.length === 0) return;
      const pick = avail[Math.floor(Math.random() * avail.length)];
      G.opponents.push(pick.id);
      updateOpponentList();
    });

    document.getElementById('remove-ai-btn').addEventListener('click', () => {
      if (G.opponents.length <= 1) return;
      G.opponents.pop();
      updateOpponentList();
    });

    document.getElementById('start-game-btn').addEventListener('click', setupNewGame);

    // Custom options changes
    document.getElementById('custom-opponents').addEventListener('input', () => {
      if (selectedMode === 'custom') {
        const count = parseInt(document.getElementById('custom-opponents').value) || 5;
        const playerTribe = document.querySelector('#step-tribe .ng-tribe-item.active');
        const playerId = playerTribe ? playerTribe.dataset.tribe : 'zulu';
        const avail = TRIBES_DATA.filter(t => t.id !== playerId);
        const shuffled = avail.sort(() => Math.random() - 0.5);
        G.opponents = shuffled.slice(0, Math.min(count, shuffled.length)).map(t => t.id);
        updateOpponentList();
      }
    });

    document.getElementById('custom-turns').addEventListener('input', updateCampaignSummary);
    document.getElementById('custom-difficulty').addEventListener('change', updateCampaignSummary);

    window.addEventListener('resize', () => {
      if (G.screen === 'game-screen') {
        camera.centered = false;
        centerCameraOnPlayerCity();
        render();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (G.screen === 'game-screen') {
        if (e.key === 'e' || e.key === 'E') endTurn();
        if (e.key === 'm' || e.key === 'M') { if (G.selectedUnit && !G.selectedUnit.hasMoved) tryMoveUnit(); }
        if (e.key === 'a' || e.key === 'A') { if (G.selectedUnit && !G.selectedUnit.hasAttacked) tryAttackUnit(); }
        if (e.key === 'h' || e.key === 'H') { tryHealUnit(); }
        if (e.key === 'i' || e.key === 'I') { tryInvigorate(); }
        if (e.key === ' ') { e.preventDefault(); if (G.selectedUnit) { G.selectedUnit.hasMoved = true; G.selectedUnit = null; hideActionPopup(); updateUI(); render(); saveGame(); } }
        if (e.key === 'Escape') showInGameMenu();
        if (e.key === 'b' || e.key === 'B') {
          if (G.selectedCity) openCityProduction();
          else if (G.selectedHarbor) manageHarbor();
        }
        if (e.key === 't' || e.key === 'T') showTechTree();
        if (e.key === 'p' || e.key === 'P') showProgressModal();
      }
    });

    console.log('Oba v7.4 – Logo width fixed, subtitle enhanced, movement glitch resolved.');
  });
});
</script>
</body>
</html>
