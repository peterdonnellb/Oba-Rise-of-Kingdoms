const SAVE_KEY = 'oba_save';

function saveGame() {
  try {
    const data = {
      G: G,
      camera: camera,
      usedSettlementNames: usedSettlementNames,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('Save failed:', e);
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.G) return false;
    // Restore G
    Object.assign(G, data.G);
    // Restore camera
    Object.assign(camera, data.camera);
    // Restore settlement names
    usedSettlementNames = data.usedSettlementNames || [];
    // Rebuild map reference pointers (cities, harbors, units)
    for (let r = 0; r < G.mapHeight; r++) {
      for (let q = 0; q < G.mapWidth; q++) {
        const tile = G.map[r][q];
        const city = G.cities.find(c => c.q === q && c.r === r);
        tile.city = city || null;
        const unit = G.units.find(u => u.q === q && u.r === r);
        tile.unit = unit || null;
        const harbor = G.harbors.find(h => h.q === q && h.r === r);
        tile.harbor = harbor || null;
      }
    }
    for (const tribe of G.tribes) {
      tribe.cities = G.cities.filter(c => c.owner === tribe.id);
      tribe.units = G.units.filter(u => u.tribeId === tribe.id);
    }
    G.aliveTribes = G.tribes.filter(t => t.alive);
    updateVisibility();
    updateUI();
    render();
    showScreen('game-screen');
    return true;
  } catch (e) {
    console.warn('Load failed:', e);
    return false;
  }
}

function checkSaveExists() {
  return localStorage.getItem(SAVE_KEY) !== null;
}

// ─── HEX UTILITIES ───────────────────────────────────────────
function hexCornerShortened(cx, cy, size, i) {
  const angle = Math.PI / 180 * (60 * i - 30);
  let dx = size * Math.cos(angle);
  let dy = size * Math.sin(angle);
  dy *= 0.8;
  return { x: cx + dx, y: cy + dy };
}
function hexPolygonShortened(cx, cy, size) {
  const pts = [];
  for (let i = 0; i < 6; i++) pts.push(hexCornerShortened(cx, cy, size, i));
  return pts;
}
function hexToPixel(q, r, size) {
  const x = size * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
  const y = size * (3 / 2 * r * 0.8);
  return { x, y };
}
function pixelToHex(px, py, size) {
  const adjustedPy = py / 0.8;
  const q = (Math.sqrt(3) / 3 * px - 1 / 3 * adjustedPy) / size;
  const r = (2 / 3 * adjustedPy) / size;
  return hexRound(q, r);
}
function hexRound(q, r) {
  const s = -q - r;
  let rq = Math.round(q), rr = Math.round(r), rs = Math.round(s);
  const dq = Math.abs(rq - q), dr = Math.abs(rr - r), ds = Math.abs(rs - s);
  if (dq > dr && dq > ds) rq = -rr - rs;
  else if (dr > ds) rr = -rq - rs;
  return { q: rq, r: rr };
}
function hexDistance(a, b) {
  return (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.q + a.r - b.q - b.r)) / 2;
}
function hexNeighbors(q, r) {
  const dirs = [[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
  return dirs.map(d => ({ q: q + d[0], r: r + d[1] }));
}
function hexKey(q, r) { return q + ',' + r; }
function inMap(q, r) { return q >= 0 && q < G.mapWidth && r >= 0 && r < G.mapHeight; }
function worldToScreen(wx, wy) { return { x: wx * camera.zoom + camera.x, y: wy * camera.zoom + camera.y }; }
function screenToWorld(sx, sy) { return { x: (sx - camera.x) / camera.zoom, y: (sy - camera.y) / camera.zoom }; }
function getHexFromScreen(sx, sy) {
  const w = screenToWorld(sx, sy);
  return pixelToHex(w.x, w.y, G.hexSize);
}
function centerCamera() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const size = G.hexSize;
  const centerWorld = hexToPixel(G.mapWidth/2, G.mapHeight/2, size);
  camera.x = w/2 - centerWorld.x * camera.zoom;
  camera.y = h/2 - centerWorld.y * camera.zoom;
  camera.centered = true;
}

function centerCameraOnPlayerCity() {
  const player = G.tribes.find(t => t.isPlayer);
  if (!player || player.cities.length === 0) {
    centerCamera();
    return;
  }
  const city = player.cities[0];
  const size = G.hexSize;
  const pos = hexToPixel(city.q, city.r, size);
  const rect = canvas.parentElement.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  camera.x = w/2 - pos.x * camera.zoom;
  camera.y = h/2 - pos.y * camera.zoom;
  camera.centered = true;
  render();
}

// ─── INFLUENCE ──────────────────────────────────────────────
function getCityInfluence(city) {
  const radius = city.level === 1 ? 0 : city.level === 2 ? 1 : city.level >= 3 ? 2 : 0;
  const tiles = [];
  for (let dr = -radius; dr <= radius; dr++) {
    for (let dq = -radius; dq <= radius; dq++) {
      const q = city.q + dq;
      const r = city.r + dr;
      if (inMap(q, r) && hexDistance({ q: city.q, r: city.r }, { q, r }) <= radius) {
        tiles.push({ q, r });
      }
    }
  }
  return tiles;
}

function computeInfluenceMap() {
  const influence = {};
  for (const city of G.cities) {
    const tiles = getCityInfluence(city);
    let color = '#555555';
    if (!city.isNeutral && city.owner) {
      const tribe = G.tribes.find(t => t.id === city.owner);
      if (tribe) color = tribe.color;
    } else if (city.isNeutral) {
      color = '#666666';
    }
    for (const t of tiles) {
      const key = hexKey(t.q, t.r);
      if (!influence[key]) {
        influence[key] = color;
      }
    }
  }
  return influence;
}

function getTribeControlledTiles(tribeId) {
  const tiles = new Set();
  const tribe = getTribe(tribeId);
  if (!tribe) return 0;
  for (const city of tribe.cities) {
    const influence = getCityInfluence(city);
    for (const tile of influence) tiles.add(hexKey(tile.q, tile.r));
  }
  return tiles.size;
}
function isTileInfluencedByOther(q, r, tribeId) {
  for (const city of G.cities) {
    if (city.owner === tribeId) continue;
    const influence = getCityInfluence(city);
    for (const tile of influence) {
      if (tile.q === q && tile.r === r) return true;
    }
  }
  return false;
}
function calculateTileYield(q, r) {
  const tile = G.map[r]?.[q];
  if (!tile) return 0;
  switch (tile.terrain) {
    case 'plains': return 1;
    case 'forest': return 2;
    case 'hill': return 2;
    case 'mountain': return 3;
    case 'water': return 1;
    default: return 0;
  }
}
function getTribeYield(tribeId) {
  const tribe = getTribe(tribeId);
  if (!tribe) return 0;
  const tiles = new Set();
  let yieldTotal = 0;
  for (const city of tribe.cities) {
    const influence = getCityInfluence(city);
    for (const tile of influence) {
      const key = hexKey(tile.q, tile.r);
      if (!tiles.has(key)) {
        tiles.add(key);
        yieldTotal += calculateTileYield(tile.q, tile.r);
      }
    }
  }
  return yieldTotal;
}

// ─── FOG OF WAR ─────────────────────────────────────────────
function updateVisibility() {
  for (let r = 0; r < G.mapHeight; r++) {
    for (let q = 0; q < G.mapWidth; q++) {
      G.map[r][q].visible = false;
    }
  }
  const player = G.tribes.find(t => t.isPlayer);
  if (!player) return;
  for (const unit of G.units) {
    if (unit.tribeId !== player.id) continue;
    const vision = getUnitVision(unit);
    const q = unit.q, r = unit.r;
    for (let dr = -vision; dr <= vision; dr++) {
      for (let dq = -vision; dq <= vision; dq++) {
        const tq = q + dq, tr = r + dr;
        if (inMap(tq, tr) && hexDistance({ q, r }, { q: tq, r: tr }) <= vision) {
          G.map[tr][tq].visible = true;
          G.map[tr][tq].explored = true;
        }
      }
    }
  }
  for (const city of G.cities) {
    if (city.owner !== player.id) continue;
    const vision = 2;
    const q = city.q, r = city.r;
    for (let dr = -vision; dr <= vision; dr++) {
      for (let dq = -vision; dq <= vision; dq++) {
        const tq = q + dq, tr = r + dr;
        if (inMap(tq, tr) && hexDistance({ q, r }, { q: tq, r: tr }) <= vision) {
          G.map[tr][tq].visible = true;
          G.map[tr][tq].explored = true;
        }
      }
    }
  }
}
function getUnitVision(unit) {
  const tribeData = TRIBES_DATA.find(t => t.id === unit.tribeId);
  if (!tribeData) return 2;
  const unitDef = tribeData.units[unit.type];
  if (!unitDef) return 2;
  let vision = unitDef.vision || 2;
  const tribe = G.tribes.find(t => t.id === unit.tribeId);
  if (tribe && tribe.wonders && tribe.wonders.includes('obelisks')) vision += 2;
  return vision;
}

// ─── HEALING FUNCTIONS ──────────────────────────────────────
function healUnit(unit) {
  if (unit.hasMoved || unit.hasAttacked || unit.hasHealed) return false;
  const healAmount = Math.max(3, Math.floor(unit.maxHp * 0.25));
  unit.hp = Math.min(unit.maxHp, unit.hp + healAmount);
  unit.hasHealed = true;
  unit.hasMoved = true;
  return true;
}

function invigorateTroops(general) {
  if (general.hasMoved || general.hasAttacked || general.hasUsedAbility) return false;
  const tribe = getTribe(general.tribeId);
  if (!tribe) return false;

  const radius = 3;
  const affectedUnits = G.units.filter(u => 
    u.tribeId === general.tribeId && 
    u.active && 
    hexDistance({ q: general.q, r: general.r }, { q: u.q, r: u.r }) <= radius
  );

  let healedCount = 0;
  let boostedCount = 0;

  for (const u of affectedUnits) {
    const healAmount = Math.max(5, Math.floor(u.maxHp * 0.4));
    if (u.hp < u.maxHp) {
      u.hp = Math.min(u.maxHp, u.hp + healAmount);
      healedCount++;
    } else {
      u.boosted = true;
      u.boostedAtk = (u.boostedAtk || 0) + 1;
      u.boostedDef = (u.boostedDef || 0) + 1;
      u.boostedTurns = 1;
      boostedCount++;
    }
  }

  general.hasUsedAbility = true;
  general.hasMoved = true;
  return { healedCount, boostedCount };
}

function clearBoostedStats(unit) {
  if (unit.boosted && unit.boostedTurns !== undefined) {
    unit.boostedTurns--;
    if (unit.boostedTurns <= 0) {
      unit.boosted = false;
      unit.boostedAtk = 0;
      unit.boostedDef = 0;
    }
  }
}

// ─── MAP GENERATION ──────────────────────────────────────────
function generateMap() {
  const w = G.mapWidth, h = G.mapHeight;
  G.map = [];

  const elevation = [];
  for (let r = 0; r < h; r++) {
    elevation[r] = [];
    for (let q = 0; q < w; q++) {
      let val = 0;
      val += Math.sin(q * 0.15 + r * 0.12) * 0.3;
      val += Math.sin(q * 0.3 + r * 0.25 + 1.2) * 0.2;
      val += Math.cos(q * 0.07 - r * 0.09 + 0.7) * 0.4;
      val += Math.random() * 0.15;
      elevation[r][q] = Math.max(0, Math.min(1, val + 0.5));
    }
  }

  for (let r = 0; r < h; r++) {
    G.map[r] = [];
    for (let q = 0; q < w; q++) {
      const elev = elevation[r][q];
      let terrain;
      if (elev < 0.25) terrain = 'water';
      else if (elev < 0.3) terrain = 'water';
      else if (elev < 0.4) terrain = 'plains';
      else if (elev < 0.5) terrain = 'plains';
      else if (elev < 0.6) terrain = 'forest';
      else if (elev < 0.7) terrain = 'forest';
      else if (elev < 0.8) terrain = 'hill';
      else if (elev < 0.9) terrain = 'hill';
      else terrain = 'mountain';
      if (terrain === 'mountain' && Math.random() < 0.5) terrain = 'hill';
      if (r === 0 || r === h-1 || q === 0 || q === w-1) {
        if (terrain === 'mountain') terrain = 'hill';
        if (Math.random() < 0.4) terrain = 'water';
      }
      G.map[r][q] = { q, r, terrain, owner: null, city: null, unit: null, harbor: null, explored: false, visible: false, isRiver: false, resource: null };
    }
  }

  // Rivers
  for (let r = 0; r < h; r++) {
    for (let q = 0; q < w; q++) {
      if (G.map[r][q].terrain === 'mountain' && Math.random() < 0.35) {
        let currentQ = q, currentR = r;
        let steps = 0;
        while (steps < 30) {
          let lowestElev = elevation[currentR][currentQ];
          let nextQ = currentQ, nextR = currentR;
          const neighbors = hexNeighbors(currentQ, currentR);
          for (const n of neighbors) {
            if (!inMap(n.q, n.r)) continue;
            if (elevation[n.r][n.q] < lowestElev) {
              lowestElev = elevation[n.r][n.q];
              nextQ = n.q; nextR = n.r;
            }
          }
          if (nextQ === currentQ && nextR === currentR) break;
          currentQ = nextQ; currentR = nextR;
          steps++;
          if (G.map[currentR][currentQ].terrain === 'water') break;
          if (G.map[currentR][currentQ].terrain !== 'mountain') {
            G.map[currentR][currentQ].terrain = 'water';
            G.map[currentR][currentQ].isRiver = true;
          }
        }
      }
    }
  }

  // Lakes
  for (let r = 2; r < h-2; r++) {
    for (let q = 2; q < w-2; q++) {
      if (G.map[r][q].terrain !== 'water' && elevation[r][q] < 0.3) {
        const neighbors = hexNeighbors(q, r);
        let waterCount = 0;
        for (const n of neighbors) {
          if (!inMap(n.q, n.r)) continue;
          if (G.map[n.r][n.q].terrain === 'water' || elevation[n.r][n.q] < 0.25) waterCount++;
        }
        if (waterCount >= 3 && Math.random() < 0.5) {
          G.map[r][q].terrain = 'water';
          for (const n of neighbors) {
            if (inMap(n.q, n.r) && Math.random() < 0.4 && G.map[n.r][n.q].terrain !== 'water') {
              G.map[n.r][n.q].terrain = 'water';
            }
          }
        }
      }
    }
  }

  // Spread mountains
  for (let r = 0; r < h; r++) {
    for (let q = 0; q < w; q++) {
      if (G.map[r][q].terrain === 'mountain') {
        let count = 0;
        const neighbors = hexNeighbors(q, r);
        for (const n of neighbors) {
          if (inMap(n.q, n.r) && G.map[n.r][n.q].terrain === 'mountain') count++;
        }
        if (count > 2) {
          G.map[r][q].terrain = 'hill';
        }
      }
    }
  }

  // Resources
  const resourceTypes = {
    mountain: ['🪙'],
    plains: ['🌾'],
    forest: ['🪵'],
    hill: ['🪨'],
    water: ['🐟']
  };
  for (let r = 0; r < h; r++) {
    for (let q = 0; q < w; q++) {
      const tile = G.map[r][q];
      if (tile.terrain === 'water') continue;
      if (tile.city) continue;
      if (Math.random() > 0.25) continue;
      const possible = resourceTypes[tile.terrain];
      if (possible && possible.length > 0) {
        tile.resource = possible[Math.floor(Math.random() * possible.length)];
      }
    }
  }
  for (let r = 0; r < h; r++) {
    for (let q = 0; q < w; q++) {
      const tile = G.map[r][q];
      if (tile.terrain === 'water' && Math.random() < 0.2) {
        tile.resource = '🐟';
      }
    }
  }

  const numVillages = Math.floor(Math.random() * 8) + 8;
  let placed = 0, attempts = 0;
  while (placed < numVillages && attempts < 500) {
    attempts++;
    const q = 2 + Math.floor(Math.random() * (w - 4));
    const r = 2 + Math.floor(Math.random() * (h - 4));
    const tile = G.map[r]?.[q];
    if (!tile) continue;
    if (tile.terrain === 'water' || tile.terrain === 'mountain') continue;
    if (tile.city) continue;
    let tooClose = false;
    for (const c of G.cities) {
      if (c.isNeutral && hexDistance({ q, r }, { q: c.q, r: c.r }) < 4) { tooClose = true; break; }
    }
    if (tooClose) continue;
    if (tile.terrain === 'plains' || tile.terrain === 'forest' || Math.random() < 0.3) {
      const city = { 
        id: G.cityIdCounter++, 
        q, r, 
        owner: null, 
        name: getUniqueSettlementName(), 
        level: 1, 
        production: 0, 
        progress: 0, 
        stockpile: 0,
        project: null, 
        isNeutral: true,
        hasLibrary: false,
        hasUniversity: false
      };
      G.cities.push(city);
      tile.city = city;
      placed++;
    }
  }
  G.neutralVillages = placed;
}

// ─── PLAYER PLACEMENT ──────────────────────────────────────
function placeStartingPositions() {
  const w = G.mapWidth, h = G.mapHeight;
  const positions = [];
  const numTribes = G.tribes.length;

  for (let i = 0; i < numTribes; i++) {
    let bestPos = null;
    let bestDist = -1;
    const attemptsPerPos = 50;

    for (let attempt = 0; attempt < attemptsPerPos; attempt++) {
      let q, r;
      const edgeBias = Math.random();
      if (edgeBias < 0.25) {
        const corner = Math.floor(Math.random() * 4);
        q = corner === 0 ? 2 : corner === 1 ? w - 3 : corner === 2 ? 2 : w - 3;
        r = corner < 2 ? 2 : h - 3;
        q += Math.floor(Math.random() * 4) - 2;
        r += Math.floor(Math.random() * 4) - 2;
      } else if (edgeBias < 0.6) {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { q = 2 + Math.floor(Math.random() * (w - 4)); r = 2; }
        else if (edge === 1) { q = 2 + Math.floor(Math.random() * (w - 4)); r = h - 3; }
        else if (edge === 2) { q = 2; r = 2 + Math.floor(Math.random() * (h - 4)); }
        else { q = w - 3; r = 2 + Math.floor(Math.random() * (h - 4)); }
      } else {
        q = 3 + Math.floor(Math.random() * (w - 6));
        r = 3 + Math.floor(Math.random() * (h - 6));
      }
      q = Math.max(1, Math.min(w - 2, q));
      r = Math.max(1, Math.min(h - 2, r));

      const tile = G.map[r]?.[q];
      if (!tile) continue;
      if (tile.terrain === 'water' || tile.terrain === 'mountain') continue;
      if (tile.city) continue;

      let minDist = Infinity;
      for (const p of positions) {
        const d = hexDistance({ q, r }, { q: p.q, r: p.r });
        if (d < minDist) minDist = d;
      }
      if (positions.length === 0) minDist = 999;

      for (const c of G.cities) {
        if (c.isNeutral) {
          const d = hexDistance({ q, r }, { q: c.q, r: c.r });
          if (d < 3) minDist = 0;
        }
      }
      if (isTileInfluencedByOther(q, r, G.tribes[i]?.id || 'none')) minDist = 0;

      if (minDist > bestDist) {
        bestDist = minDist;
        bestPos = { q, r };
      }
    }

    if (bestPos && bestDist > 2) {
      positions.push({ q: bestPos.q, r: bestPos.r, tribeIdx: i });
    } else {
      for (let rr = 0; rr < h; rr++) {
        for (let qq = 0; qq < w; qq++) {
          if (G.map[rr]?.[qq] && G.map[rr][qq].terrain !== 'water' && G.map[rr][qq].terrain !== 'mountain' && !G.map[rr][qq].city) {
            let ok = true;
            for (const p of positions) {
              if (hexDistance({ q: qq, r: rr }, { q: p.q, r: p.r }) < 4) { ok = false; break; }
            }
            if (ok) { positions.push({ q: qq, r: rr, tribeIdx: i }); break; }
          }
        }
        if (positions.length > i) break;
      }
    }
  }

  for (const pos of positions) {
    const tribe = G.tribes[pos.tribeIdx];
    if (!tribe) continue;
    const existingCity = G.map[pos.r][pos.q].city;
    if (existingCity) {
      const idx = G.cities.indexOf(existingCity);
      if (idx > -1) G.cities.splice(idx, 1);
      existingCity.owner = tribe.id;
      existingCity.isNeutral = false;
      existingCity.name = getUniqueSettlementName();
      existingCity.level = 2;
      existingCity.stockpile = 0;
      existingCity.hasLibrary = false;
      existingCity.hasUniversity = false;
      tribe.cities.push(existingCity);
      G.map[pos.r][pos.q].owner = tribe.id;
    } else {
      const city = { 
        id: G.cityIdCounter++, 
        q: pos.q, r: pos.r, 
        owner: tribe.id, 
        name: getUniqueSettlementName(), 
        level: 2, 
        production: 0, 
        progress: 0, 
        stockpile: 0,
        project: null, 
        isNeutral: false,
        hasLibrary: false,
        hasUniversity: false
      };
      G.cities.push(city);
      tribe.cities.push(city);
      G.map[pos.r][pos.q].city = city;
      G.map[pos.r][pos.q].owner = tribe.id;
    }

    const spawnTiles = [
      { q: pos.q, r: pos.r },
      { q: pos.q + 1, r: pos.r },
      { q: pos.q - 1, r: pos.r + 1 },
      { q: pos.q + 1, r: pos.r - 1 },
      { q: pos.q, r: pos.r + 1 },
    ];
    let spawnCount = 0;
    for (const st of spawnTiles) {
      if (inMap(st.q, st.r) && isTilePassable(st.q, st.r, false) && !G.map[st.r][st.q].unit) {
        const type = spawnCount === 0 ? 'foot' : spawnCount === 1 ? 'scout' : 'foot';
        if (spawnUnit(tribe.id, st.q, st.r, type)) spawnCount++;
        if (spawnCount >= 2) break;
      }
    }
    if (spawnCount === 0) {
      const neighbors = hexNeighbors(pos.q, pos.r);
      for (const n of neighbors) {
        if (inMap(n.q, n.r) && isTilePassable(n.q, n.r, false) && !G.map[n.r][n.q].unit) {
          spawnUnit(tribe.id, n.q, n.r, 'foot');
          break;
        }
      }
    }
  }
  updateVisibility();
}

function initTribes(playerTribeId, opponentIds) {
  G.tribes = []; G.aliveTribes = [];
  resetSettlementNames();
  const pTribe = TRIBES_DATA.find(t => t.id === playerTribeId);
  if (!pTribe) return;
  G.playerTribeId = playerTribeId;
  const player = {
    id: playerTribeId, name: pTribe.name, icon: pTribe.icon, color: pTribe.color, secondary: pTribe.secondary,
    isPlayer: true, alive: true, gold: G.playerGold, cities: [], units: [], techs: [], wonders: [],
    researchPoints: 0, active: true, generalActive: false, eliminated: false,
    researchProgress: {}
  };
  G.tribes.push(player); G.aliveTribes.push(player);

  const avail = TRIBES_DATA.filter(t => t.id !== playerTribeId);
  const shuffled = avail.sort(() => Math.random() - 0.5);
  const selected = opponentIds.length > 0 ? opponentIds.filter(id => id !== playerTribeId) :
                   shuffled.slice(0, Math.min(5, shuffled.length)).map(t => t.id);
  const uniqueOpps = [...new Set(selected)];
  for (const oppId of uniqueOpps) {
    const tData = TRIBES_DATA.find(t => t.id === oppId);
    if (!tData) continue;
    const opp = {
      id: tData.id, name: tData.name, icon: tData.icon, color: tData.color, secondary: tData.secondary,
      isPlayer: false, alive: true, gold: 30 + Math.floor(Math.random() * 30),
      cities: [], units: [], techs: [], wonders: [], researchPoints: 0,
      active: true, generalActive: false, ai: true, eliminated: false,
      researchProgress: {}
    };
    G.tribes.push(opp); G.aliveTribes.push(opp);
  }
  placeStartingPositions();
}

// ─── UNIT MANAGEMENT ──────────────────────────────────────
function spawnUnit(tribeId, q, r, type, hp) {
  if (!inMap(q, r)) return null;
  const tribeData = TRIBES_DATA.find(t => t.id === tribeId);
  if (!tribeData) return null;
  const unitDef = tribeData.units[type];
  if (!unitDef) return null;
  if (!isTilePassable(q, r, unitDef.isNaval)) return null;
  const tile = G.map[r]?.[q];
  if (!tile || tile.unit) return null;
  const tribe = G.tribes.find(t => t.id === tribeId);
  if (!tribe) return null;
  const unit = {
    id: G.unitIdCounter++,
    tribeId, type, q, r,
    name: unitDef.name,
    move: unitDef.move, atk: unitDef.atk, def: unitDef.def,
    hp: hp || unitDef.hp, maxHp: unitDef.hp,
    cost: unitDef.cost,
    vision: unitDef.vision || 2,
    attackRange: unitDef.attackRange || 1,
    hasMoved: false, hasAttacked: false, hasHealed: false, hasUsedAbility: false,
    isGeneral: type === 'general',
    ability: unitDef.ability || null,
    isNaval: unitDef.isNaval || false,
    active: true,
    boosted: false, boostedAtk: 0, boostedDef: 0, boostedTurns: 0,
    victories: 0, veteranLevel: 0
  };
  G.units.push(unit); tile.unit = unit; tribe.units.push(unit);
  if (tribe.isPlayer) updateVisibility();
  return unit;
}

function upgradeUnit(unit, level) {
  if (level === 1 && unit.veteranLevel < 1) {
    unit.atk += 1;
    unit.def += 1;
    unit.maxHp += 5;
    unit.hp = unit.maxHp;
    unit.veteranLevel = 1;
    queueMessage(`💪 ${unit.name} is now a Veteran!`);
  } else if (level === 2 && unit.veteranLevel < 2) {
    unit.atk += 1;
    unit.def += 1;
    unit.maxHp += 5;
    unit.hp = unit.maxHp;
    unit.veteranLevel = 2;
    queueMessage(`🏆 ${unit.name} is now Legendary!`);
  }
  updateUI();
  render();
}

function removeUnit(unit) {
  const tile = G.map[unit.r]?.[unit.q];
  if (tile && tile.unit === unit) tile.unit = null;
  const tribe = G.tribes.find(t => t.id === unit.tribeId);
  if (tribe) { const idx = tribe.units.indexOf(unit); if (idx > -1) tribe.units.splice(idx, 1); }
  const idx = G.units.indexOf(unit); if (idx > -1) G.units.splice(idx, 1);
}
function getUnitAt(q, r) { const tile = G.map[r]?.[q]; return tile ? tile.unit : null; }
function getTribe(id) { return G.tribes.find(t => t.id === id); }
function isTilePassable(q, r, isNaval) {
  const tile = G.map[r]?.[q];
  if (!tile) return false;
  if (isNaval) return tile.terrain === 'water';
  return tile.terrain !== 'water';
}
function getUnitMoveCost(unit, q, r) {
  const tile = G.map[r]?.[q];
  if (!tile) return 999;
  if (unit.isNaval) {
    if (tile.terrain === 'water') return 1;
    return 999;
  }
  if (tile.terrain === 'mountain') return 2;
  if (tile.terrain === 'forest') return 2;
  if (tile.terrain === 'hill') return 2;
  if (tile.terrain === 'water') return 999;
  return 1;
}

// ─── GOLD PURCHASE OF UNITS ──────────────────────────────
function buyUnitWithGold(city, unitType) {
  const player = getTribe(city.owner);
  if (!player) return false;
  const tribeData = TRIBES_DATA.find(t => t.id === player.id);
  if (!tribeData) return false;
  const unitDef = tribeData.units[unitType];
  if (!unitDef) return false;
  const goldCost = unitDef.cost * 2;
  if (player.gold < goldCost) { alert('Not enough gold!'); return false; }
  // Spawn unit adjacent to city
  const neighbors = hexNeighbors(city.q, city.r);
  const shuffled = neighbors.sort(() => Math.random() - 0.5);
  let placed = false;
  for (const n of shuffled) {
    if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false)) {
      const unit = spawnUnit(player.id, n.q, n.r, unitType);
      if (unit) { placed = true; break; }
    }
  }
  if (!placed) { alert('No space to place unit!'); return false; }
  player.gold -= goldCost;
  updateUI(); render();
  saveGame();
  return true;
}

// ─── LIBRARY / UNIVERSITY ────────────────────────────────
function buildLibrary(city) {
  const player = getTribe(city.owner);
  if (!player) return false;
  if (city.level < 4) { alert('City must be max level (Metropolis) to build a library.'); return false; }
  if (city.hasLibrary) { alert('Library already built.'); return false; }
  const cost = 100;
  if (player.gold < cost) { alert('Not enough gold!'); return false; }
  player.gold -= cost;
  city.hasLibrary = true;
  updateUI(); render();
  saveGame();
  return true;
}

function buildUniversity(city) {
  const player = getTribe(city.owner);
  if (!player) return false;
  if (city.level < 4) { alert('City must be max level (Metropolis) to build a university.'); return false; }
  if (!city.hasLibrary) { alert('Must build a library first.'); return false; }
  if (city.hasUniversity) { alert('University already built.'); return false; }
  const cost = 200;
  if (player.gold < cost) { alert('Not enough gold!'); return false; }
  player.gold -= cost;
  city.hasUniversity = true;
  updateUI(); render();
  saveGame();
  return true;
}

// ─── HARBOR FUNCTIONS ─────────────────────────────────────
function canBuildHarbor(unit) {
  const tribe = getTribe(unit.tribeId);
  if (!tribe) return false;
  if (!tribe.techs.includes('sailing')) return false;
  if (unit.hasMoved) return false;
  const neighbors = hexNeighbors(unit.q, unit.r);
  for (const n of neighbors) {
    if (!inMap(n.q, n.r)) continue;
    const tile = G.map[n.r]?.[n.q];
    if (!tile) continue;
    if (tile.terrain !== 'water') continue;
    if (tile.harbor) continue;
    const landNeighbors = hexNeighbors(n.q, n.r);
    let hasOwnedLand = false;
    for (const ln of landNeighbors) {
      if (!inMap(ln.q, ln.r)) continue;
      const landTile = G.map[ln.r]?.[ln.q];
      if (landTile && landTile.terrain !== 'water' && landTile.owner === tribe.id) {
        hasOwnedLand = true;
        break;
      }
    }
    if (hasOwnedLand) return true;
  }
  return false;
}
function buildHarbor(unit) {
  if (!canBuildHarbor(unit)) return false;
  const tribe = getTribe(unit.tribeId);
  const neighbors = hexNeighbors(unit.q, unit.r);
  for (const n of neighbors) {
    if (!inMap(n.q, n.r)) continue;
    const tile = G.map[n.r]?.[n.q];
    if (!tile || tile.terrain !== 'water' || tile.harbor) continue;
    const landNeighbors = hexNeighbors(n.q, n.r);
    let hasOwnedLand = false;
    for (const ln of landNeighbors) {
      if (!inMap(ln.q, ln.r)) continue;
      const landTile = G.map[ln.r]?.[ln.q];
      if (landTile && landTile.terrain !== 'water' && landTile.owner === tribe.id) {
        hasOwnedLand = true;
        break;
      }
    }
    if (hasOwnedLand) {
      const harbor = { id: G.harborIdCounter++, q: n.q, r: n.r, owner: tribe.id, production: 0, project: null };
      G.harbors.push(harbor);
      tile.harbor = harbor;
      unit.hasMoved = true;
      updateVisibility();
      saveGame();
      return true;
    }
  }
  return false;
}
function canBuildRaft(unit) {
  const tribe = getTribe(unit.tribeId);
  if (!tribe) return false;
  if (!tribe.techs.includes('sailing')) return false;
  if (unit.hasMoved) return false;
  if (unit.isNaval) return false;
  if (tribe.gold < 20) return false;
  const tile = G.map[unit.r]?.[unit.q];
  if (!tile || tile.terrain !== 'forest') return false;
  const neighbors = hexNeighbors(unit.q, unit.r);
  for (const n of neighbors) {
    if (!inMap(n.q, n.r)) continue;
    const waterTile = G.map[n.r]?.[n.q];
    if (waterTile && waterTile.terrain === 'water' && !waterTile.unit) {
      return true;
    }
  }
  return false;
}
function buildRaft(unit) {
  if (!canBuildRaft(unit)) return false;
  const tribe = getTribe(unit.tribeId);
  const neighbors = hexNeighbors(unit.q, unit.r);
  for (const n of neighbors) {
    if (!inMap(n.q, n.r)) continue;
    const waterTile = G.map[n.r]?.[n.q];
    if (waterTile && waterTile.terrain === 'water' && !waterTile.unit) {
      const raft = spawnUnit(tribe.id, n.q, n.r, 'raft');
      if (raft) {
        tribe.gold -= 20;
        unit.hasMoved = true;
        updateVisibility();
        saveGame();
        return true;
      }
    }
  }
  return false;
}
function processHarborProduction(harbor) {
  if (!harbor.project) return;
  const tribe = getTribe(harbor.owner);
  if (!tribe) return;
  let prodPerTurn = 2;
  if (tribe.wonders && tribe.wonders.includes('great_zimbabwe')) prodPerTurn += 3;
  harbor.production += prodPerTurn;
  const project = harbor.project;
  let cost = 0;
  if (project.type === 'unit') {
    const tribeData = TRIBES_DATA.find(t => t.id === tribe.id);
    if (!tribeData) return;
    const unitDef = tribeData.units[project.id];
    if (!unitDef) return;
    if (unitDef.techRequired && !tribe.techs.includes(unitDef.techRequired)) {
      harbor.project = null; harbor.production = 0; return;
    }
    cost = unitDef.cost;
  }
  if (cost && harbor.production >= cost) {
    if (project.type === 'unit') {
      const unit = spawnUnit(tribe.id, harbor.q, harbor.r, project.id);
      if (unit) {
        harbor.project = null;
        harbor.production = 0;
        updateVisibility();
        saveGame();
      }
    }
  }
}

// ─── CITY CAPTURE ─────────────────────────────────────────
function captureNeutralVillage(city, newOwnerId) {
  if (city.owner === newOwnerId) return;
  const oldOwner = city.owner;
  city.owner = newOwnerId;
  city.isNeutral = false;
  city.name = getUniqueSettlementName();
  const tribe = getTribe(newOwnerId);
  if (tribe) {
    tribe.cities.push(city);
    if (oldOwner) {
      const oldTribe = getTribe(oldOwner);
      if (oldTribe) {
        const idx = oldTribe.cities.indexOf(city);
        if (idx > -1) oldTribe.cities.splice(idx, 1);
      }
    }
  }
  G.map[city.r][city.q].owner = newOwnerId;
  const neighbors = hexNeighbors(city.q, city.r);
  const shuffled = neighbors.sort(() => Math.random() - 0.5);
  for (const n of shuffled) {
    if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false)) {
      spawnUnit(newOwnerId, n.q, n.r, 'foot');
      break;
    }
  }
  if (oldOwner) checkTribeEliminated(oldOwner);
  saveGame();
}
function captureCity(city, newOwnerId) {
  const oldOwnerId = city.owner;
  if (oldOwnerId === newOwnerId) return;
  if (city.isNeutral) {
    captureNeutralVillage(city, newOwnerId);
    return;
  }
  const oldTribe = G.tribes.find(t => t.id === oldOwnerId);
  if (oldTribe) {
    const idx = oldTribe.cities.indexOf(city);
    if (idx > -1) oldTribe.cities.splice(idx, 1);
  }
  city.owner = newOwnerId;
  const newTribe = G.tribes.find(t => t.id === newOwnerId);
  if (newTribe) newTribe.cities.push(city);
  G.map[city.r][city.q].owner = newOwnerId;
  city.project = null;
  city.progress = 0;
  city.stockpile = 0;
  const neighbors = hexNeighbors(city.q, city.r);
  for (const n of neighbors) {
    if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false)) {
      spawnUnit(newOwnerId, n.q, n.r, 'foot');
      break;
    }
  }
  checkTribeEliminated(oldOwnerId);
  saveGame();
}

// ─── COMBAT (deterministic) ──────────────────────────────
function performAttack(attacker, defender) {
    let atk = attacker.atk + (attacker.boostedAtk || 0);
    let defDef = defender.def + (defender.boostedDef || 0);
    let atkDef = attacker.def + (attacker.boostedDef || 0);
    
    let damageToDefender = Math.max(1, atk - defDef);
    let damageToAttacker = Math.max(1, defDef - atkDef);
    
    defender.hp -= damageToDefender;
    attacker.hp -= damageToAttacker;
    attacker.hasAttacked = true;
    
    let killed = false;
    if (defender.hp <= 0) {
        const tile = G.map[defender.r]?.[defender.q];
        if (tile && tile.unit === defender) tile.unit = null;
        const tribe = G.tribes.find(t => t.id === defender.tribeId);
        if (tribe) { const idx = tribe.units.indexOf(defender); if (idx > -1) tribe.units.splice(idx, 1); }
        const idx = G.units.indexOf(defender); if (idx > -1) G.units.splice(idx, 1);
        attacker.victories = (attacker.victories || 0) + 1;
        if (attacker.victories >= 5 && attacker.veteranLevel < 2) {
            upgradeUnit(attacker, 2);
        } else if (attacker.victories >= 3 && attacker.veteranLevel < 1) {
            upgradeUnit(attacker, 1);
        }
        checkTribeEliminated(defender.tribeId);
        killed = true;
    }
    if (attacker.hp <= 0) {
        const tile = G.map[attacker.r]?.[attacker.q];
        if (tile && tile.unit === attacker) tile.unit = null;
        const tribe = G.tribes.find(t => t.id === attacker.tribeId);
        if (tribe) { const idx = tribe.units.indexOf(attacker); if (idx > -1) tribe.units.splice(idx, 1); }
        const idx = G.units.indexOf(attacker); if (idx > -1) G.units.splice(idx, 1);
        checkTribeEliminated(attacker.tribeId);
    }
    saveGame();
    return { killed, damage: damageToDefender, defDamage: damageToAttacker };
}

function checkTribeEliminated(tribeId) {
  const tribe = G.tribes.find(t => t.id === tribeId);
  if (!tribe || tribe.eliminated) return;
  const hasUnits = G.units.some(u => u.tribeId === tribeId);
  const hasCities = G.cities.some(c => c.owner === tribeId);
  if (!hasUnits && !hasCities) {
    tribe.alive = false;
    tribe.active = false;
    tribe.eliminated = true;
    const idx = G.aliveTribes.indexOf(tribe);
    if (idx > -1) G.aliveTribes.splice(idx, 1);
    const msg = tribe.isPlayer ? 'Your kingdom has fallen!' : `${tribe.name} has been eliminated!`;
    queueMessage(msg);
    if (tribe.isPlayer) {
      G.gameOver = true;
      G.winner = 'AI';
      showGameOverModal('💀 Defeat', 'Your kingdom has fallen…');
    }
    checkWinConditions();
    saveGame();
  }
}
function checkWinConditions() {
  if (G.gameOver) return;
  const player = G.tribes.find(t => t.isPlayer);
  if (!player || !player.alive) { G.gameOver = true; G.winner = 'AI'; showGameOverModal('💀 Defeat', 'Your kingdom has fallen…'); return; }
  const aliveOpponents = G.aliveTribes.filter(t => !t.isPlayer);
  if (aliveOpponents.length === 0) { G.gameOver = true; G.winner = 'Player'; showGameOverModal('🏆 Victory!', 'All opposing kingdoms have been conquered!'); return; }
  if (G.gameMode === 'sandsoftime' && G.turn >= G.maxTurns) {
    G.gameOver = true;
    const playerTiles = getTribeControlledTiles(player.id);
    let oppTiles = 0;
    for (const t of aliveOpponents) oppTiles += getTribeControlledTiles(t.id);
    if (playerTiles > oppTiles) { G.winner = 'Player'; showGameOverModal('🏆 Victory!', 'You control more territory when time ran out!'); }
    else { G.winner = 'AI'; showGameOverModal('💀 Defeat', 'The enemy controls more territory.'); }
  }
  saveGame();
}
function showGameOverModal(title, msg) {
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = `<p>${msg}</p>`;
  const actions = document.getElementById('modal-actions');
  actions.innerHTML = `<button class="primary" onclick="closeModal();showScreen('menu-screen');">Main Menu</button>
                       <button onclick="closeModal();restartGame();">Play Again</button>`;
  overlay.classList.add('active');
}

// ─── CITY PRODUCTION WITH STOCKPILE ──────────────────────
function setCityProject(city, projectType, id) {
  city.project = { type: projectType, id: id };
  city.progress = 0; // reset progress, but stockpile remains
}

function applyStockpileToProject(city) {
  if (!city.project) return;
  const tribe = getTribe(city.owner);
  if (!tribe) return;
  let cost = 0;
  let progressTarget = null;

  if (city.project.type === 'unit') {
    const tribeData = TRIBES_DATA.find(t => t.id === tribe.id);
    if (!tribeData) return;
    const unitDef = tribeData.units[city.project.id];
    if (!unitDef) return;
    if (unitDef.techRequired && !tribe.techs.includes(unitDef.techRequired)) {
      city.project = null; city.progress = 0; return;
    }
    cost = unitDef.cost;
    progressTarget = () => {
      if (city.progress >= cost) {
        const neighbors = hexNeighbors(city.q, city.r);
        const shuffled = neighbors.sort(() => Math.random() - 0.5);
        let placed = false;
        for (const n of shuffled) {
          if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false)) {
            const unit = spawnUnit(tribe.id, n.q, n.r, city.project.id);
            if (unit) { placed = true; break; }
          }
        }
        if (placed) {
          city.project = null;
          city.progress = 0;
        } else {
          city.progress = cost;
        }
        saveGame();
      }
    };
  } else if (city.project.type === 'tech') {
    const techId = city.project.id;
    if (!isTechAvailable(tribe, techId)) {
      city.project = null; city.progress = 0; return;
    }
    cost = getTechCost(techId);
    if (!tribe.researchProgress) tribe.researchProgress = {};
    progressTarget = () => {
      if (city.progress >= cost) {
        tribe.techs.push(techId);
        delete tribe.researchProgress[techId];
        for (const c of tribe.cities) {
          if (c.project && c.project.type === 'tech' && c.project.id === techId) {
            c.project = null;
            c.progress = 0;
          }
        }
        saveGame();
      }
    };
  } else if (city.project.type === 'wonder') {
    const wonder = WONDERS.find(w => w.id === city.project.id);
    if (!wonder) return;
    if (wonder.requires && !tribe.techs.includes(wonder.requires)) {
      city.project = null; city.progress = 0; return;
    }
    cost = getWonderCost(city.project.id);
    progressTarget = () => {
      if (city.progress >= cost) {
        if (!isWonderBuilt(tribe, city.project.id)) tribe.wonders.push(city.project.id);
        city.project = null;
        city.progress = 0;
        saveGame();
      }
    };
  }

  if (!cost || !progressTarget) return;

  const needed = cost - city.progress;
  if (needed > 0 && city.stockpile > 0) {
    const take = Math.min(city.stockpile, needed);
    city.progress += take;
    city.stockpile -= take;
    progressTarget();
  }
}

function processCityProduction(city) {
  const tribe = G.tribes.find(t => t.id === city.owner);
  if (!tribe) return;
  let productionPerTurn = city.level * 2;
  if (tribe.wonders && tribe.wonders.includes('great_zimbabwe')) productionPerTurn += 3;
  city.stockpile += productionPerTurn;
  applyStockpileToProject(city);
}

// ─── AI LOGIC ─────────────────────────────────────────────
function runAI() {
  if (G.gameOver || G.animating) return;
  G.aiActive = true;
  const aiTribes = G.aliveTribes.filter(t => !t.isPlayer);
  if (aiTribes.length === 0) { G.aiActive = false; return; }

  for (const tribe of aiTribes) {
    const personality = getAIPersonality(tribe.id);
    for (const city of tribe.cities) {
      if (!city.project) {
        const availUnits = getAvailableUnits(tribe);
        const types = Object.keys(availUnits);
        if (types.length > 0) {
          let preferredTypes = [];
          if (personality.tactic === 'rush' || personality.tactic === 'mobile' || personality.tactic === 'hit_and_run' || personality.tactic === 'river_rush') {
            preferredTypes = ['mounted', 'scout', 'foot'];
          } else if (personality.tactic === 'defensive') {
            preferredTypes = ['shield', 'ranged', 'foot'];
          } else if (personality.tactic === 'archer') {
            preferredTypes = ['ranged', 'foot', 'shield'];
          } else {
            preferredTypes = ['foot', 'mounted', 'ranged'];
          }
          let chosen = null;
          for (const pref of preferredTypes) {
            if (availUnits[pref]) { chosen = pref; break; }
          }
          if (!chosen) chosen = Object.keys(availUnits)[0];
          if (chosen) setCityProject(city, 'unit', chosen);
        }
      }
      processCityProduction(city);
      if (Math.random() < 0.05 + personality.expansion * 0.08 && tribe.gold > 80 && city.level < 4) {
        const cost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
        if (tribe.gold >= cost) { tribe.gold -= cost; city.level++; }
      }
      // AI builds Library/University sometimes
      if (city.level >= 4 && !city.hasLibrary && tribe.gold >= 100 && Math.random() < 0.1) {
        buildLibrary(city);
      }
      if (city.level >= 4 && city.hasLibrary && !city.hasUniversity && tribe.gold >= 200 && Math.random() < 0.1) {
        buildUniversity(city);
      }
    }
    for (const harbor of G.harbors) {
      if (harbor.owner !== tribe.id) continue;
      if (!harbor.project) {
        const availUnits = getAvailableUnits(tribe);
        let chosen = null;
        if (availUnits.warship) chosen = 'warship';
        else if (availUnits.galley) chosen = 'galley';
        else if (availUnits.raft) chosen = 'raft';
        if (chosen) harbor.project = { type: 'unit', id: chosen };
      }
      processHarborProduction(harbor);
    }
    if (tribe.techs.includes('sailing')) {
      const units = G.units.filter(u => u.tribeId === tribe.id && u.active && !u.isNaval && !u.hasMoved);
      for (const u of units) {
        if (Math.random() < 0.25 && canBuildHarbor(u)) {
          buildHarbor(u);
        }
      }
    }
    if (tribe.techs.includes('sailing') && tribe.gold >= 20) {
      const units = G.units.filter(u => u.tribeId === tribe.id && u.active && !u.isNaval && !u.hasMoved);
      for (const u of units) {
        if (Math.random() < 0.2 && canBuildRaft(u)) {
          buildRaft(u);
        }
      }
    }
    const militaryUnits = G.units.filter(u => u.tribeId === tribe.id && u.active && !u.hasMoved);
    if (militaryUnits.length === 0) continue;

    let enemyTargets = [];
    const enemies = G.units.filter(u => u.tribeId !== tribe.id && u.active);
    for (const e of enemies) {
      let closestDist = Infinity;
      let closestUnit = null;
      for (const u of militaryUnits) {
        const d = hexDistance({ q: u.q, r: u.r }, { q: e.q, r: e.r });
        if (d < closestDist) { closestDist = d; closestUnit = u; }
      }
      enemyTargets.push({ enemy: e, dist: closestDist, closestUnit: closestUnit });
    }
    enemyTargets.sort((a, b) => a.dist - b.dist);

    if (enemyTargets.length > 0 && enemyTargets[0].dist < 10) {
      const target = enemyTargets[0];
      const nearby = militaryUnits.filter(u => hexDistance({ q: u.q, r: u.r }, { q: target.enemy.q, r: target.enemy.r }) <= u.move + u.attackRange + 3);
      for (const u of nearby) {
        if (u.hasMoved) continue;
        const dist = hexDistance({ q: u.q, r: u.r }, { q: target.enemy.q, r: target.enemy.r });
        if (dist <= u.attackRange) {
          performAttack(u, target.enemy);
        } else if (dist <= u.move) {
          const path = findPath(u.q, u.r, target.enemy.q, target.enemy.r, u, tribe.id);
          if (path && path.length > 1) {
            const step = path[1];
            const tile = G.map[step.r]?.[step.q];
            if (tile && !tile.unit && isTilePassable(step.q, step.r, u.isNaval)) {
              G.map[u.r][u.q].unit = null;
              u.q = step.q; u.r = step.r;
              G.map[u.r][u.q].unit = u;
              u.hasMoved = true;
            }
          }
        } else {
          const path = findPath(u.q, u.r, target.enemy.q, target.enemy.r, u, tribe.id);
          if (path && path.length > 1) {
            const step = path[Math.min(path.length - 1, u.move)];
            const tile = G.map[step.r]?.[step.q];
            if (tile && !tile.unit && isTilePassable(step.q, step.r, u.isNaval)) {
              G.map[u.r][u.q].unit = null;
              u.q = step.q; u.r = step.r;
              G.map[u.r][u.q].unit = u;
              u.hasMoved = true;
            }
          }
        }
      }
      const remaining = militaryUnits.filter(u => !u.hasMoved);
      for (const u of remaining) {
        processAIAttack(u, tribe);
      }
    } else {
      for (const u of militaryUnits) {
        processAIAttack(u, tribe);
      }
    }
  }
  G.aiActive = false;
  checkWinConditions();
  if (!G.gameOver) finishTurn();
}

function processAIAttack(unit, tribe) {
  if (unit.hasMoved || !unit.active) return;
  let targets = [];
  const enemies = G.units.filter(u => u.tribeId !== tribe.id && u.active);
  for (const e of enemies) {
    const dist = hexDistance({ q: unit.q, r: unit.r }, { q: e.q, r: e.r });
    targets.push({ type: 'unit', target: e, dist: dist });
  }
  const neutralCities = G.cities.filter(c => c.isNeutral);
  for (const c of neutralCities) {
    const dist = hexDistance({ q: unit.q, r: unit.r }, { q: c.q, r: c.r });
    targets.push({ type: 'neutral', target: c, dist: dist });
  }
  const enemyCities = G.cities.filter(c => c.owner !== tribe.id && !c.isNeutral);
  for (const c of enemyCities) {
    const dist = hexDistance({ q: unit.q, r: unit.r }, { q: c.q, r: c.r });
    targets.push({ type: 'city', target: c, dist: dist });
  }
  targets.sort((a, b) => a.dist - b.dist);
  if (targets.length > 0 && targets[0].dist <= unit.move + unit.attackRange) {
    const t = targets[0];
    if (t.type === 'unit') {
      const enemy = t.target;
      const dist = hexDistance({ q: unit.q, r: unit.r }, { q: enemy.q, r: enemy.r });
      if (dist <= unit.attackRange) {
        performAttack(unit, enemy);
      } else {
        const path = findPath(unit.q, unit.r, enemy.q, enemy.r, unit, tribe.id);
        if (path && path.length > 1) {
          const step = path[1];
          const tile = G.map[step.r]?.[step.q];
          if (tile && !tile.unit && isTilePassable(step.q, step.r, unit.isNaval)) {
            G.map[unit.r][unit.q].unit = null;
            unit.q = step.q; unit.r = step.r;
            G.map[unit.r][unit.q].unit = unit;
            unit.hasMoved = true;
          }
        }
      }
    } else if (t.type === 'neutral' || t.type === 'city') {
      const city = t.target;
      const dist = hexDistance({ q: unit.q, r: unit.r }, { q: city.q, r: city.r });
      if (dist === 1) {
        const tile = G.map[city.r]?.[city.q];
        if (tile && !tile.unit) {
          if (city.isNeutral) captureNeutralVillage(city, tribe.id);
          else captureCity(city, tribe.id);
        }
      } else {
        const path = findPath(unit.q, unit.r, city.q, city.r, unit, tribe.id);
        if (path && path.length > 1) {
          const step = path[1];
          const tile = G.map[step.r]?.[step.q];
          if (tile && !tile.unit && isTilePassable(step.q, step.r, unit.isNaval)) {
            G.map[unit.r][unit.q].unit = null;
            unit.q = step.q; unit.r = step.r;
            G.map[unit.r][unit.q].unit = unit;
            unit.hasMoved = true;
          }
        }
      }
    }
  } else if (targets.length > 0) {
    const t = targets[0];
    const path = findPath(unit.q, unit.r, t.target.q || t.target.q, t.target.r || t.target.r, unit, tribe.id);
    if (path && path.length > 1) {
      const step = path[Math.min(path.length - 1, unit.move)];
      const tile = G.map[step.r]?.[step.q];
      if (tile && !tile.unit && isTilePassable(step.q, step.r, unit.isNaval)) {
        G.map[unit.r][unit.q].unit = null;
        unit.q = step.q; unit.r = step.r;
        G.map[unit.r][unit.q].unit = unit;
        unit.hasMoved = true;
      }
    }
  }
}
function findExpansionPath(unit, tribe) {
  let best = null, bestDist = Infinity;
  for (const city of tribe.cities) {
    const neighbors = hexNeighbors(city.q, city.r);
    for (const n of neighbors) {
      if (!inMap(n.q, n.r)) continue;
      const tile = G.map[n.r]?.[n.q];
      if (!tile || tile.unit || tile.owner) continue;
      if (!isTilePassable(n.q, n.r, unit.isNaval)) continue;
      const dist = hexDistance({ q: unit.q, r: unit.r }, { q: n.q, r: n.r });
      if (dist < bestDist) { bestDist = dist; best = n; }
    }
  }
  if (best) {
    return findPath(unit.q, unit.r, best.q, best.r, unit, tribe.id);
  }
  return null;
}

// ─── PATHFINDING ─────────────────────────────────────────
function findPath(startQ, startR, endQ, endR, unit, tribeId) {
  const queue = [{ q: startQ, r: startR, path: [{ q: startQ, r: startR }] }];
  const visited = new Set();
  visited.add(hexKey(startQ, startR));
  while (queue.length > 0) {
    const current = queue.shift();
    if (current.q === endQ && current.r === endR) return current.path;
    const neighbors = hexNeighbors(current.q, current.r);
    for (const n of neighbors) {
      const key = hexKey(n.q, n.r);
      if (visited.has(key)) continue;
      if (!inMap(n.q, n.r)) continue;
      const tile = G.map[n.r]?.[n.q];
      if (!tile) continue;
      if (tile.unit && tile.unit.tribeId !== tribeId) {
        if (n.q === endQ && n.r === endR && hexDistance({ q: startQ, r: startR }, { q: endQ, r: endR }) <= unit.attackRange) {
        } else {
          continue;
        }
      }
      if (!isTilePassable(n.q, n.r, unit.isNaval)) continue;
      const cost = getUnitMoveCost(unit, n.q, n.r);
      if (current.path.length + cost > unit.move + 1) continue;
      visited.add(key);
      const newPath = [...current.path, { q: n.q, r: n.r }];
      queue.push({ q: n.q, r: n.r, path: newPath });
    }
  }
  return null;
}

// ─── TURN MANAGEMENT ─────────────────────────────────────
function endTurn() {
  if (G.gameOver || G.animating || G.turnPhase === 'ai') return;
  G.turnPhase = 'ai';
  
  for (const u of G.units) {
    clearBoostedStats(u);
  }
  
  for (const u of G.units) { 
    u.hasMoved = false; 
    u.hasAttacked = false;
    u.hasHealed = false;
    u.hasUsedAbility = false;
  }
  for (const city of G.cities) processCityProduction(city);
  for (const harbor of G.harbors) processHarborProduction(harbor);
  const player = G.tribes.find(t => t.isPlayer);
  if (player) {
    let income = getTribeYield(player.id);
    if (player.wonders && player.wonders.includes('pyramids')) income += 5;
    if (player.techs && player.techs.includes('trade')) income += 2 * player.cities.length;
    player.gold += income;
    G.playerGold = player.gold;
    let researchIncome = player.cities.length + 2;
    if (player.wonders && player.wonders.includes('timbuktu')) researchIncome += 4;
    if (player.techs && player.techs.includes('philosophy')) researchIncome = Math.floor(researchIncome * 1.2);
    // Add library/university bonus
    for (const city of player.cities) {
      if (city.hasLibrary) researchIncome += 2;
      if (city.hasUniversity) researchIncome += 4;
    }
    player.researchPoints += researchIncome;
    if (player.techs.includes('medicine')) {
      for (const u of player.units) {
        u.hp = Math.min(u.maxHp, u.hp + 3);
      }
    }
  }
  for (const t of G.aliveTribes) {
    if (!t.isPlayer) {
      t.gold += getTribeYield(t.id);
      if (t.wonders && t.wonders.includes('pyramids')) t.gold += 5;
      if (t.techs && t.techs.includes('trade')) t.gold += 2 * t.cities.length;
      let researchIncome = t.cities.length + 1;
      if (t.wonders && t.wonders.includes('timbuktu')) researchIncome += 4;
      if (t.techs && t.techs.includes('philosophy')) researchIncome = Math.floor(researchIncome * 1.2);
      for (const city of t.cities) {
        if (city.hasLibrary) researchIncome += 2;
        if (city.hasUniversity) researchIncome += 4;
      }
      t.researchPoints += researchIncome;
      if (t.techs.includes('medicine')) {
        for (const u of t.units) {
          u.hp = Math.min(u.maxHp, u.hp + 3);
        }
      }
    }
  }
  G.turn++;
  updateVisibility();
  updateUI();
  G.animating = true;
  setTimeout(() => {
    G.animating = false;
    runAI();
    if (!G.gameOver) { G.turnPhase = 'player'; updateVisibility(); updateUI(); render(); }
    saveGame(); // save after AI turn
  }, 350);
}
function finishTurn() { G.turnPhase = 'player'; updateVisibility(); updateUI(); render(); saveGame(); }

// ─── MOVEMENT & ATTACK HELPERS ──────────────────────────
function tryMoveUnit() {
  if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return false;
  const hex = G.selectedHex;
  if (!hex) return false;
  const unit = G.selectedUnit;
  if (unit.hasMoved) return false;
  const tile = G.map[hex.r]?.[hex.q];
  if (!tile || tile.unit) return false;
  if (!isTilePassable(hex.q, hex.r, unit.isNaval)) return false;
  const dist = hexDistance({ q: unit.q, r: unit.r }, { q: hex.q, r: hex.r });
  if (dist > unit.move) return false;
  const path = findPath(unit.q, unit.r, hex.q, hex.r, unit, unit.tribeId);
  if (!path || path.length > unit.move + 1) return false;
  if (tile.city) {
    if (tile.city.isNeutral) captureNeutralVillage(tile.city, unit.tribeId);
    else if (tile.city.owner !== unit.tribeId) {
      if (!tile.unit) { captureCity(tile.city, unit.tribeId); }
    }
  }
  G.map[unit.r][unit.q].unit = null;
  unit.q = hex.q; unit.r = hex.r;
  G.map[unit.r][unit.q].unit = unit;
  unit.hasMoved = true;
  updateVisibility();
  G.selectedUnit = unit;
  updateUI(); render(); updateActionPopup();
  saveGame();
  return true;
}
function tryAttackUnit() {
  if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return;
  const hex = G.selectedHex;
  if (!hex) return;
  const unit = G.selectedUnit;
  if (unit.hasAttacked) return;
  const target = getUnitAt(hex.q, hex.r);
  if (!target || target.tribeId === unit.tribeId) return;
  const dist = hexDistance({ q: unit.q, r: unit.r }, { q: target.q, r: target.r });
  if (dist > unit.attackRange) return;
  performAttack(unit, target);
  if (unit.hp <= 0) G.selectedUnit = null;
  updateVisibility();
  updateUI(); render(); updateActionPopup(); checkWinConditions();
  saveGame();
}

function tryHealUnit() {
  if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return;
  const unit = G.selectedUnit;
  if (unit.hasMoved || unit.hasAttacked || unit.hasHealed) return;
  const healed = healUnit(unit);
  if (healed) {
    updateVisibility();
    updateUI(); render(); updateActionPopup();
    saveGame();
  }
}

function tryInvigorate() {
  if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return;
  const unit = G.selectedUnit;
  if (!unit.isGeneral) return;
  if (unit.hasMoved || unit.hasAttacked || unit.hasUsedAbility) return;
  const result = invigorateTroops(unit);
  if (result) {
    updateVisibility();
    updateUI(); render(); updateActionPopup();
    const msg = `✨ Invigorated! ${result.healedCount} units healed, ${result.boostedCount} units boosted!`;
    queueMessage(msg);
    saveGame();
  }
}

function setCityProjectAndClose(id, type) {
  const city = window._prodCity;
  if (!city) return;
  // If tech, check if already being researched
  if (type === 'tech' && isTechBeingResearched(id)) {
    alert('This technology is already being researched in ' + getTechResearcher(id));
    return;
  }
  setCityProject(city, type, id);
  closeModal();
  updateUI();
  render();
  saveGame();
}
function upgradeCity(city) {
  const player = G.tribes.find(t => t.isPlayer);
  if (!player || city.owner !== player.id) return;
  let cost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
  if (player.techs.includes('architecture')) cost = Math.floor(cost * 0.8);
  if (player.gold < cost) { alert('Not enough gold!'); return; }
  if (city.level >= 4) { alert('City is already max level!'); return; }
  player.gold -= cost;
  city.level++;
  updateUI();
  render();
  closeModal();
  openCityProduction();
  saveGame();
}
