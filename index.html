        // ─── CITY PRODUCTION WITH STOCKPILE ──────────────────────
        function setCityProject(city, projectType, id) {
            city.project = { type: projectType, id: id };
            city.progress = 0;
        }

        function applyStockpileToProject(city) {
            if (!city.project) return;
            const tribe = getTribe(city.owner);
            if (!tribe) return;
            let cost = 0;
            let progressTarget = null;

            if (city.project.type === 'unit') {
                const tribeData = TRIBES_DATA.find(t => t.id === tribe.id);
                if (!tribeData) return;
                const unitDef = tribeData.units[city.project.id];
                if (!unitDef) return;
                if (unitDef.techRequired && !tribe.techs.includes(unitDef.techRequired)) {
                    city.project = null;
                    city.progress = 0;
                    return;
                }
                cost = unitDef.cost;
                let discount = 0;
                const influence = getCityInfluence(city);
                for (const tile of influence) {
                    const tileData = G.map[tile.r]?.[tile.q];
                    if (tileData && tileData.quarry) { discount = Math.max(discount, 0.2); }
                    if (tileData && tileData.fishing) { discount = Math.max(discount, 0.2); }
                    if (tileData && tileData.farm) { discount = Math.max(discount, 0.2); }
                }
                cost = Math.ceil(cost * (1 - discount));
                progressTarget = () => {
                    if (city.progress >= cost) {
                        const neighbors = hexNeighbors(city.q, city.r);
                        const shuffled = neighbors.sort(() => Math.random() - 0.5);
                        let placed = false;
                        for (const n of shuffled) {
                            if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false, null)) {
                                const unit = spawnUnit(tribe.id, n.q, n.r, city.project.id);
                                if (unit) { placed = true; break; }
                            }
                        }
                        if (placed) {
                            city.project = null;
                            city.progress = 0;
                        } else {
                            city.progress = cost;
                        }
                        saveGame();
                    }
                };
            } else if (city.project.type === 'tech') {
                const techId = city.project.id;
                if (!isTechAvailable(tribe, techId)) {
                    city.project = null;
                    city.progress = 0;
                    return;
                }
                cost = getTechCost(techId);
                if (!tribe.researchProgress) tribe.researchProgress = {};
                progressTarget = () => {
                    if (city.progress >= cost) {
                        tribe.techs.push(techId);
                        delete tribe.researchProgress[techId];
                        for (const c of tribe.cities) {
                            if (c.project && c.project.type === 'tech' && c.project.id === techId) {
                                c.project = null;
                                c.progress = 0;
                            }
                        }
                        saveGame();
                    }
                };
            } else if (city.project.type === 'wonder') {
                const wonder = WONDERS.find(w => w.id === city.project.id);
                if (!wonder) return;
                if (wonder.requires && !tribe.techs.includes(wonder.requires)) {
                    city.project = null;
                    city.progress = 0;
                    return;
                }
                cost = getWonderCost(city.project.id);
                const discount = getCityImprovementDiscount(city);
                cost = Math.ceil(cost * (1 - discount));
                progressTarget = () => {
                    if (city.progress >= cost) {
                        if (!isWonderBuilt(tribe, city.project.id)) {
                            tribe.wonders.push(city.project.id);
                            placeWonderIcon(tribe, city.project.id);
                        }
                        city.project = null;
                        city.progress = 0;
                        saveGame();
                    }
                };
            }

            if (!cost || !progressTarget) return;

            const needed = cost - city.progress;
            if (needed > 0 && city.stockpile > 0) {
                const take = Math.min(city.stockpile, needed);
                city.progress += take;
                city.stockpile -= take;
                progressTarget();
            }
        }

        function processCityProduction(city) {
            const tribe = G.tribes.find(t => t.id === city.owner);
            if (!tribe) return;
            let productionPerTurn = city.level * 2;
            if (tribe.wonders && tribe.wonders.includes('great_zimbabwe')) productionPerTurn += 3;
            city.stockpile += productionPerTurn;
            applyStockpileToProject(city);
        }

        // ─── AI TURN ──────────────────────────────────────────────
        function processAITribe(tribe) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('ai-turn-overlay');
                const title = document.getElementById('ai-turn-title');
                const sub = document.getElementById('ai-turn-sub');
                const icon = document.getElementById('ai-turn-icon');
                icon.textContent = tribe.icon;
                title.textContent = `${tribe.name}'s Turn`;
                sub.textContent = 'Processing units...';
                overlay.classList.add('active');

                const units = G.units.filter(u => u.tribeId === tribe.id && u.active && !u.hasMoved);
                if (units.length === 0) {
                    setTimeout(() => {
                        overlay.classList.remove('active');
                        resolve();
                    }, 300);
                    return;
                }

                let unitIndex = 0;

                function processNextUnit() {
                    if (unitIndex >= units.length) {
                        overlay.classList.remove('active');
                        resolve();
                        return;
                    }
                    const unit = units[unitIndex];
                    sub.textContent = `Moving ${unit.name} (${unitIndex+1}/${units.length})...`;
                    processAIAttack(unit, tribe);
                    setTimeout(() => {
                        unitIndex++;
                        processNextUnit();
                    }, 400);
                }
                setTimeout(processNextUnit, 300);
            });
        }

        async function runAI() {
            if (G.gameOver || G.animating || G.aiProcessing) return;
            G.aiProcessing = true;
            const aiTribes = G.aliveTribes.filter(t => !t.isPlayer);
            if (aiTribes.length === 0) { G.aiProcessing = false; return; }

            for (const tribe of aiTribes) {
                if (G.gameOver) break;
                await processAITribe(tribe);
                checkWinConditions();
                if (G.gameOver) break;
            }

            G.aiProcessing = false;
            if (!G.gameOver) {
                finishTurn();
            }
        }

        function processAIAttack(unit, tribe) {
            if (unit.hasMoved || !unit.active) return;
            let targets = [];
            const enemies = G.units.filter(u => u.tribeId !== tribe.id && u.active);
            for (const e of enemies) {
                const dist = hexDistance({ q: unit.q, r: unit.r }, { q: e.q, r: e.r });
                targets.push({ type: 'unit', target: e, dist: dist });
            }
            const neutralCities = G.cities.filter(c => c.isNeutral);
            for (const c of neutralCities) {
                const dist = hexDistance({ q: unit.q, r: unit.r }, { q: c.q, r: c.r });
                targets.push({ type: 'neutral', target: c, dist: dist });
            }
            const enemyCities = G.cities.filter(c => c.owner !== tribe.id && !c.isNeutral);
            for (const c of enemyCities) {
                const dist = hexDistance({ q: unit.q, r: unit.r }, { q: c.q, r: c.r });
                targets.push({ type: 'city', target: c, dist: dist });
            }
            targets.sort((a, b) => a.dist - b.dist);
            if (targets.length > 0 && targets[0].dist <= unit.move + unit.attackRange) {
                const t = targets[0];
                if (t.type === 'unit') {
                    const enemy = t.target;
                    const dist = hexDistance({ q: unit.q, r: unit.r }, { q: enemy.q, r: enemy.r });
                    if (dist <= unit.attackRange) {
                        performAttack(unit, enemy);
                    } else {
                        const path = findPath(unit.q, unit.r, enemy.q, enemy.r, unit, tribe.id);
                        if (path && path.length > 1) {
                            const step = path[1];
                            const tile = G.map[step.r]?.[step.q];
                            if (tile && !tile.unit && isTilePassable(step.q, step.r, unit.isNaval, unit)) {
                                G.map[unit.r][unit.q].unit = null;
                                unit.q = step.q;
                                unit.r = step.r;
                                G.map[unit.r][unit.q].unit = unit;
                                unit.hasMoved = true;
                                if (unit.isNaval && tile.terrain !== 'water') {
                                    disembarkNavalUnit(unit);
                                }
                            }
                        }
                    }
                } else if (t.type === 'neutral' || t.type === 'city') {
                    const city = t.target;
                    const dist = hexDistance({ q: unit.q, r: unit.r }, { q: city.q, r: city.r });
                    if (dist === 1) {
                        const tile = G.map[city.r]?.[city.q];
                        if (tile && !tile.unit) {
                            if (city.isNeutral) captureNeutralVillage(city, tribe.id);
                            else captureCity(city, tribe.id);
                        }
                    } else {
                        const path = findPath(unit.q, unit.r, city.q, city.r, unit, tribe.id);
                        if (path && path.length > 1) {
                            const step = path[1];
                            const tile = G.map[step.r]?.[step.q];
                            if (tile && !tile.unit && isTilePassable(step.q, step.r, unit.isNaval, unit)) {
                                G.map[unit.r][unit.q].unit = null;
                                unit.q = step.q;
                                unit.r = step.r;
                                G.map[unit.r][unit.q].unit = unit;
                                unit.hasMoved = true;
                                if (unit.isNaval && tile.terrain !== 'water') {
                                    disembarkNavalUnit(unit);
                                }
                            }
                        }
                    }
                }
            } else if (targets.length > 0) {
                const t = targets[0];
                const path = findPath(unit.q, unit.r, t.target.q || t.target.q, t.target.r || t.target.r, unit, tribe.id);
                if (path && path.length > 1) {
                    const step = path[Math.min(path.length - 1, unit.move)];
                    const tile = G.map[step.r]?.[step.q];
                    if (tile && !tile.unit && isTilePassable(step.q, step.r, unit.isNaval, unit)) {
                        G.map[unit.r][unit.q].unit = null;
                        unit.q = step.q;
                        unit.r = step.r;
                        G.map[unit.r][unit.q].unit = unit;
                        unit.hasMoved = true;
                        if (unit.isNaval && tile.terrain !== 'water') {
                            disembarkNavalUnit(unit);
                        }
                    }
                }
            }
        }

        // ─── TURN MANAGEMENT ─────────────────────────────────────
        function endTurn() {
            if (G.gameOver || G.animating || G.turnPhase === 'ai') return;
            G.turnPhase = 'ai';

            for (const u of G.units) {
                clearBoostedStats(u);
                if (!u.hasMoved && !u.hasAttacked && !u.isRaft) {
                    const healAmt = 5;
                    u.hp = Math.min(u.maxHp, u.hp + healAmt);
                }
            }

            for (const u of G.units) {
                u.hasMoved = false;
                u.hasAttacked = false;
                u.hasHealed = false;
                u.hasUsedAbility = false;
            }
            for (const city of G.cities) processCityProduction(city);
            for (const harbor of G.harbors) processHarborProduction(harbor);
            const player = G.tribes.find(t => t.isPlayer);
            if (player) {
                let income = getTribeYield(player.id);
                let mineCount = 0;
                for (const city of player.cities) {
                    const influence = getCityInfluence(city);
                    for (const tile of influence) {
                        const tileData = G.map[tile.r]?.[tile.q];
                        if (tileData && tileData.mine) mineCount++;
                    }
                }
                income += mineCount * 2;
                if (player.wonders && player.wonders.includes('pyramids')) income += 5;
                if (player.techs && player.techs.includes('trade')) income += 2 * player.cities.length;
                player.gold += income;
                G.playerGold = player.gold;
                let researchIncome = player.cities.length + 2;
                if (player.wonders && player.wonders.includes('timbuktu')) researchIncome += 4;
                if (player.techs && player.techs.includes('philosophy')) researchIncome = Math.floor(researchIncome * 1.2);
                for (const city of player.cities) {
                    if (city.hasLibrary) researchIncome += 2;
                    if (city.hasUniversity) researchIncome += 4;
                }
                player.researchPoints += researchIncome;
                if (player.techs.includes('medicine')) {
                    for (const u of player.units) {
                        u.hp = Math.min(u.maxHp, u.hp + 3);
                    }
                }
            }
            for (const t of G.aliveTribes) {
                if (!t.isPlayer) {
                    let income = getTribeYield(t.id);
                    let mineCount = 0;
                    for (const city of t.cities) {
                        const influence = getCityInfluence(city);
                        for (const tile of influence) {
                            const tileData = G.map[tile.r]?.[tile.q];
                            if (tileData && tileData.mine) mineCount++;
                        }
                    }
                    income += mineCount * 2;
                    t.gold += income;
                    if (t.wonders && t.wonders.includes('pyramids')) t.gold += 5;
                    if (t.techs && t.techs.includes('trade')) t.gold += 2 * t.cities.length;
                    let researchIncome = t.cities.length + 1;
                    if (t.wonders && t.wonders.includes('timbuktu')) researchIncome += 4;
                    if (t.techs && t.techs.includes('philosophy')) researchIncome = Math.floor(researchIncome * 1.2);
                    for (const city of t.cities) {
                        if (city.hasLibrary) researchIncome += 2;
                        if (city.hasUniversity) researchIncome += 4;
                    }
                    t.researchPoints += researchIncome;
                    if (t.techs.includes('medicine')) {
                        for (const u of t.units) {
                            u.hp = Math.min(u.maxHp, u.hp + 3);
                        }
                    }
                }
            }
            G.turn++;
            updateVisibility();
            updateUI();
            G.animating = true;
            setTimeout(() => {
                G.animating = false;
                runAI();
            }, 300);
        }

        function finishTurn() {
            G.turnPhase = 'player';
            updateVisibility();
            updateUI();
            render();
            saveGame();
        }

        // ─── THE FIXED tryMoveUnit FUNCTION ───────────────────────────
        function tryMoveUnit() {
            if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return false;
            const hex = G.selectedHex;
            if (!hex) return false;
            const unit = G.selectedUnit;
            if (unit.hasMoved) return false;
            const tile = G.map[hex.r]?.[hex.q];
            if (!tile || tile.unit) return false;
            if (!isTilePassable(hex.q, hex.r, unit.isNaval, unit)) return false;
            const dist = hexDistance({ q: unit.q, r: unit.r }, { q: hex.q, r: hex.r });
            if (dist > unit.move) return false;
            const path = findPath(unit.q, unit.r, hex.q, hex.r, unit, unit.tribeId);
            if (!path || path.length > unit.move + 1) return false;

            const isLand = tile.terrain !== 'water';

            // Move unit
            G.map[unit.r][unit.q].unit = null;
            unit.q = hex.q;
            unit.r = hex.r;
            G.map[unit.r][unit.q].unit = unit;
            unit.hasMoved = true;

            // ─── CAPTURE CITY LOGIC (FIXED) ─────────────────────────────
            if (tile.city) {
                if (tile.city.isNeutral) {
                    captureNeutralVillage(tile.city, unit.tribeId);
                } else if (tile.city.owner !== unit.tribeId) {
                    // Capture regardless of tile.unit (now our moving unit)
                    captureCity(tile.city, unit.tribeId);
                }
            }

            // If naval and on land, disembark
            if (unit.isNaval && isLand) {
                disembarkNavalUnit(unit);
            }

            updateVisibility();
            G.selectedUnit = unit;
            updateUI();
            render();
            updateActionPopup();
            saveGame();
            return true;
        }

        // ─── OTHER MOVEMENT HELPERS ──────────────────────────────────
        function tryAttackUnit() {
            if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return;
            const hex = G.selectedHex;
            if (!hex) return;
            const unit = G.selectedUnit;
            if (unit.hasAttacked) return;
            const target = getUnitAt(hex.q, hex.r);
            if (!target || target.tribeId === unit.tribeId) return;
            const dist = hexDistance({ q: unit.q, r: unit.r }, { q: target.q, r: target.r });
            if (dist > unit.attackRange) return;
            performAttack(unit, target);
            if (unit.hp <= 0) G.selectedUnit = null;
            updateVisibility();
            updateUI();
            render();
            updateActionPopup();
            checkWinConditions();
            saveGame();
        }

        function tryHealUnit() {
            if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return;
            const unit = G.selectedUnit;
            if (unit.hasMoved || unit.hasAttacked || unit.hasHealed) return;
            const healed = healUnit(unit);
            if (healed) {
                updateVisibility();
                updateUI();
                render();
                updateActionPopup();
                saveGame();
            }
        }

        function tryInvigorate() {
            if (G.gameOver || G.turnPhase !== 'player' || !G.selectedUnit) return;
            const unit = G.selectedUnit;
            if (!unit.isGeneral) return;
            if (unit.hasMoved || unit.hasAttacked || unit.hasUsedAbility) return;
            const result = invigorateTroops(unit);
            if (result) {
                updateVisibility();
                updateUI();
                render();
                updateActionPopup();
                const msg = `✨ Invigorated! ${result.healedCount} units healed, ${result.boostedCount} units boosted!`;
                queueMessage(msg);
                saveGame();
            }
        }

        // ─── HARBOR MANAGEMENT UI ──────────────────────────────
        function manageHarbor() {
            if (G.gameOver || G.turnPhase !== 'player' || !G.selectedHarbor) return;
            const harbor = G.selectedHarbor;
            const player = getTribe(G.playerTribeId);
            if (!player || harbor.owner !== player.id) return;
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '⛵ Manage Harbor';

                `<div style="margin-bottom:8px;font-size:clamp(0.9rem,2.2vw,1rem);color:#b8957a;">
            Production: ${harbor.production} / ${harbor.project ? (TRIBES_DATA.find(t=>t.id===player.id).units[harbor.project.id].cost || 0) : '—'}
            ${harbor.project ? ' - Building: ' + harbor.project.id : ''}
          </div>`;
            const availUnits = getAvailableUnits(player);

            if (navalTypes.length > 0) {
                html += `<div style="margin-top:8px;font-weight:bold;color:var(--warm-gold);">Produce with production:</div>`;
                html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">`;
                for (const type of navalTypes) {
                    const def = availUnits[type];
                    const city = G.cities.find(c => c.owner === player.id && hexDistance({ q: c.q, r: c.r }, { q: harbor
                            .q, r: harbor.r }) <= 2);
                    let cost = def.cost;
                    if (city) {
                        const discount = getCityUnitDiscount(city);
                        cost = Math.ceil(cost * (1 - discount));
                    }
                    html +=
                        `<button style="padding:10px;background:rgba(20,12,8,0.7);border:1px solid #3a281e;border-radius:6px;color:var(--cream);cursor:pointer;font-family:inherit;font-size:clamp(0.8rem,2vw,0.9rem);min-height:44px;touch-action:manipulation;" 
                onclick="setHarborProjectAndClose('${type}','unit')">${def.name} (${cost} prod)</button>`;

                html += `</div>`;
                html += `<div style="margin-top:12px;font-weight:bold;color:var(--vivid-gold);">Buy with gold:</div>`;
                html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">`;
                for (const type of navalTypes) {
                    const def = availUnits[type];
                    let goldCost = def.cost * 2;
                    const city = G.cities.find(c => c.owner === player.id && hexDistance({ q: c.q, r: c.r }, { q: harbor
                            .q, r: harbor.r }) <= 2);
                    if (city) {

                        goldCost = Math.ceil(goldCost * (1 - discount));
                    }
                    html +=
                        `<button style="padding:10px;background:rgba(255,215,0,0.08);border:1px solid var(--vivid-gold);border-radius:6px;color:var(--vivid-gold);cursor:pointer;font-family:inherit;font-size:clamp(0.8rem,2vw,0.9rem);min-height:44px;touch-action:manipulation;" 
                onclick="buyNavalUnitAtHarbor(window._harbor, '${type}')">${def.name} (${goldCost} gold)</button>`;
                }
                html += `</div>`;
            } else {
                html += `<p style="color:#6b5a4a;">Research Sailing and Navigation to build ships.</p>`;
            }
            document.getElementById('modal-body').innerHTML = html;
            const actions = document.getElementById('modal-actions');
            actions.innerHTML = `<button onclick="closeModal()">Close</button>`;
            overlay.classList.add('active');
            window._harbor = harbor;
        }

        function setHarborProjectAndClose(id, type) {
            const harbor = window._harbor;
            if (!harbor) return;
            harbor.project = { type, id };
            harbor.production = 0;
            closeModal();
            updateUI();
            render();
            saveGame();
        }

        // ─── CITY PRODUCTION UI ──────────────────────────────────
        function openCityProduction() {
            if (G.gameOver || G.turnPhase !== 'player') return;
            if (!G.selectedCity) return;
            const city = G.selectedCity;
            const player = G.tribes.find(t => t.isPlayer);
            if (!player || city.owner !== player.id) return;

            const overlay = document.getElementById('modal-overlay');
            const levelNames = ['Village', 'Town', 'City', 'Metropolis'];
            document.getElementById('modal-title').textContent = '🏗️ Manage ' + levelNames[Math.min(city.level - 1, 3)] +
                ': ' + city.name;

            let progressDisplay = city.progress;
            let stockpileDisplay = city.stockpile;
            let costDisplay = '—';
            if (city.project) {
                if (city.project.type === 'unit') {
                    const tribeData = TRIBES_DATA.find(t => t.id === player.id);
                    const unitDef = tribeData.units[city.project.id];
                    if (unitDef) {
                        let cost = unitDef.cost;
                        let discount = 0;
                        const influence = getCityInfluence(city);
                        for (const tile of influence) {
                            const tileData = G.map[tile.r]?.[tile.q];
                            if (tileData && tileData.quarry) { discount = Math.max(discount, 0.2); }
                            if (tileData && tileData.fishing) { discount = Math.max(discount, 0.2); }
                            if (tileData && tileData.farm) { discount = Math.max(discount, 0.2); }
                        }
                        costDisplay = Math.ceil(cost * (1 - discount));
                    }
                } else if (city.project.type === 'tech') {
                    costDisplay = getTechCost(city.project.id);
                } else if (city.project.type === 'wonder') {
                    let cost = getWonderCost(city.project.id);
                    const discount = getCityImprovementDiscount(city);
                    costDisplay = Math.ceil(cost * (1 - discount));
                }
            }

            let html = `<div style="margin-bottom:8px;font-size:clamp(0.9rem,2.2vw,1rem);color:#b8957a;">
            <div>📦 Stockpile: <strong style="color:#fff;">${stockpileDisplay}</strong></div>
            <div>🔨 Progress: ${progressDisplay} / ${costDisplay}</div>
            ${city.project ? ' - Building: ' + city.project.id : ''}
          </div>`;

            html += `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;">
            <button class="gui-action-btn primary" onclick="showProductionTab('units')">Units</button>
            <button class="gui-action-btn primary" onclick="showProductionTab('techs')">Research</button>
            <button class="gui-action-btn primary" onclick="showProductionTab('wonders')">Wonders</button>
            ${city.level >= 4 ? `<button class="gui-action-btn primary" onclick="showProductionTab('upgrades')">Upgrades</button>` : ''}
          </div>`;

            html += `<div id="production-tab-content" style="max-height:300px;overflow-y:auto;-webkit-overflow-scrolling: touch;">`;
            html += `<p style="color:#6b5a4a;">Select a tab above.</p>`;
            html += `</div>`;

            let upgradeCost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
            if (player.techs.includes('architecture')) upgradeCost = Math.floor(upgradeCost * 0.8);
            const discount = getCityImprovementDiscount(city);
            upgradeCost = Math.ceil(upgradeCost * (1 - discount));
            if (city.level < 4) {
                html += `<div style="margin-top:12px;text-align:center;">
              <button class="gui-action-btn primary" onclick="upgradeCity(window._prodCity)">⬆ Upgrade to ${levelNames[Math.min(city.level, 3)]} (${upgradeCost} gold)</button>
            </div>`;
            } else {
                html += `<div style="margin-top:12px;text-align:center;color:#6b5a4a;">Maximum level reached.</div>`;
            }

            document.getElementById('modal-body').innerHTML = html;
            const actions = document.getElementById('modal-actions');
            actions.innerHTML = `<button onclick="closeModal()">Close</button>`;
            overlay.classList.add('active');

            window._prodCity = city;
            window._prodPlayer = player;
        }

                  ${tech.name} (${tech.cost} prod)

                }
            } else if (tab === 'wonders') {

                if (availWonders.length === 0) {
                    html = `<p style="color:#6b5a4a;">All wonders built!</p>`;
                } else {
                    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">`;

                        let cost = w.cost;

                        cost = Math.ceil(cost * (1 - discount));

                            `<button style="padding:8px;background:rgba(20,12,8,0.7);border:1px solid #3a281e;border-radius:6px;color:var(--cream);cursor:pointer;font-family:inherit;font-size:clamp(0.8rem,2vw,0.9rem);min-height:44px;touch-action:manipulation;" 
                  onclick="setCityProjectAndClose('${w.id}','wonder')">${w.name} (${cost} prod)<br><span style="font-size:0.6rem;color:#6b5a4a;">${w.desc}</span></button>`;

                }

                let universityCost = 200;
