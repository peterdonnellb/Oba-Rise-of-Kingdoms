                libraryCost = Math.ceil(libraryCost * (1 - discount));
                universityCost = Math.ceil(universityCost * (1 - discount));
                if (!city.hasLibrary) {
                    html +=
                        `<button class="gui-action-btn primary" onclick="buildLibrary(window._prodCity)" ${player.gold < libraryCost ? 'disabled' : ''} style="min-height:44px;touch-action:manipulation;">📚 Build Library (${libraryCost} gold) – +2 research/turn</button>`;
                } else if (!city.hasUniversity) {
                    html +=
                        `<button class="gui-action-btn primary" onclick="buildUniversity(window._prodCity)" ${player.gold < universityCost ? 'disabled' : ''} style="min-height:44px;touch-action:manipulation;">🏛️ Build University (${universityCost} gold) – +4 research/turn</button>`;
                } else {
                    html += `<p style="color:#6b5a4a;">All upgrades built.</p>`;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        function setCityProjectAndClose(id, type) {
            const city = window._prodCity;
            if (!city) return;
            if (type === 'tech' && isTechBeingResearched(id)) {
                showAlert('Already researching', 'This technology is already being researched in ' + getTechResearcher(
                id));
                return;
            }
            setCityProject(city, type, id);
            closeModal();
            updateUI();
            render();
            saveGame();
        }

        function upgradeCity(city) {
            const player = G.tribes.find(t => t.isPlayer);
            if (!player || city.owner !== player.id) return;
            let cost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
            if (player.techs.includes('architecture')) cost = Math.floor(cost * 0.8);
            const discount = getCityImprovementDiscount(city);
            cost = Math.ceil(cost * (1 - discount));
            if (player.gold < cost) { showAlert('Not enough gold', 'You need ' + cost + ' gold to upgrade.'); return; }
            if (city.level >= 4) { showAlert('Max level', 'City is already at maximum level.'); return; }
            player.gold -= cost;
            city.level++;
            updateUI();
            render();
            closeModal();
            openCityProduction();
            saveGame();
        }

        // ─── PROGRESS MODAL ──────────────────────────────────────────
        function showProgressModal() {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📊 Progress & Rankings';

            const tribes = G.aliveTribes.filter(t => t.alive);
            const data = tribes.map(t => {
                const cities = t.cities.length;
                const tiles = getTribeControlledTiles(t.id);
                return { tribe: t, cities, tiles };
            });
            data.sort((a, b) => b.cities - a.cities || b.tiles - a.tiles);

            let html = `<div style="font-size:clamp(0.9rem,2.2vw,1rem);margin-bottom:6px;">Turn ${G.turn}</div>`;
            html +=
                `<table style="width:100%;border-collapse:collapse;font-size:clamp(0.8rem,2vw,0.9rem);color:var(--cream-muted);">`;
            html += `<tr style="border-bottom:1px solid #3a281e;">
            <th style="text-align:left;padding:4px;">#</th>
            <th style="text-align:left;padding:4px;">Tribe</th>
            <th style="text-align:center;padding:4px;">🏙️</th>
            <th style="text-align:center;padding:4px;">🌍</th>
          </tr>`;
            data.forEach((item, index) => {
                const tribe = item.tribe;
                const isPlayer = tribe.isPlayer;
                html += `<tr style="border-bottom:1px solid #2a1a10;${isPlayer ? 'background:rgba(212,175,55,0.08);' : ''}">
              <td style="padding:4px;">${index + 1}</td>
              <td style="padding:4px;">${isPlayer ? '⭐ ' : ''}${tribe.icon} ${tribe.name}</td>
              <td style="text-align:center;padding:4px;">${item.cities}</td>
              <td style="text-align:center;padding:4px;">${item.tiles}</td>
            </tr>`;
            });
            html += `</table>`;
            html += `<div style="margin-top:8px;font-size:0.7rem;color:#6b5a4a;">Ranked by settlements, then area.</div>`;

            document.getElementById('modal-body').innerHTML = html;
            const actions = document.getElementById('modal-actions');
            actions.innerHTML = `<button onclick="closeModal()">Close</button>`;
            overlay.classList.add('active');
        }

        // ─── POPUP ACTION MENU ──────────────────────────────────
        const popup = document.getElementById('action-popup');

        function showActionPopup(x, y) {
            const rect = canvas.getBoundingClientRect();
            popup.style.display = 'flex';
            popup.style.opacity = '0';
            const popupRect = popup.getBoundingClientRect();
            const pw = popupRect.width;
            const ph = popupRect.height;

            let left = x - pw / 2;
            let top = y - ph - 10;

            const padding = 8;
            const maxLeft = rect.width - pw - padding;
            const maxTop = rect.height - ph - padding;
            left = Math.max(padding, Math.min(left, maxLeft));
            top = Math.max(padding, Math.min(top, maxTop));

            if (left < padding || left > maxLeft || top < padding || top > maxTop) {
                left = (rect.width - pw) / 2;
                top = (rect.height - ph) / 2;
            }

            popup.style.left = left + 'px';
            popup.style.top = top + 'px';
            popup.style.opacity = '1';

            requestAnimationFrame(() => {
                popup.classList.add('show');
            });
        }

        function hideActionPopup() {
            popup.classList.remove('show');
            setTimeout(() => {
                popup.style.display = 'none';
                popup.style.opacity = '1';
            }, 150);
            G.selectedResourceTile = null;
            G.selectedWaterTile = null;
        }

        function setupPopupDismissal() {
            canvas.addEventListener('wheel', () => {
                if (popup.style.display !== 'none') hideActionPopup();
            }, { passive: true });

            let touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartY = e.touches[0].clientY;
                }
            }, { passive: true });
            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && popup.style.display !== 'none') {
                    const dy = Math.abs(e.touches[0].clientY - touchStartY);
                    if (dy > 20) {
                        hideActionPopup();
                    }
                }
            }, { passive: true });

            document.addEventListener('click', (e) => {
                if (popup.style.display !== 'none') {
                    const target = e.target;
                    if (!popup.contains(target) && target !== canvas && !canvas.contains(target)) {
                        hideActionPopup();
                    }
                }
            });

            window.addEventListener('resize', () => {
                if (popup.style.display !== 'none') hideActionPopup();
            });
        }

        function updateActionPopup() {
            const unit = G.selectedUnit;
            const player = G.tribes.find(t => t.isPlayer);

            const mineBtn = popup.querySelector('[data-action="build-mine"]');
            const quarryBtn = popup.querySelector('[data-action="build-quarry"]');
            const fishBtn = popup.querySelector('[data-action="launch-fishing"]');
            const farmBtn = popup.querySelector('[data-action="build-farm"]');
            const harborBtn = popup.querySelector('[data-action="build-harbor-from-tile"]');

            const resourceTile = G.selectedResourceTile;
            if (resourceTile && !unit) {
                const isFish = resourceTile.resource === '🐟' && !resourceTile.fishing && canLaunchFishing(resourceTile,
                    player.id);
                const isFood = resourceTile.resource === '🌾' && !resourceTile.farm && canBuildFarm(resourceTile, player
                .id);

                fishBtn.style.display = isFish ? 'flex' : 'none';
                farmBtn.style.display = isFood ? 'flex' : 'none';
                harborBtn.style.display = 'none';

                popup.querySelectorAll('button').forEach(b => {
                    const action = b.dataset.action;
                    if (action !== 'launch-fishing' && action !== 'build-farm') {
                        b.style.display = 'none';
                    }
                });
                const dividers = popup.querySelectorAll('.popup-divider');
                dividers.forEach(d => d.style.display = (isFish || isFood) ? 'block' : 'none');
                return;
            }

            const waterTile = G.selectedWaterTile;
            if (waterTile && !unit) {
                const canBuild = canBuildHarborOnTile(waterTile, player.id);
                harborBtn.style.display = canBuild ? 'flex' : 'none';
                fishBtn.style.display = 'none';
                farmBtn.style.display = 'none';
                mineBtn.style.display = 'none';
                quarryBtn.style.display = 'none';
                popup.querySelectorAll('button').forEach(b => {
                    const action = b.dataset.action;
                    if (action !== 'build-harbor-from-tile') {
                        b.style.display = 'none';
                    }
                });
                const dividers = popup.querySelectorAll('.popup-divider');
                dividers.forEach(d => d.style.display = canBuild ? 'block' : 'none');
                return;
            }

            fishBtn.style.display = 'none';
            farmBtn.style.display = 'none';
            harborBtn.style.display = 'none';

            if (unit && unit.tribeId === player.id && !unit.hasMoved) {
                const tile = G.map[unit.r]?.[unit.q];
                mineBtn.style.display = canBuildMine(unit) ? 'flex' : 'none';
                quarryBtn.style.display = canBuildQuarry(unit) ? 'flex' : 'none';
            } else {
                mineBtn.style.display = 'none';
                quarryBtn.style.display = 'none';
            }

            if (!unit && G.selectedCity) {
                const city = G.selectedCity;
                const hasCity = city && city.owner === player.id;
                const manageBtn = popup.querySelector('[data-action="manage-city"]');
                const upgradeBtn = popup.querySelector('[data-action="upgrade-city"]');
                manageBtn.style.display = 'flex';
                upgradeBtn.style.display = 'flex';
                if (hasCity) {
                    let cost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
                    if (player.techs.includes('architecture')) cost = Math.floor(cost * 0.8);
                    const discount = getCityImprovementDiscount(city);
                    cost = Math.ceil(cost * (1 - discount));
                    upgradeBtn.disabled = city.level >= 4 || player.gold < cost;
                }
                popup.querySelectorAll('button').forEach(b => {
                    if (b.dataset.action !== 'manage-city' && b.dataset.action !== 'upgrade-city' &&
                        b.dataset.action !== 'build-mine' && b.dataset.action !== 'build-quarry') {
                        b.style.display = 'none';
                    }
                });
                const dividers = popup.querySelectorAll('.popup-divider');
                dividers.forEach(d => d.style.display = 'block');
                return;
            }

            if (!unit || !player || unit.tribeId !== player.id) {
                hideActionPopup();
                return;
            }

            popup.querySelectorAll('button').forEach(b => {
                if (b.dataset.action === 'build-mine' || b.dataset.action === 'build-quarry' ||
                    b.dataset.action === 'launch-fishing' || b.dataset.action === 'build-farm' ||
                    b.dataset.action === 'build-harbor-from-tile') return;
                b.style.display = 'flex';
            });
            const dividers = popup.querySelectorAll('.popup-divider');
            dividers.forEach(d => d.style.display = 'block');

            const moveBtn = popup.querySelector('[data-action="move"]');
            const attackBtn = popup.querySelector('[data-action="attack"]');
            const skipBtn = popup.querySelector('[data-action="skip"]');
            const healBtn = popup.querySelector('[data-action="heal"]');
            const invigorateBtn = popup.querySelector('[data-action="invigorate"]');
            const buildRaftBtn = popup.querySelector('[data-action="build-raft"]');
            const manageCityBtn = popup.querySelector('[data-action="manage-city"]');
            const upgradeCityBtn = popup.querySelector('[data-action="upgrade-city"]');

            const canAct = !unit.hasMoved && !unit.hasAttacked && !unit.hasHealed && !unit.hasUsedAbility;

            moveBtn.disabled = unit.hasMoved || G.turnPhase !== 'player';
            attackBtn.disabled = unit.hasAttacked || G.turnPhase !== 'player' || !canAct;
            skipBtn.disabled = unit.hasMoved || G.turnPhase !== 'player';

            healBtn.disabled = unit.hasMoved || unit.hasAttacked || unit.hasHealed || unit.hasUsedAbility ||
                unit.hp >= unit.maxHp || G.turnPhase !== 'player';
            healBtn.style.display = 'flex';

            if (unit.isGeneral) {
                invigorateBtn.style.display = 'flex';
                invigorateBtn.disabled = unit.hasMoved || unit.hasAttacked || unit.hasHealed || unit.hasUsedAbility ||
                    G.turnPhase !== 'player';
            } else {
                invigorateBtn.style.display = 'none';
            }

            buildRaftBtn.disabled = !canBuildRaft(unit);

            const tile = G.map[unit.r]?.[unit.q];
            const city = tile && tile.city ? tile.city : null;
            const hasCity = city && city.owner === player.id;

            if (hasCity) {
                manageCityBtn.style.display = 'flex';
                manageCityBtn.disabled = false;
                let cost = city.level === 1 ? 50 : city.level === 2 ? 80 : 120;
                if (player.techs.includes('architecture')) cost = Math.floor(cost * 0.8);
                const discount = getCityImprovementDiscount(city);
                cost = Math.ceil(cost * (1 - discount));
                upgradeCityBtn.style.display = 'flex';
                upgradeCityBtn.disabled = city.level >= 4 || player.gold < cost;
                G.selectedCity = city;
            } else {
                manageCityBtn.style.display = 'none';
                upgradeCityBtn.style.display = 'none';
            }

            if (unit && !unit.isNaval && unit.type !== 'tank') {
                buildRaftBtn.style.display = 'flex';
            } else {
                buildRaftBtn.style.display = 'none';
            }
        }

        // ─── POPUP BUTTON CLICKS ──────────────────────────────────
        popup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const action = btn.dataset.action;
                if (action === 'move') {
                    if (G.selectedHex) tryMoveUnit();
                    hideActionPopup();
                } else if (action === 'attack') {
                    if (G.selectedHex) tryAttackUnit();
                    hideActionPopup();
                } else if (action === 'skip') {
                    if (G.selectedUnit) {
                        G.selectedUnit.hasMoved = true;
                        G.selectedUnit = null;
                        updateUI();
                        render();
                        saveGame();
                    }
                    hideActionPopup();
                } else if (action === 'heal') {
                    tryHealUnit();
                    hideActionPopup();
                } else if (action === 'invigorate') {
                    tryInvigorate();
                    hideActionPopup();
                } else if (action === 'build-raft') {
                    if (G.selectedUnit) {
                        if (buildRaft(G.selectedUnit)) {
                            updateVisibility();
                            updateUI();
                            render();
                        }
                    }
                    hideActionPopup();
                } else if (action === 'manage-city') {
                    if (G.selectedCity) {
                        openCityProduction();
                    } else if (G.selectedHarbor) {
                        manageHarbor();
                    } else if (G.selectedUnit) {
                        const tile = G.map[G.selectedUnit.r]?.[G.selectedUnit.q];
                        if (tile && tile.city && tile.city.owner === G.selectedUnit.tribeId) {
                            G.selectedCity = tile.city;
                            openCityProduction();
                        }
                    }
                    hideActionPopup();
                } else if (action === 'upgrade-city') {
                    if (G.selectedCity) {
                        upgradeCity(G.selectedCity);
                    } else if (G.selectedUnit) {
                        const tile = G.map[G.selectedUnit.r]?.[G.selectedUnit.q];
                        if (tile && tile.city && tile.city.owner === G.selectedUnit.tribeId) {
                            G.selectedCity = tile.city;
                            upgradeCity(G.selectedCity);
                        }
                    }
                    hideActionPopup();
                } else if (action === 'build-mine') {
                    if (G.selectedUnit) {
                        if (buildMine(G.selectedUnit)) {
                            updateVisibility();
                            updateUI();
                            render();
                        }
                    }
                    hideActionPopup();
                } else if (action === 'build-quarry') {
                    if (G.selectedUnit) {
                        if (buildQuarry(G.selectedUnit)) {
                            updateVisibility();
                            updateUI();
                            render();
                        }
                    }
                    hideActionPopup();
                } else if (action === 'launch-fishing') {
                    if (G.selectedResourceTile) {
                        if (launchFishing(G.selectedResourceTile)) {
                            G.selectedResourceTile = null;
                            updateVisibility();
                            updateUI();
                            render();
                        }
                    }
                    hideActionPopup();
                } else if (action === 'build-farm') {
                    if (G.selectedResourceTile) {
                        if (buildFarm(G.selectedResourceTile)) {
                            G.selectedResourceTile = null;
                            updateVisibility();
                            updateUI();
                            render();
                        }
                    }
                    hideActionPopup();
                } else if (action === 'build-harbor-from-tile') {
                    if (G.selectedWaterTile) {
                        if (buildHarborOnTile(G.selectedWaterTile)) {
                            G.selectedWaterTile = null;
                            updateVisibility();
                            updateUI();
                            render();
                        }
                    }
                    hideActionPopup();
                }
            });
        });

        // ─── RENDER ──────────────────────────────────────────────────
        function render() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            const w = canvas.width,
                h = canvas.height;

            const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.75);
            grad.addColorStop(0, '#1B2A6B');
            grad.addColorStop(1, '#0a0f2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            const size = G.hexSize;
            if (!camera.centered) centerCamera();

            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            const player = G.tribes.find(t => t.isPlayer);
            const influenceMap = computeInfluenceMap();

            let reachableTiles = [];
            let attackableTiles = [];
            if (G.selectedUnit && G.selectedUnit.tribeId === player.id && !G.gameOver && G.turnPhase === 'player') {
                const unit = G.selectedUnit;
                if (!unit.hasMoved) {
                    const queue = [{ q: unit.q, r: unit.r, dist: 0 }];
                    const visited = new Set();
                    visited.add(hexKey(unit.q, unit.r));
                    while (queue.length > 0) {
                        const cur = queue.shift();
                        if (cur.dist > 0) {
                            const tile = G.map[cur.r]?.[cur.q];
                            if (tile && !tile.unit && isTilePassable(cur.q, cur.r, unit.isNaval, unit)) {
                                reachableTiles.push({ q: cur.q, r: cur.r });
                            }
                        }
                        if (cur.dist >= unit.move) continue;
                        const neighbors = hexNeighbors(cur.q, cur.r);
                        for (const n of neighbors) {
                            if (!inMap(n.q, n.r)) continue;
                            const key = hexKey(n.q, n.r);
                            if (visited.has(key)) continue;
                            const tile = G.map[n.r]?.[n.q];
                            if (!tile) continue;
                            if (tile.unit && tile.unit.tribeId !== unit.tribeId) continue;
                            if (!isTilePassable(n.q, n.r, unit.isNaval, unit)) continue;
                            const cost = getUnitMoveCost(unit, n.q, n.r);
                            if (cur.dist + cost > unit.move) continue;
                            visited.add(key);
                            queue.push({ q: n.q, r: n.r, dist: cur.dist + cost });
                        }
                    }
                }
                if (!unit.hasAttacked) {
                    for (const enemy of G.units) {
                        if (enemy.tribeId === unit.tribeId) continue;
                        if (!enemy.active) continue;
                        const dist = hexDistance({ q: unit.q, r: unit.r }, { q: enemy.q, r: enemy.r });
                        if (dist <= unit.attackRange && dist > 0) {
                            attackableTiles.push({ q: enemy.q, r: enemy.r });
                        }
                    }
                }
            }

            const fogImg = images['fog'];

            for (let r = 0; r < G.mapHeight; r++) {
                for (let q = 0; q < G.mapWidth; q++) {
                    const tile = G.map[r]?.[q];
                    if (!tile) continue;
                    const pos = hexToPixel(q, r, size);
                    const cx = pos.x,
                        cy = pos.y;

                    const isVisible = tile.visible;
                    const isExplored = tile.explored;

                    const pts = hexPolygonShortened(cx, cy, size * 0.98);
                    const hexPath = new Path2D();
                    hexPath.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) hexPath.lineTo(pts[i].x, pts[i].y);
                    hexPath.closePath();

                    if (!isExplored) {
                        if (fogImg && fogImg.complete && fogImg.naturalWidth > 0) {
                            ctx.save();
                            ctx.clip(hexPath);
                            let minX = Infinity,
                                maxX = -Infinity,
                                minY = Infinity,
                                maxY = -Infinity;
                            for (const p of pts) {
                                if (p.x < minX) minX = p.x;
                                if (p.x > maxX) maxX = p.x;
                                if (p.y < minY) minY = p.y;
                                if (p.y > maxY) maxY = p.y;
                            }
                            ctx.drawImage(fogImg, minX, minY, maxX - minX, maxY - minY);
                            ctx.restore();
                        } else {
                            ctx.fillStyle = '#0a0f1a';
                            ctx.fill(hexPath);
                        }
                        ctx.strokeStyle = 'rgba(60,50,40,0.3)';
                        ctx.lineWidth = 1.0 / camera.zoom;
                        ctx.stroke(hexPath);
                        continue;
                    }

                    const hasCity = tile.city !== null && tile.city !== undefined;
                    const city = tile.city;
                    const hasHarbor = tile.harbor !== null && tile.harbor !== undefined;
                    const harbor = tile.harbor;

                    // ─── Terrain background ────────────────────────────
                    if (isVisible && !hasCity && !hasHarbor) {
                        let terrainKey = 'hex_plains';
                        if (tile.terrain === 'forest') terrainKey = 'hex_forest';
                        else if (tile.terrain === 'mountain') terrainKey = 'hex_mountain';
                        else if (tile.terrain === 'water') terrainKey = 'hex_water';
                        else if (tile.terrain === 'hill') terrainKey = 'hex_hill';
                        else if (tile.terrain === 'desert') terrainKey = 'hex_desert';
                        const img = images[terrainKey];
                        if (img && img.complete && img.naturalWidth > 0) {
                            ctx.save();
                            ctx.clip(hexPath);
                            let minX = Infinity,
                                maxX = -Infinity,
                                minY = Infinity,
                                maxY = -Infinity;
                            for (const p of pts) {
                                if (p.x < minX) minX = p.x;
                                if (p.x > maxX) maxX = p.x;
                                if (p.y < minY) minY = p.y;
                                if (p.y > maxY) maxY = p.y;
                            }
                            ctx.drawImage(img, minX, minY, maxX - minX, maxY - minY);
                            ctx.restore();
                        } else {
                            let color = '#2a1a10';
                            if (isVisible) {
                                switch (tile.terrain) {
                                    case 'plains':
                                        color = '#4a6a3a';
                                        break;
                                    case 'forest':
                                        color = '#2d5a2a';
                                        break;
                                    case 'mountain':
                                        color = '#6a5a4a';
                                        break;
                                    case 'water':
                                        color = '#1a3a5a';
                                        break;
                                    case 'hill':
                                        color = '#5a6a4a';
                                        break;
                                    case 'desert':
                                        color = '#c4a86a';
                                        break;
                                    default:
                                        color = '#4a6a3a';
                                }
                            } else {
                                color = '#1a2a1a';
                            }
                            ctx.fillStyle = color;
                            ctx.fill(hexPath);
                        }
                        if (tile.isRiver) {
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * 0.3, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(64,164,223,0.25)';
                            ctx.fill();
                            ctx.restore();
                        }
                    } else if (isVisible && (hasCity || hasHarbor)) {
                        let bgColor = '#3a2a1a';
                        if (hasCity && city && !city.isNeutral && city.owner) {
                            const tribe = G.tribes.find(t => t.id === city.owner);
                            if (tribe) bgColor = tribe.color;
                        } else if (hasHarbor && harbor.owner) {
                            bgColor = '#1a3a5a';
                        }
                        ctx.fillStyle = bgColor;
                        ctx.fill(hexPath);
                        if (tile.isRiver) {
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * 0.3, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(64,164,223,0.2)';
                            ctx.fill();
                            ctx.restore();
                        }
                    } else {
                        let color = '#1a2a1a';
                        ctx.fillStyle = color;
                        ctx.fill(hexPath);
                    }

                    // ─── Influence border ───
                    const key = hexKey(q, r);
                    const influenceColor = influenceMap[key];
                    if (influenceColor && (isVisible || tile.owner === player.id)) {
                        ctx.save();
                        ctx.strokeStyle = influenceColor;
                        ctx.lineWidth = 5 / camera.zoom;
                        ctx.stroke(hexPath);
                        ctx.restore();
                    }

                    // ─── Border ───
                    let borderColor = '#d0c4b8';
                    let borderWidth = 1.0 / camera.zoom;
                    if (isVisible && tile.owner) {
                        const tribe = G.tribes.find(t => t.id === tile.owner);
                        if (tribe) {
                            borderColor = tribe.color;
                            borderWidth = 2.5 / camera.zoom;
                        }
                    }
                    ctx.strokeStyle = borderColor;
                    ctx.lineWidth = borderWidth;
                    ctx.stroke(hexPath);

                    // ─── Reachable/attackable highlights ───
                    if (isVisible) {
                        const isReachable = reachableTiles.some(t => t.q === q && t.r === r);
                        const isAttackable = attackableTiles.some(t => t.q === q && t.r === r);
                        if (isReachable || isAttackable) {
                            ctx.save();
                            ctx.clip(hexPath);
                            ctx.fillStyle = isAttackable ? 'rgba(255,0,0,0.3)' : 'rgba(0,255,0,0.25)';
                            ctx.fillRect(pts[0].x, pts[0].y, pts[2].x - pts[0].x, pts[3].y - pts[0].y);
                            ctx.restore();
                            ctx.strokeStyle = isAttackable ? '#ff0000' : '#00ff00';
                            ctx.lineWidth = 2.0 / camera.zoom;
                            ctx.stroke(hexPath);
                        }
                    }

                    // ─── City influence ring ───
                    if (isVisible && hasCity) {
                        const radius = city.level === 1 ? 0 : city.level === 2 ? 1 : city.level >= 3 ? 2 : 0;
                        if (radius > 0) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * (0.85 + radius * 0.3), 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(255,215,0,0.15)';
                            ctx.lineWidth = 1.5 / camera.zoom;
                            ctx.setLineDash([3 / camera.zoom, 5 / camera.zoom]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    }

                    // ─── Draw elements on visible tiles ───
                    if (isVisible) {
                        // ─── Resource icon ───
                        if (tile.resource && !hasCity && !hasHarbor && !tile.fishing && !tile.farm) {
                            const resKey = RESOURCE_MAP[tile.resource];
                            const resImg = resKey ? images[resKey] : null;
                            if (resImg && resImg.complete && resImg.naturalWidth > 0) {
                                const rSize = size * 0.4;
                                ctx.drawImage(resImg, cx - rSize / 2, cy + size * 0.2 - rSize / 2, rSize, rSize);
                            } else {
                                ctx.save();
                                ctx.font = `${size * 0.35}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'bottom';
                                ctx.shadowColor = 'rgba(0,0,0,0.7)';
                                ctx.shadowBlur = 4;
                                ctx.fillStyle = '#f0e6d3';
                                ctx.fillText(tile.resource, cx, cy + size * 0.42);
                                ctx.restore();
                            }
                        }

                        // ─── Fishing icon ───
                        if (tile.fishing) {
                            const fishImg = images['fishing'];
                            const fSize = size * 0.9;
                            if (fishImg && fishImg.complete && fishImg.naturalWidth > 0) {
                                ctx.save();
                                ctx.drawImage(fishImg, cx - fSize / 2, cy + size * 0.1 - fSize / 2, fSize, fSize);
                                ctx.restore();
                            } else {
                                ctx.save();
                                ctx.font = `${size * 0.8}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillStyle = '#00bcd4';
                                ctx.fillText('🎣', cx, cy + size * 0.1);
                                ctx.restore();
                            }
                        }

                        // ─── Farm icon ───
                        if (tile.farm) {
                            const farmImg = images['farm'];
                            const fSize = size * 0.9;
                            if (farmImg && farmImg.complete && farmImg.naturalWidth > 0) {
                                ctx.save();
                                ctx.drawImage(farmImg, cx - fSize / 2, cy + size * 0.1 - fSize / 2, fSize, fSize);
                                ctx.restore();
                            } else {
                                ctx.save();
                                ctx.font = `${size * 0.8}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillStyle = '#4caf50';
                                ctx.fillText('🌾', cx, cy + size * 0.1);
                                ctx.restore();
                            }
                        }

                        // ─── Mine / Quarry icon ───
                        if (tile.mine) {
                            const mineImg = images['mine'];
                            if (mineImg && mineImg.complete && mineImg.naturalWidth > 0) {
                                const mSize = size * 0.45;
                                ctx.drawImage(mineImg, cx - mSize / 2, cy + size * 0.1 - mSize / 2, mSize, mSize);
                            } else {
                                ctx.save();
                                ctx.font = `${size * 0.4}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillStyle = '#f1c40f';
                                ctx.fillText('⛏️', cx, cy + size * 0.1);
                                ctx.restore();
                            }
                        }
                        if (tile.quarry) {
                            const quarryImg = images['quarry'];
                            if (quarryImg && quarryImg.complete && quarryImg.naturalWidth > 0) {
                                const qSize = size * 0.45;
                                ctx.drawImage(quarryImg, cx - qSize / 2, cy + size * 0.1 - qSize / 2, qSize, qSize);
                            } else {
                                ctx.save();
                                ctx.font = `${size * 0.4}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillStyle = '#95a5a6';
                                ctx.fillText('🪨', cx, cy + size * 0.1);
                                ctx.restore();
                            }
                        }

                        // ─── Wonder Icon ───
                        if (tile.wonderIcon) {
                            const wonderId = tile.wonderIcon;
                            const iconKey = WONDER_ICON_MAP[wonderId];
                            if (iconKey && images[iconKey]) {
                                const img = images[iconKey];
                                const wSize = size * 0.6;
                                if (img && img.complete && img.naturalWidth > 0) {
                                    ctx.save();
                                    ctx.drawImage(img, cx - wSize / 2, cy + size * 0.1 - wSize / 2, wSize, wSize);
                                    ctx.restore();
                                } else {
                                    ctx.save();
                                    ctx.font = `${size * 0.6}px sans-serif`;
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillStyle = '#ffd700';
                                    ctx.fillText('🏛️', cx, cy + size * 0.1);
                                    ctx.restore();
                                }
                            }
                        }

                        // ─── City ───
                        if (hasCity) {
                            let settlementKey = 'settlement_village';
                            if (city.level === 2) settlementKey = 'settlement_town';
                            else if (city.level === 3) settlementKey = 'settlement_city';
                            else if (city.level >= 4) settlementKey = 'settlement_capital';
                            const sImg = images[settlementKey];
                            const cs = size * 1.3;
                            if (sImg && sImg.complete && sImg.naturalWidth > 0) {
                                ctx.drawImage(sImg, cx - cs / 2, cy - cs / 2 - size * 0.05, cs, cs);
                            } else {
                                ctx.font = `${size * 0.8}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                const icon = city.isNeutral ? '🏚️' : city.level === 1 ? '🏘️' : city.level === 2 ? '🏙️' :
                                    city.level >= 3 ? '🏛️' : '🏙️';
                                ctx.fillStyle = '#f0e6d3';
                                ctx.fillText(icon, cx, cy - size * 0.05);
                            }
                            if (city.hasLibrary) {
                                const libImg = images['library'];
                                if (libImg && libImg.complete && libImg.naturalWidth > 0) {
                                    const lSize = size * 0.25;
                                    ctx.drawImage(libImg, cx + size * 0.35 - lSize / 2, cy - size * 0.4 - lSize / 2, lSize,
                                        lSize);
                                } else {
                                    ctx.save();
                                    ctx.font = `${size * 0.25}px sans-serif`;
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillStyle = '#4fc3f7';
                                    ctx.fillText('📚', cx + size * 0.35, cy - size * 0.4);
                                    ctx.restore();
                                }
                            }
                            if (city.hasUniversity) {
                                const uniImg = images['university'];
                                if (uniImg && uniImg.complete && uniImg.naturalWidth > 0) {
                                    const uSize = size * 0.3;
                                    ctx.drawImage(uniImg, cx - size * 0.35 - uSize / 2, cy - size * 0.4 - uSize / 2, uSize,
                                        uSize);
                                } else {
                                    ctx.save();
                                    ctx.font = `${size * 0.3}px sans-serif`;
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillStyle = '#ab47bc';
                                    ctx.fillText('🏛️', cx - size * 0.35, cy - size * 0.4);
                                    ctx.restore();
                                }
                            }
                            if (city.name) {
                                ctx.save();
                                ctx.font = `${size * 0.2}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'bottom';
                                ctx.fillStyle = 'rgba(240,230,211,0.6)';
                                ctx.fillText(city.name, cx, cy + size * 0.55);
                                ctx.restore();
                            }
                            if (!city.isNeutral && city.owner) {
                                const tribe = G.tribes.find(t => t.id === city.owner);
                                if (tribe) {
                                    const iconSize = size * 0.3;
                                    const ix = cx - iconSize / 2;
                                    const iy = cy + size * 0.6 - iconSize / 2;
                                    const iconKey = `tribe_${tribe.id}`;
                                    const iconImg = images[iconKey];
                                    if (iconImg && iconImg.complete && iconImg.naturalWidth > 0) {
                                        ctx.save();
                                        ctx.beginPath();
                                        ctx.arc(ix + iconSize / 2, iy + iconSize / 2, iconSize / 2 + 4, 0, Math.PI * 2);
                                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                                        ctx.fill();
                                        ctx.drawImage(iconImg, ix, iy, iconSize, iconSize);
                                        ctx.restore();
                                    } else {
                                        ctx.save();
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'middle';
                                        ctx.font = `${iconSize * 0.9}px sans-serif`;
                                        ctx.shadowColor = 'rgba(0,0,0,0.9)';
                                        ctx.shadowBlur = 6;
                                        ctx.fillStyle = '#ffffff';
                                        ctx.fillText(tribe.icon, ix + iconSize / 2, iy + iconSize / 2);
                                        ctx.shadowBlur = 0;
                                        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                                        ctx.lineWidth = 2.5;
                                        ctx.strokeText(tribe.icon, ix + iconSize / 2, iy + iconSize / 2);
                                        ctx.fillStyle = '#ffffff';
                                        ctx.fillText(tribe.icon, ix + iconSize / 2, iy + iconSize / 2);
                                        ctx.restore();
                                    }
                                }
                            }
                            if (city.project) {
                                let cost = 0;
                                let ringColor = '#ffd700';
                                let progressVal = city.progress;
                                if (city.project.type === 'unit') {
                                    const tribeData = TRIBES_DATA.find(t => t.id === city.owner);
                                    if (tribeData) {
                                        const unitDef = tribeData.units[city.project.id];
                                        if (unitDef) {
                                            cost = unitDef.cost;
                                            let discount = 0;
                                            const influence = getCityInfluence(city);
                                            for (const tileInf of influence) {
                                                const tileData = G.map[tileInf.r]?.[tileInf.q];
                                                if (tileData && tileData.quarry) { discount = Math.max(discount,
                                                    0.2); }
                                                if (tileData && tileData.fishing) { discount = Math.max(discount,
                                                    0.2); }
                                                if (tileData && tileData.farm) { discount = Math.max(discount,
                                                    0.2); }
                                            }
                                            cost = Math.ceil(cost * (1 - discount));
                                        }
                                    }
                                    ringColor = '#ffd700';
                                } else if (city.project.type === 'tech') {
                                    cost = getTechCost(city.project.id);
                                    const cityTribe = getTribe(city.owner);
                                    progressVal = cityTribe ? cityTribe.researchProgress[city.project.id] || 0 : 0;
                                    ringColor = '#4fc3f7';
                                } else if (city.project.type === 'wonder') {
                                    cost = getWonderCost(city.project.id);
                                    const discount = getCityImprovementDiscount(city);
                                    cost = Math.ceil(cost * (1 - discount));
                                    ringColor = '#ab47bc';
                                }
                                if (cost > 0 && progressVal > 0) {
                                    const pct = Math.min(1, progressVal / cost);
                                    ctx.beginPath();
                                    ctx.arc(cx, cy + size * 0.4, size * 0.2, -Math.PI / 2, -Math.PI / 2 + pct * 2 * Math
                                        .PI);
                                    ctx.strokeStyle = ringColor;
                                    ctx.lineWidth = 3.0 / camera.zoom;
                                    ctx.stroke();
                                }
                            }
                            ctx.beginPath();
                            ctx.arc(cx, cy + size * 0.4, size * 0.2, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(255,215,0,0.12)';
                            ctx.fill();
                            ctx.strokeStyle = 'rgba(255,215,0,0.25)';
                            ctx.lineWidth = 1.5 / camera.zoom;
                            ctx.stroke();
                        }

                        // ─── Harbor ─── (50% larger)
                        if (hasHarbor) {
                            const harborImg = images['harbor'];
                            const hSize = size * 1.8; // 50% larger than previous 1.2
                            if (harborImg && harborImg.complete && harborImg.naturalWidth > 0) {
                                ctx.save();
                                ctx.globalAlpha = 0.9;
                                ctx.drawImage(harborImg, cx - hSize / 2, cy - hSize / 2 - size * 0.02, hSize, hSize);
                                ctx.restore();
                            } else {
                                ctx.save();
                                ctx.font = `${size * 1.2}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                                ctx.shadowBlur = 15 / camera.zoom;
                                ctx.fillStyle = '#f0e6d3';
                                ctx.fillText('⚓', cx, cy - size * 0.02);
                                ctx.shadowBlur = 0;
                                ctx.restore();
                            }
                            if (harbor.project) {
                                const tribeData = TRIBES_DATA.find(t => t.id === harbor.owner);
                                let cost = 0;
                                if (tribeData) {
                                    const unitDef = tribeData.units[harbor.project.id];
                                    if (unitDef) cost = unitDef.cost;
                                    const city = G.cities.find(c => c.owner === harbor.owner && hexDistance({ q: c.q,
                                            r: c.r }, { q: harbor.q, r: harbor.r }) <= 2);
                                    if (city) {
                                        const discount = getCityUnitDiscount(city);
                                        cost = Math.ceil(cost * (1 - discount));
                                    }
                                }
                                if (cost > 0) {
                                    const pct = Math.min(1, harbor.production / cost);
                                    ctx.beginPath();
                                    ctx.arc(cx, cy + size * 0.4, size * 0.18, -Math.PI / 2, -Math.PI / 2 + pct * 2 * Math
                                        .PI);
                                    ctx.strokeStyle = '#00bcd4';
                                    ctx.lineWidth = 2.5 / camera.zoom;
                                    ctx.stroke();
                                }
                            }
                        }

                        // ─── Unit ───
                        if (tile.unit) {
                            const unit = tile.unit;
                            const tribe = G.tribes.find(t => t.id === unit.tribeId);
                            const unitKey = tribe ? `${tribe.id}_${unit.type}` : 'unit_foot';
                            const img = images[unitKey];
                            const us = size * 0.7;

                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(cx, cy - size * 0.05, us * 0.6, 0, Math.PI * 2);
                            const tribeColor = tribe ? tribe.color : '#ffffff';
                            ctx.fillStyle = tribeColor + '59';
                            ctx.fill();
                            ctx.restore();

                            if (unit.boosted) {
                                ctx.save();
                                ctx.beginPath();
                                ctx.arc(cx, cy - size * 0.05, us * 0.75, 0, Math.PI * 2);
                                ctx.strokeStyle = 'rgba(155,89,182,0.6)';
                                ctx.lineWidth = 3 / camera.zoom;
                                ctx.setLineDash([3 / camera.zoom, 4 / camera.zoom]);
                                ctx.stroke();
                                ctx.setLineDash([]);
                                ctx.restore();
                            }

                            if (unit.isNaval) {
                                ctx.save();
                                ctx.shadowColor = 'rgba(0,200,255,0.6)';
                                ctx.shadowBlur = 30 / camera.zoom;
                                ctx.shadowOffsetX = 0;
                                ctx.shadowOffsetY = 0;
                            } else {
                                ctx.save();
                                ctx.shadowColor = 'rgba(255,220,100,0.7)';
                                ctx.shadowBlur = 45 / camera.zoom;
                            }

                            if (img && img.complete && img.naturalWidth > 0) {
                                ctx.drawImage(img, cx - us / 2, cy - us / 2 - size * 0.05, us, us);
                            } else {
                                const tData = TRIBES_DATA.find(t => t.id === unit.tribeId);
                                const icon = tData ? tData.icon : '⚔️';
                                ctx.font = `${size * 0.7}px sans-serif`;
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillStyle = '#f0e6d3';
                                ctx.fillText(icon, cx, cy - size * 0.05);
                            }
                            ctx.restore();

                            if (unit.veteranLevel > 0) {
                                const iconKey = unit.veteranLevel === 1 ? 'veteran' : 'legendary';
                                const vImg = images[iconKey];
                                const vSize = unit.veteranLevel === 1 ? size * 0.25 : size * 0.3;
                                const vx = cx + us / 2 - vSize / 2;
                                const vy = cy - size * 0.05 - us / 2 - vSize / 2;
                                if (vImg && vImg.complete && vImg.naturalWidth > 0) {
                                    ctx.drawImage(vImg, vx, vy, vSize, vSize);
                                } else {
                                    ctx.save();
                                    ctx.font = `${vSize}px sans-serif`;
                                    ctx.textAlign = 'center';
                                    ctx.textBaseline = 'middle';
                                    ctx.fillStyle = unit.veteranLevel === 1 ? '#ffaa00' : '#ff4444';
                                    ctx.shadowColor = 'rgba(0,0,0,0.9)';
                                    ctx.shadowBlur = 6;
                                    ctx.fillText(unit.veteranLevel === 1 ? '★' : '⭐', vx + vSize / 2, vy + vSize / 2);
                                    ctx.restore();
                                }
                            }

                            const hpPct = unit.hp / unit.maxHp;
                            const barW = size * 0.5,
                                barH = 5 / camera.zoom;
                            const bx = cx - barW / 2,
                                by = cy + size * 0.42;
                            ctx.fillStyle = 'rgba(0,0,0,0.6)';
                            ctx.fillRect(bx, by, barW, barH);
                            ctx.fillStyle = hpPct > 0.5 ? '#4caf50' : hpPct > 0.25 ? '#ff9800' : '#e53935';
                            ctx.fillRect(bx, by, barW * hpPct, barH);

                            if (G.selectedUnit && G.selectedUnit.id === unit.id) {
                                ctx.beginPath();
                                ctx.arc(cx, cy, size * 0.6, 0, Math.PI * 2);
                                ctx.strokeStyle = '#ffd700';
                                ctx.lineWidth = 2.5 / camera.zoom;
                                ctx.setLineDash([4 / camera.zoom, 6 / camera.zoom]);
                                ctx.stroke();
                                ctx.setLineDash([]);
                            }
                        }

                        // ─── Selection highlights ───
                        if (G.selectedHex && G.selectedHex.q === q && G.selectedHex.r === r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * 0.45, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                            ctx.lineWidth = 2 / camera.zoom;
                            ctx.stroke();
                        }

                        if (G.selectedCity && G.selectedCity.q === q && G.selectedCity.r === r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * 0.55, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(0,255,200,0.4)';
                            ctx.lineWidth = 2 / camera.zoom;
                            ctx.stroke();
                        }
                        if (G.selectedHarbor && G.selectedHarbor.q === q && G.selectedHarbor.r === r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * 0.55, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(0,200,255,0.5)';
                            ctx.lineWidth = 2 / camera.zoom;
                            ctx.stroke();
                        }
                        if (G.selectedResourceTile && G.selectedResourceTile.q === q && G.selectedResourceTile.r === r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * 0.5, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(0,255,100,0.5)';
                            ctx.lineWidth = 2.5 / camera.zoom;
                            ctx.setLineDash([4 / camera.zoom, 4 / camera.zoom]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                        if (G.selectedWaterTile && G.selectedWaterTile.q === q && G.selectedWaterTile.r === r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, size * 0.5, 0, Math.PI * 2);
                            ctx.strokeStyle = 'rgba(0,200,255,0.6)';
                            ctx.lineWidth = 2.5 / camera.zoom;
                            ctx.setLineDash([4 / camera.zoom, 4 / camera.zoom]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    } else {
                        if (tile.city) {
                            ctx.font = `${size * 0.4}px sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = 'rgba(100,80,60,0.4)';
                            ctx.fillText('🏚️', cx, cy);
                        }
                        if (tile.unit) {
                            ctx.font = `${size * 0.4}px sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = 'rgba(100,80,60,0.4)';
                            ctx.fillText('⚔️', cx, cy);
                        }
                    }
                }
            }
            ctx.restore();

            if (G.eliminationMessages.length > 0) {
                const msg = G.eliminationMessages[G.eliminationMessages.length - 1];
                ctx.fillStyle = 'rgba(255,200,100,0.9)';
                ctx.font = '18px Afacad, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(msg, w / 2, 60);
            }

            if (G.gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                ctx.fillRect(0, 0, w, h);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = '52px MedievalSharp, serif';
                ctx.fillStyle = G.winner === 'Player' ? '#d4a373' : '#b54a34';
                ctx.fillText(G.winner === 'Player' ? '🏆 VICTORY 🏆' : '💀 DEFEAT 💀', w / 2, h / 2);
            }
        }

        // ─── UI UPDATE ────────────────────────────────────────────
        function updateUI() {
            const player = G.tribes.find(t => t.isPlayer);
            if (!player) return;
            const tribeNameSpan = document.getElementById('gui-tribe-name');
            if (tribeNameSpan) {
                const iconKey = `tribe_${player.id}`;
                const iconImg = images[iconKey];
                if (iconImg && iconImg.complete && iconImg.naturalWidth > 0) {
                    tribeNameSpan.innerHTML =
                        `<img src="${iconImg.src}" style="width:24px;height:24px;border-radius:4px;vertical-align:middle;margin-right:4px;" /> ${player.name}`;
                } else {
                    tribeNameSpan.innerHTML = `<span class="tribe-icon">${player.icon}</span> ${player.name}`;
                }
            }

            document.getElementById('gui-turn').textContent = `Turn ${G.turn}`;
            document.getElementById('gui-gold').textContent = Math.floor(player.gold);
            document.getElementById('gui-research').textContent = Math.floor(player.researchPoints);

            const unit = G.selectedUnit;
            const city = G.selectedCity;
            const harbor = G.selectedHarbor;

            if (unit) {
                const atkVal = unit.atk + (unit.boostedAtk || 0);
                const defVal = unit.def + (unit.boostedDef || 0);
                const name = unit.name + (unit.veteranLevel === 1 ? ' ★' : unit.veteranLevel === 2 ? ' ⭐' : '');
                document.getElementById('unit-name-display').textContent = name + (unit.boosted ? ' ⚡' : '') + (unit.isNaval ?
                    ' ⛵' : '');
                document.getElementById('unit-atk').textContent = atkVal;
                document.getElementById('unit-def').textContent = defVal;
                document.getElementById('unit-mov').textContent = unit.hasMoved ? 0 : unit.move;
                document.getElementById('unit-hp').textContent = `${unit.hp}/${unit.maxHp}`;
            } else if (city) {
                const levelNames = ['Village', 'Town', 'City', 'Metropolis'];
                document.getElementById('unit-name-display').textContent = city.name + ' (' + levelNames[Math.min(city
                    .level - 1, 3)] + ')';
                document.getElementById('unit-atk').textContent = '—';
                document.getElementById('unit-def').textContent = '—';
                document.getElementById('unit-mov').textContent = '—';
                document.getElementById('unit-hp').textContent = '—';
            } else if (harbor) {
                document.getElementById('unit-name-display').textContent = '⛵ Harbor';
                document.getElementById('unit-atk').textContent = '—';
                document.getElementById('unit-def').textContent = '—';
                document.getElementById('unit-mov').textContent = '—';
                document.getElementById('unit-hp').textContent = '—';
            } else {
                document.getElementById('unit-name-display').textContent = 'No selection';
                document.getElementById('unit-atk').textContent = '—';
                document.getElementById('unit-def').textContent = '—';
                document.getElementById('unit-mov').textContent = '—';
                document.getElementById('unit-hp').textContent = '—';
            }
            document.getElementById('btn-end-turn').disabled = G.turnPhase !== 'player' || G.gameOver;
            updateActionPopup();
        }

        // ─── CANVAS INTERACTION ──────────────────────────────────
        let isDragging = false;
        let dragStartX = 0,
            dragStartY = 0;
        let camStartX = 0,
            camStartY = 0;
        let mouseDownPos = { x: 0, y: 0 };
        let isClick = false;
        let lastTouchDist = 0;
        let touchStartPos = { x: 0, y: 0 };

        function handleClick(sx, sy) {
            if (G.gameOver || G.turnPhase !== 'player') return;
            const player = G.tribes.find(t => t.isPlayer);
            if (!player) return;

            const world = screenToWorld(sx, sy);
            const hex = getHexFromScreen(sx, sy);
            if (!inMap(hex.q, hex.r)) return;
            const tile = G.map[hex.r]?.[hex.q];

            if (popup.style.display !== 'none') {
                const popupRect = popup.getBoundingClientRect();
                const rect = canvas.getBoundingClientRect();
                const canvasX = (sx / canvas.width) * rect.width + rect.left;
                const canvasY = (sy / canvas.height) * rect.height + rect.top;
                if (!(canvasX >= popupRect.left && canvasX <= popupRect.right &&
                        canvasY >= popupRect.top && canvasY <= popupRect.bottom)) {
                    hideActionPopup();
                } else {
                    return;
                }
            }

            // --- Unit selection/action ---
            if (tile && tile.unit) {
                const unit = tile.unit;
                if (unit.tribeId === player.id) {
                    G.selectedUnit = unit;
                    G.selectedCity = null;
                    G.selectedHarbor = null;
                    G.selectedResourceTile = null;
                    G.selectedWaterTile = null;
                    if (tile.city && tile.city.owner === player.id) {
                        G.selectedCity = tile.city;
                    }
                    showActionPopup(sx, sy);
                    updateUI();
                    render();
                    return;
                } else {
                    if (G.selectedUnit) {
                        const dist = hexDistance({ q: G.selectedUnit.q, r: G.selectedUnit.r }, { q: hex.q, r: hex.r });
                        if (dist <= G.selectedUnit.attackRange && !G.selectedUnit.hasAttacked) {
                            G.selectedHex = hex;
                            tryAttackUnit();
                            return;
                        }
                    }
                    G.selectedUnit = null;
                    G.selectedCity = null;
                    G.selectedHarbor = null;
                    G.selectedResourceTile = null;
                    G.selectedWaterTile = null;
                    hideActionPopup();
                    updateUI();
                    render();
                    return;
                }
            }

            if (G.selectedUnit) {
                const unit = G.selectedUnit;
                if (tile && !tile.unit) {
                    const dist = hexDistance({ q: unit.q, r: unit.r }, { q: hex.q, r: hex.r });
                    if (dist <= unit.move && !unit.hasMoved) {
                        if (isTilePassable(hex.q, hex.r, unit.isNaval, unit)) {
                            G.selectedHex = hex;
                            tryMoveUnit();
                            return;
                        }
                    }
                }
                if (tile && tile.city && tile.city.owner === player.id) {
                    G.selectedCity = tile.city;
                    G.selectedUnit = null;
                    G.selectedHarbor = null;
                    G.selectedResourceTile = null;
                    G.selectedWaterTile = null;
                    openCityProduction();
                    return;
                }
                if (tile && tile.harbor && tile.harbor.owner === player.id) {
                    G.selectedHarbor = tile.harbor;
                    G.selectedUnit = null;
                    G.selectedCity = null;
                    G.selectedResourceTile = null;
                    G.selectedWaterTile = null;
                    manageHarbor();
                    return;
                }
                G.selectedUnit = null;
                hideActionPopup();
                updateUI();
                render();
                // fall through
            }

            // --- Water tile (harbor) ---
            if (tile && tile.visible && tile.terrain === 'water' && !tile.harbor && !tile.resource) {
                if (canBuildHarborOnTile(tile, player.id)) {
                    G.selectedWaterTile = tile;
                    G.selectedUnit = null;
                    G.selectedCity = null;
                    G.selectedHarbor = null;
                    G.selectedResourceTile = null;
                    showActionPopup(sx, sy);
                    updateUI();
                    render();
                    return;
                }
            }

            // --- Resource tile (fish/food) ---
            if (tile && tile.visible && !tile.unit && !tile.city && !tile.harbor) {
                const isFish = tile.resource === '🐟' && !tile.fishing && canLaunchFishing(tile, player.id);
                const isFood = tile.resource === '🌾' && !tile.farm && canBuildFarm(tile, player.id);
                if (isFish || isFood) {
                    G.selectedResourceTile = tile;
                    G.selectedUnit = null;
                    G.selectedCity = null;
                    G.selectedHarbor = null;
                    G.selectedWaterTile = null;
                    showActionPopup(sx, sy);
                    updateUI();
                    render();
                    return;
                }
            }

            // --- City ---
            if (tile && tile.city && tile.visible) {
                const city = tile.city;
                if (city.owner === player.id) {
                    G.selectedCity = city;
                    G.selectedUnit = null;
                    G.selectedHarbor = null;
                    G.selectedResourceTile = null;
                    G.selectedWaterTile = null;
                    openCityProduction();
                    return;
                }
            }

            // --- Harbor ---
            if (tile && tile.harbor && tile.visible) {
                const harbor = tile.harbor;
                if (harbor.owner === player.id) {
                    G.selectedHarbor = harbor;
                    G.selectedUnit = null;
                    G.selectedCity = null;
                    G.selectedResourceTile = null;
                    G.selectedWaterTile = null;
                    manageHarbor();
                    return;
                }
            }

            // --- Nothing ---
            G.selectedUnit = null;
            G.selectedCity = null;
            G.selectedHarbor = null;
            G.selectedResourceTile = null;
            G.selectedWaterTile = null;
            hideActionPopup();
            updateUI();
            render();
        }

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
            mouseDownPos.x = sx;
            mouseDownPos.y = sy;
            camStartX = camera.x;
            camStartY = camera.y;
            isClick = true;
            isDragging = false;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (e.buttons === 0) { isDragging = false; return; }
            const rect = canvas.getBoundingClientRect();
            const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
            const dx = sx - mouseDownPos.x;
            const dy = sy - mouseDownPos.y;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                isClick = false;
                isDragging = true;
                if (popup.style.display !== 'none') hideActionPopup();
                camera.x = camStartX + dx;
                camera.y = camStartY + dy;
                render();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (isClick) {
                const rect = canvas.getBoundingClientRect();
                const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
                const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
                handleClick(sx, sy);
            }
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => { isDragging = false; });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 1) {
                const t = touches[0];
                const rect = canvas.getBoundingClientRect();
                const sx = (t.clientX - rect.left) * (canvas.width / rect.width);
                const sy = (t.clientY - rect.top) * (canvas.height / rect.height);
                mouseDownPos.x = sx;
                mouseDownPos.y = sy;
                touchStartPos.x = sx;
                touchStartPos.y = sy;
                camStartX = camera.x;
                camStartY = camera.y;
                isClick = true;
                isDragging = false;
            } else if (touches.length === 2) {
                isDragging = false;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 1) {
                const t = touches[0];
                const rect = canvas.getBoundingClientRect();
                const sx = (t.clientX - rect.left) * (canvas.width / rect.width);
                const sy = (t.clientY - rect.top) * (canvas.height / rect.height);
                const dx = sx - mouseDownPos.x;
                const dy = sy - mouseDownPos.y;
                if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
                    isClick = false;
                    isDragging = true;
                    if (popup.style.display !== 'none') hideActionPopup();
                }
                if (isDragging) {
                    camera.x = camStartX + dx;
                    camera.y = camStartY + dy;
                    render();
                }
            } else if (touches.length === 2) {
                // Zoom disabled
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (e.touches.length === 0) {
                if (isClick) {
                    const rect = canvas.getBoundingClientRect();
                    const touch = e.changedTouches[0];
                    if (touch) {
                        const sx = (touch.clientX - rect.left) * (canvas.width / rect.width);
                        const sy = (touch.clientY - rect.top) * (canvas.height / rect.height);
                        handleClick(sx, sy);
                    } else {
                        handleClick(mouseDownPos.x, mouseDownPos.y);
                    }
                }
                isDragging = false;
                lastTouchDist = 0;
            }
        }, { passive: false });

        function updateOpponentList() {
            const container = document.getElementById('opponent-list');
            container.innerHTML = '';
            let selected = G.opponents;
            if (!selected || selected.length === 0) {
                const playerTribe = document.querySelector('#step-tribe .ng-tribe-item.active');
                const playerId = playerTribe ? playerTribe.dataset.tribe : 'zulu';
                const avail = TRIBES_DATA.filter(t => t.id !== playerId);
                const shuffled = avail.sort(() => Math.random() - 0.5);
                if (selectedMode === 'oba') {
                    selected = avail.map(t => t.id);
                } else if (selectedMode === 'sandsoftime' || selectedMode === 'conquest') {
                    selected = shuffled.slice(0, 5).map(t => t.id);
                } else if (selectedMode === 'custom') {
                    const count = parseInt(document.getElementById('custom-opponents').value) || 5;
                    selected = shuffled.slice(0, Math.min(count, shuffled.length)).map(t => t.id);
                }
                G.opponents = selected;
            }
            for (const id of selected) {
                const t = TRIBES_DATA.find(t => t.id === id);
                if (t) {
                    const span = document.createElement('span');
                    span.className = 'opp-tag';
                    span.textContent = `${t.icon} ${t.name}`;
                    container.appendChild(span);
                }
            }
            if (selected.length === 0) { container.textContent = 'No opponents selected.';
                container.style.color = '#6b4f3a'; }
            updateCampaignSummary();
        }

                document.addEventListener('keydown', (e) => {
                    if (G.screen === 'game-screen') {
                        if (e.key === 'e' || e.key === 'E') endTurn();
                        if (e.key === 'm' || e.key === 'M') { if (G.selectedUnit && !G.selectedUnit
                            .hasMoved) tryMoveUnit(); }
                        if (e.key === 'a' || e.key === 'A') { if (G.selectedUnit && !G.selectedUnit
                            .hasAttacked) tryAttackUnit(); }
                        if (e.key === 'h' || e.key === 'H') { tryHealUnit(); }
                        if (e.key === 'i' || e.key === 'I') { tryInvigorate(); }
                        if (e.key === ' ') { e.preventDefault(); if (G.selectedUnit) { G.selectedUnit
                                .hasMoved = true;
                                G.selectedUnit = null;
                                hideActionPopup();
                                updateUI();
                                render();
                                saveGame(); } }
                        if (e.key === 'Escape') showInGameMenu();
                        if (e.key === 'b' || e.key === 'B') {
                            if (G.selectedCity) openCityProduction();
                            else if (G.selectedHarbor) manageHarbor();
                        }
                        if (e.key === 't' || e.key === 'T') showTechTree();
                        if (e.key === 'p' || e.key === 'P') showProgressModal();
                    }
                });

                setupPopupDismissal();

                console.log('Oba v16 – City capture fixed, harbor 50% larger, wonder icons placed on map.');
            });
        });
    </script>
</body>
</html>
