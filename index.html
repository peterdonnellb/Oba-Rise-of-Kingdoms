        // ─── HEX UTILITIES ───────────────────────────────────────────
        function hexCornerShortened(cx, cy, size, i) {
            const angle = Math.PI / 180 * (60 * i - 30);
            let dx = size * Math.cos(angle);
            let dy = size * Math.sin(angle);
            dy *= 0.8;
            return { x: cx + dx, y: cy + dy };
        }

        function hexPolygonShortened(cx, cy, size) {
            const pts = [];
            for (let i = 0; i < 6; i++) pts.push(hexCornerShortened(cx, cy, size, i));
            return pts;
        }

        function hexToPixel(q, r, size) {
            const x = size * (Math.sqrt(3) * q + Math.sqrt(3) / 2 * r);
            const y = size * (3 / 2 * r * 0.8);
            return { x, y };
        }

        function pixelToHex(px, py, size) {
            const adjustedPy = py / 0.8;
            const q = (Math.sqrt(3) / 3 * px - 1 / 3 * adjustedPy) / size;
            const r = (2 / 3 * adjustedPy) / size;
            return hexRound(q, r);
        }

        function hexRound(q, r) {
            const s = -q - r;
            let rq = Math.round(q),
                rr = Math.round(r),
                rs = Math.round(s);
            const dq = Math.abs(rq - q),
                dr = Math.abs(rr - r),
                ds = Math.abs(rs - s);
            if (dq > dr && dq > ds) rq = -rr - rs;
            else if (dr > ds) rr = -rq - rs;
            return { q: rq, r: rr };
        }

        function hexDistance(a, b) {
            return (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(a.q + a.r - b.q - b.r)) / 2;
        }

        function hexNeighbors(q, r) {
            const dirs = [
                [1, 0],
                [0, 1],
                [-1, 1],
                [-1, 0],
                [0, -1],
                [1, -1]
            ];
            return dirs.map(d => ({ q: q + d[0], r: r + d[1] }));
        }

        function hexKey(q, r) { return q + ',' + r; }

        function inMap(q, r) { return q >= 0 && q < G.mapWidth && r >= 0 && r < G.mapHeight; }

        function worldToScreen(wx, wy) { return { x: wx * camera.zoom + camera.x, y: wy * camera.zoom + camera.y }; }

        function screenToWorld(sx, sy) { return { x: (sx - camera.x) / camera.zoom, y: (sy - camera.y) / camera.zoom }; }

        function getHexFromScreen(sx, sy) {
            const w = screenToWorld(sx, sy);
            return pixelToHex(w.x, w.y, G.hexSize);
        }

        function centerCamera() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width,
                h = rect.height;
            const size = G.hexSize;
            const centerWorld = hexToPixel(G.mapWidth / 2, G.mapHeight / 2, size);
            camera.x = w / 2 - centerWorld.x * camera.zoom;
            camera.y = h / 2 - centerWorld.y * camera.zoom;
            camera.centered = true;
        }

        function centerCameraOnPlayerCity() {
            const player = G.tribes.find(t => t.isPlayer);
            if (!player || player.cities.length === 0) {
                centerCamera();
                return;
            }
            const city = player.cities[0];
            const size = G.hexSize;
            const pos = hexToPixel(city.q, city.r, size);
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width,
                h = rect.height;
            camera.x = w / 2 - pos.x * camera.zoom;
            camera.y = h / 2 - pos.y * camera.zoom;
            camera.centered = true;
            render();
        }

        // ─── INFLUENCE ──────────────────────────────────────────────
        function getCityInfluence(city) {
            const radius = city.level === 1 ? 0 : city.level === 2 ? 1 : city.level >= 3 ? 2 : 0;
            const tiles = [];
            for (let dr = -radius; dr <= radius; dr++) {
                for (let dq = -radius; dq <= radius; dq++) {
                    const q = city.q + dq;
                    const r = city.r + dr;
                    if (inMap(q, r) && hexDistance({ q: city.q, r: city.r }, { q, r }) <= radius) {
                        tiles.push({ q, r });
                    }
                }
            }
            return tiles;
        }

        function computeInfluenceMap() {
            const influence = {};
            for (const city of G.cities) {
                const tiles = getCityInfluence(city);
                let color = '#555555';
                if (!city.isNeutral && city.owner) {
                    const tribe = G.tribes.find(t => t.id === city.owner);
                    if (tribe) color = tribe.color;
                } else if (city.isNeutral) {
                    color = '#666666';
                }
                for (const t of tiles) {
                    const key = hexKey(t.q, t.r);
                    if (!influence[key]) {
                        influence[key] = color;
                    }
                }
            }
            return influence;
        }

        function getTribeControlledTiles(tribeId) {
            const tiles = new Set();
            const tribe = getTribe(tribeId);
            if (!tribe) return 0;
            for (const city of tribe.cities) {
                const influence = getCityInfluence(city);
                for (const tile of influence) tiles.add(hexKey(tile.q, tile.r));
            }
            return tiles.size;
        }

        function isTileInfluencedByOther(q, r, tribeId) {
            for (const city of G.cities) {
                if (city.owner === tribeId) continue;
                const influence = getCityInfluence(city);
                for (const tile of influence) {
                    if (tile.q === q && tile.r === r) return true;
                }
            }
            return false;
        }

        function getTribeYield(tribeId) {
            const tribe = getTribe(tribeId);
            if (!tribe) return 0;
            const tiles = new Set();
            let yieldTotal = 0;
            for (const city of tribe.cities) {
                const influence = getCityInfluence(city);
                for (const tile of influence) {
                    const key = hexKey(tile.q, tile.r);
                    if (!tiles.has(key)) {
                        tiles.add(key);
                        const tileData = G.map[tile.r]?.[tile.q];
                        if (tileData) {
                            switch (tileData.terrain) {
                                case 'plains':
                                    yieldTotal += 1;
                                    break;
                                case 'forest':
                                    yieldTotal += 2;
                                    break;
                                case 'hill':
                                    yieldTotal += 2;
                                    break;
                                case 'mountain':
                                    yieldTotal += 3;
                                    break;
                                case 'water':
                                    yieldTotal += 1;
                                    break;
                                case 'desert':
                                    yieldTotal += 0;
                                    break;
                                default:
                                    break;
                            }
                            if (tileData.mine) yieldTotal += 2;
                        }
                    }
                }
            }
            return yieldTotal;
        }

        // ─── CITY DISCOUNT from fishing/farming ──────────────────────
        function getCityDiscount(city) {
            if (!city) return 0;
            const influence = getCityInfluence(city);
            let discount = 0;
            for (const tile of influence) {
                const tileData = G.map[tile.r]?.[tile.q];
                if (tileData) {
                    if (tileData.fishing) discount = Math.max(discount, 0.2);
                    if (tileData.farm) discount = Math.max(discount, 0.2);
                    if (tileData.fishing && tileData.farm) discount = Math.max(discount, 0.35);
                }
            }
            return discount;
        }

        function getCityUnitDiscount(city) {
            return getCityDiscount(city);
        }

        function getCityImprovementDiscount(city) {
            return getCityDiscount(city);
        }

        // ─── FOG OF WAR ─────────────────────────────────────────────
        function updateVisibility() {
            for (let r = 0; r < G.mapHeight; r++) {
                for (let q = 0; q < G.mapWidth; q++) {
                    G.map[r][q].visible = false;
                }
            }
            const player = G.tribes.find(t => t.isPlayer);
            if (!player) return;
            for (const unit of G.units) {
                if (unit.tribeId !== player.id) continue;
                const vision = getUnitVision(unit);
                const q = unit.q,
                    r = unit.r;
                for (let dr = -vision; dr <= vision; dr++) {
                    for (let dq = -vision; dq <= vision; dq++) {
                        const tq = q + dq,
                            tr = r + dr;
                        if (inMap(tq, tr) && hexDistance({ q, r }, { q: tq, r: tr }) <= vision) {
                            G.map[tr][tq].visible = true;
                            G.map[tr][tq].explored = true;
                        }
                    }
                }
            }
            for (const city of G.cities) {
                if (city.owner !== player.id) continue;
                const vision = 2;
                const q = city.q,
                    r = city.r;
                for (let dr = -vision; dr <= vision; dr++) {
                    for (let dq = -vision; dq <= vision; dq++) {
                        const tq = q + dq,
                            tr = r + dr;
                        if (inMap(tq, tr) && hexDistance({ q, r }, { q: tq, r: tr }) <= vision) {
                            G.map[tr][tq].visible = true;
                            G.map[tr][tq].explored = true;
                        }
                    }
                }
            }
        }

        function getUnitVision(unit) {
            const tribeData = TRIBES_DATA.find(t => t.id === unit.tribeId);
            if (!tribeData) return 2;
            const unitDef = tribeData.units[unit.type];
            if (!unitDef) return 2;
            let vision = unitDef.vision || 2;
            const tribe = G.tribes.find(t => t.id === unit.tribeId);
            if (tribe && tribe.wonders && tribe.wonders.includes('obelisks')) vision += 2;
            return vision;
        }

        // ─── HEALING FUNCTIONS ──────────────────────────────────────
        function healUnit(unit) {
            if (unit.hasMoved || unit.hasAttacked || unit.hasHealed) return false;
            const healAmount = Math.max(3, Math.floor(unit.maxHp * 0.25));
            unit.hp = Math.min(unit.maxHp, unit.hp + healAmount);
            unit.hasHealed = true;
            unit.hasMoved = true;
            return true;
        }

        function invigorateTroops(general) {
            if (general.hasMoved || general.hasAttacked || general.hasUsedAbility) return false;
            const tribe = getTribe(general.tribeId);
            if (!tribe) return false;

            const radius = 3;
            const affectedUnits = G.units.filter(u =>
                u.tribeId === general.tribeId &&
                u.active &&
                hexDistance({ q: general.q, r: general.r }, { q: u.q, r: u.r }) <= radius
            );

            let healedCount = 0;
            let boostedCount = 0;

            for (const u of affectedUnits) {
                const healAmount = Math.max(5, Math.floor(u.maxHp * 0.4));
                if (u.hp < u.maxHp) {
                    u.hp = Math.min(u.maxHp, u.hp + healAmount);
                    healedCount++;
                } else {
                    u.boosted = true;
                    u.boostedAtk = (u.boostedAtk || 0) + 1;
                    u.boostedDef = (u.boostedDef || 0) + 1;
                    u.boostedTurns = 1;
                    boostedCount++;
                }
            }

            general.hasUsedAbility = true;
            general.hasMoved = true;
            return { healedCount, boostedCount };
        }

        function clearBoostedStats(unit) {
            if (unit.boosted && unit.boostedTurns !== undefined) {
                unit.boostedTurns--;
                if (unit.boostedTurns <= 0) {
                    unit.boosted = false;
                    unit.boostedAtk = 0;
                    unit.boostedDef = 0;
                }
            }
        }

        // ─── MAP GENERATION ──────────────────────────────────────────
        function generateMap() {
            const w = G.mapWidth,
                h = G.mapHeight;
            G.map = [];

            const elevation = [];
            for (let r = 0; r < h; r++) {
                elevation[r] = [];
                for (let q = 0; q < w; q++) {
                    let val = 0;
                    val += Math.sin(q * 0.08 + r * 0.07) * 0.15;
                    val += Math.cos(q * 0.06 - r * 0.05 + 1.2) * 0.12;
                    val += Math.sin((q + r) * 0.04) * 0.10;
                    val += Math.random() * 0.30;
                    elevation[r][q] = Math.max(0, Math.min(1, val + 0.3));
                }
            }

            const centerQ = Math.floor(w / 2);
            const centerR = Math.floor(h / 2);
            const seaRadius = 2 + Math.floor(Math.random() * 2);
            for (let r = 0; r < h; r++) {
                for (let q = 0; q < w; q++) {
                    const dist = hexDistance({ q, r }, { q: centerQ, r: centerR });
                    if (dist <= seaRadius) {
                        elevation[r][q] = Math.min(elevation[r][q], 0.05);
                    }
                    if (dist <= seaRadius + 2 && dist > seaRadius) {
                        elevation[r][q] = Math.max(elevation[r][q], 0.25);
                    }
                }
            }

            const numPeaks = 2 + Math.floor(Math.random() * 2);
            const mountainPeaks = [];
            for (let i = 0; i < numPeaks; i++) {
                let q, r, attempts = 0;
                let valid = false;
                while (!valid && attempts < 50) {
                    q = 4 + Math.floor(Math.random() * (w - 8));
                    r = 4 + Math.floor(Math.random() * (h - 8));
                    const distToSea = hexDistance({ q, r }, { q: centerQ, r: centerR });
                    if (distToSea > seaRadius + 2) {
                        valid = true;
                        for (const peak of mountainPeaks) {
                            if (hexDistance({ q, r }, peak) < 6) {
                                valid = false;
                                break;
                            }
                        }
                    }
                    attempts++;
                }
                if (valid) {
                    mountainPeaks.push({ q, r });
                    const radius = 1;
                    for (let dr = -radius; dr <= radius; dr++) {
                        for (let dq = -radius; dq <= radius; dq++) {
                            const nq = q + dq,
                                nr = r + dr;
                            if (inMap(nq, nr) && hexDistance({ q, r }, { q: nq, r: nr }) <= radius) {
                                elevation[nr][nq] = Math.max(elevation[nr][nq], 0.85 + (radius - hexDistance({ q, r },
                                    { q: nq, r: nr })) * 0.05);
                            }
                        }
                    }
                }
            }

            const numHills = 3 + Math.floor(Math.random() * 3);
            const hillPeaks = [];
            for (let i = 0; i < numHills; i++) {
                let q, r, attempts = 0;
                let valid = false;
                while (!valid && attempts < 40) {
                    q = 3 + Math.floor(Math.random() * (w - 6));
                    r = 3 + Math.floor(Math.random() * (h - 6));
                    const distToSea = hexDistance({ q, r }, { q: centerQ, r: centerR });
                    if (distToSea > seaRadius + 1) {
                        valid = true;
                        for (const peak of mountainPeaks) {
                            if (hexDistance({ q, r }, peak) < 5) { valid = false; break; }
                        }
                        for (const peak of hillPeaks) {
                            if (hexDistance({ q, r }, peak) < 5) { valid = false; break; }
                        }
                    }
                    attempts++;
                }
                if (valid) {
                    hillPeaks.push({ q, r });
                    const radius = 1;
                    for (let dr = -radius; dr <= radius; dr++) {
                        for (let dq = -radius; dq <= radius; dq++) {
                            const nq = q + dq,
                                nr = r + dr;
                            if (inMap(nq, nr) && hexDistance({ q, r }, { q: nq, r: nr }) <= radius) {
                                elevation[nr][nq] = Math.max(elevation[nr][nq], 0.65 + (radius - hexDistance({ q, r },
                                    { q: nq, r: nr })) * 0.05);
                            }
                        }
                    }
                }
            }

            for (let r = 0; r < h; r++) {
                G.map[r] = [];
                for (let q = 0; q < w; q++) {
                    const elev = elevation[r][q];
                    let terrain = 'plains';
                    if (elev < 0.20) terrain = 'water';
                    else if (elev < 0.40) terrain = 'forest';
                    else if (elev < 0.60) terrain = 'plains';
                    else if (elev < 0.75) terrain = 'desert';
                    else if (elev < 0.88) terrain = 'hill';
                    else terrain = 'mountain';

                    if (r === 0 || r === h - 1 || q === 0 || q === w - 1) {
                        if (terrain === 'water' && !G.map[r]?.[q]?.isRiver) terrain = 'plains';
                    }
                    G.map[r][q] = { q, r, terrain, owner: null, city: null, unit: null, harbor: null, explored: false,
                        visible: false, isRiver: false, resource: null, mine: false, quarry: false, fishing: false,
                        farm: false, wonderIcon: null };
                }
            }

            for (let r = 0; r < h; r++) {
                for (let q = 0; q < w; q++) {
                    if (G.map[r][q].terrain === 'mountain' && Math.random() < 0.1) {
                        let currentQ = q,
                            currentR = r;
                        let steps = 0;
                        while (steps < 20) {
                            let lowestElev = elevation[currentR][currentQ];
                            let nextQ = currentQ,
                                nextR = currentR;
                            const neighbors = hexNeighbors(currentQ, currentR);
                            for (const n of neighbors) {
                                if (!inMap(n.q, n.r)) continue;
                                if (elevation[n.r][n.q] < lowestElev) {
                                    lowestElev = elevation[n.r][n.q];
                                    nextQ = n.q;
                                    nextR = n.r;
                                }
                            }
                            if (nextQ === currentQ && nextR === currentR) break;
                            currentQ = nextQ;
                            currentR = nextR;
                            steps++;
                            if (elevation[currentR][currentQ] < 0.2) break;
                            if (elevation[currentR][currentQ] < 0.4) {
                                G.map[currentR][currentQ].terrain = 'water';
                                G.map[currentR][currentQ].isRiver = true;
                            }
                        }
                    }
                }
            }

            const resourceTypes = {
                mountain: ['🪙'],
                plains: ['🌾'],
                forest: ['🪵'],
                hill: ['🪨'],
                water: ['🐟'],
                desert: ['🪙']
            };
            for (let r = 0; r < h; r++) {
                for (let q = 0; q < w; q++) {
                    const tile = G.map[r][q];
                    if (tile.terrain === 'water') continue;
                    if (tile.city) continue;
                    if (Math.random() > 0.18) continue;
                    const possible = resourceTypes[tile.terrain];
                    if (possible && possible.length > 0) {
                        tile.resource = possible[Math.floor(Math.random() * possible.length)];
                    }
                }
            }
            for (let r = 0; r < h; r++) {
                for (let q = 0; q < w; q++) {
                    const tile = G.map[r][q];
                    if (tile.terrain === 'water' && Math.random() < 0.10) {
                        tile.resource = '🐟';
                    }
                }
            }

            const numVillages = Math.floor(Math.random() * 6) + 5;
            let placed = 0,
                attempts = 0;
            while (placed < numVillages && attempts < 300) {
                attempts++;
                const q = 2 + Math.floor(Math.random() * (w - 4));
                const r = 2 + Math.floor(Math.random() * (h - 4));
                const tile = G.map[r]?.[q];
                if (!tile) continue;
                if (tile.terrain === 'water' || tile.terrain === 'mountain' || tile.terrain === 'desert') continue;
                if (tile.city) continue;
                let tooClose = false;
                for (const c of G.cities) {
                    if (c.isNeutral && hexDistance({ q, r }, { q: c.q, r: c.r }) < 4) { tooClose = true; break; }
                }
                if (tooClose) continue;
                const city = {
                    id: G.cityIdCounter++,
                    q,
                    r,
                    owner: null,
                    name: getUniqueSettlementName(),
                    level: 1,
                    production: 0,
                    progress: 0,
                    stockpile: 0,
                    project: null,
                    isNeutral: true,
                    hasLibrary: false,
                    hasUniversity: false
                };
                G.cities.push(city);
                tile.city = city;
                placed++;
            }
            G.neutralVillages = placed;
        }

        // ─── PLACE WONDER ICON ──────────────────────────────────────
        function placeWonderIcon(tribe, wonderId) {
            const candidates = [];
            for (const city of tribe.cities) {
                const influence = getCityInfluence(city);
                for (const tilePos of influence) {
                    const tile = G.map[tilePos.r]?.[tilePos.q];
                    if (!tile) continue;
                    if (tile.city || tile.unit || tile.harbor || tile.resource || tile.mine || tile.quarry || tile.fishing ||
                        tile.farm || tile.wonderIcon) continue;
                    if (tile.terrain === 'water') continue;
                    candidates.push(tile);
                }
            }
            if (candidates.length === 0) {
                for (const city of tribe.cities) {
                    const influence = getCityInfluence(city);
                    for (const tilePos of influence) {
                        const tile = G.map[tilePos.r]?.[tilePos.q];
                        if (!tile) continue;
                        if (tile.city || tile.unit || tile.harbor || tile.wonderIcon) continue;
                        if (tile.terrain === 'water') continue;
                        candidates.push(tile);
                    }
                }
            }
            if (candidates.length === 0) {
                console.warn('No suitable tile for wonder icon');
                return;
            }
            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
            chosen.wonderIcon = wonderId;
        }

        // ─── PLAYER PLACEMENT ──────────────────────────────────────
        function placeStartingPositions() {
            const w = G.mapWidth,
                h = G.mapHeight;
            const positions = [];
            const numTribes = G.tribes.length;

            for (let i = 0; i < numTribes; i++) {
                let bestPos = null;
                let bestDist = -1;
                const attemptsPerPos = 50;

                for (let attempt = 0; attempt < attemptsPerPos; attempt++) {
                    let q, r;
                    const edgeBias = Math.random();
                    if (edgeBias < 0.25) {
                        const corner = Math.floor(Math.random() * 4);
                        q = corner === 0 ? 2 : corner === 1 ? w - 3 : corner === 2 ? 2 : w - 3;
                        r = corner < 2 ? 2 : h - 3;
                        q += Math.floor(Math.random() * 4) - 2;
                        r += Math.floor(Math.random() * 4) - 2;
                    } else if (edgeBias < 0.6) {
                        const edge = Math.floor(Math.random() * 4);
                        if (edge === 0) { q = 2 + Math.floor(Math.random() * (w - 4));
                            r = 2; } else if (edge === 1) { q = 2 + Math.floor(Math.random() * (w - 4));
                            r = h - 3; } else if (edge === 2) { q = 2;
                            r = 2 + Math.floor(Math.random() * (h - 4)); } else { q = w - 3;
                            r = 2 + Math.floor(Math.random() * (h - 4)); }
                    } else {
                        q = 3 + Math.floor(Math.random() * (w - 6));
                        r = 3 + Math.floor(Math.random() * (h - 6));
                    }
                    q = Math.max(1, Math.min(w - 2, q));
                    r = Math.max(1, Math.min(h - 2, r));

                    const tile = G.map[r]?.[q];
                    if (!tile) continue;
                    if (tile.terrain === 'water' || tile.terrain === 'mountain' || tile.terrain === 'desert') continue;
                    if (tile.city) continue;

                    let minDist = Infinity;
                    for (const p of positions) {
                        const d = hexDistance({ q, r }, { q: p.q, r: p.r });
                        if (d < minDist) minDist = d;
                    }
                    if (positions.length === 0) minDist = 999;

                    for (const c of G.cities) {
                        if (c.isNeutral) {
                            const d = hexDistance({ q, r }, { q: c.q, r: c.r });
                            if (d < 3) minDist = 0;
                        }
                    }
                    if (isTileInfluencedByOther(q, r, G.tribes[i]?.id || 'none')) minDist = 0;

                    if (minDist > bestDist) {
                        bestDist = minDist;
                        bestPos = { q, r };
                    }
                }

                if (bestPos && bestDist > 2) {
                    positions.push({ q: bestPos.q, r: bestPos.r, tribeIdx: i });
                } else {
                    for (let rr = 0; rr < h; rr++) {
                        for (let qq = 0; qq < w; qq++) {
                            if (G.map[rr]?.[qq] && G.map[rr][qq].terrain !== 'water' && G.map[rr][qq].terrain !==
                                'mountain' && G.map[rr][qq].terrain !== 'desert' && !G.map[rr][qq].city) {
                                let ok = true;
                                for (const p of positions) {
                                    if (hexDistance({ q: qq, r: rr }, { q: p.q, r: p.r }) < 4) { ok = false; break; }
                                }
                                if (ok) { positions.push({ q: qq, r: rr, tribeIdx: i }); break; }
                            }
                        }
                        if (positions.length > i) break;
                    }
                }
            }

            for (const pos of positions) {
                const tribe = G.tribes[pos.tribeIdx];
                if (!tribe) continue;
                const existingCity = G.map[pos.r][pos.q].city;
                if (existingCity) {
                    const idx = G.cities.indexOf(existingCity);
                    if (idx > -1) G.cities.splice(idx, 1);
                    existingCity.owner = tribe.id;
                    existingCity.isNeutral = false;
                    existingCity.name = getUniqueSettlementName();
                    existingCity.level = 2;
                    existingCity.stockpile = 0;
                    existingCity.hasLibrary = false;
                    existingCity.hasUniversity = false;
                    tribe.cities.push(existingCity);
                    G.map[pos.r][pos.q].owner = tribe.id;
                } else {
                    const city = {
                        id: G.cityIdCounter++,
                        q: pos.q,
                        r: pos.r,
                        owner: tribe.id,
                        name: getUniqueSettlementName(),
                        level: 2,
                        production: 0,
                        progress: 0,
                        stockpile: 0,
                        project: null,
                        isNeutral: false,
                        hasLibrary: false,
                        hasUniversity: false
                    };
                    G.cities.push(city);
                    tribe.cities.push(city);
                    G.map[pos.r][pos.q].city = city;
                    G.map[pos.r][pos.q].owner = tribe.id;
                }

                const spawnTiles = [
                    { q: pos.q, r: pos.r },
                    { q: pos.q + 1, r: pos.r },
                    { q: pos.q - 1, r: pos.r + 1 },
                    { q: pos.q + 1, r: pos.r - 1 },
                    { q: pos.q, r: pos.r + 1 },
                ];
                let spawnCount = 0;
                for (const st of spawnTiles) {
                    if (inMap(st.q, st.r) && isTilePassable(st.q, st.r, false) && !G.map[st.r][st.q].unit) {
                        const type = spawnCount === 0 ? 'foot' : spawnCount === 1 ? 'scout' : 'foot';
                        if (spawnUnit(tribe.id, st.q, st.r, type)) spawnCount++;
                        if (spawnCount >= 2) break;
                    }
                }
                if (spawnCount === 0) {
                    const neighbors = hexNeighbors(pos.q, pos.r);
                    for (const n of neighbors) {
                        if (inMap(n.q, n.r) && isTilePassable(n.q, n.r, false) && !G.map[n.r][n.q].unit) {
                            spawnUnit(tribe.id, n.q, n.r, 'foot');
                            break;
                        }
                    }
                }
            }
            updateVisibility();
        }

        function initTribes(playerTribeId, opponentIds) {
            G.tribes = [];
            G.aliveTribes = [];
            resetSettlementNames();
            const pTribe = TRIBES_DATA.find(t => t.id === playerTribeId);
            if (!pTribe) return;
            G.playerTribeId = playerTribeId;
            const player = {
                id: playerTribeId,
                name: pTribe.name,
                icon: pTribe.icon,
                color: pTribe.color,
                secondary: pTribe.secondary,
                isPlayer: true,
                alive: true,
                gold: G.playerGold,
                cities: [],
                units: [],
                techs: [],
                wonders: [],
                researchPoints: 0,
                active: true,
                generalActive: false,
                eliminated: false,
                researchProgress: {}
            };
            G.tribes.push(player);
            G.aliveTribes.push(player);

            const avail = TRIBES_DATA.filter(t => t.id !== playerTribeId);
            const shuffled = avail.sort(() => Math.random() - 0.5);
            const selected = opponentIds.length > 0 ? opponentIds.filter(id => id !== playerTribeId) :
                shuffled.slice(0, Math.min(5, shuffled.length)).map(t => t.id);
            const uniqueOpps = [...new Set(selected)];
            for (const oppId of uniqueOpps) {
                const tData = TRIBES_DATA.find(t => t.id === oppId);
                if (!tData) continue;
                const opp = {
                    id: tData.id,
                    name: tData.name,
                    icon: tData.icon,
                    color: tData.color,
                    secondary: tData.secondary,
                    isPlayer: false,
                    alive: true,
                    gold: 30 + Math.floor(Math.random() * 30),
                    cities: [],
                    units: [],
                    techs: [],
                    wonders: [],
                    researchPoints: 0,
                    active: true,
                    generalActive: false,
                    ai: true,
                    eliminated: false,
                    researchProgress: {}
                };
                G.tribes.push(opp);
                G.aliveTribes.push(opp);
            }
            placeStartingPositions();
        }

        // ─── UNIT MANAGEMENT ──────────────────────────────────────
        function spawnUnit(tribeId, q, r, type, hp) {
            if (!inMap(q, r)) return null;
            const tribeData = TRIBES_DATA.find(t => t.id === tribeId);
            if (!tribeData) return null;
            const unitDef = tribeData.units[type];
            if (!unitDef) return null;
            if (!isTilePassable(q, r, unitDef.isNaval)) return null;
            const tile = G.map[r]?.[q];
            if (!tile || tile.unit) return null;
            const tribe = G.tribes.find(t => t.id === tribeId);
            if (!tribe) return null;
            const unit = {
                id: G.unitIdCounter++,
                tribeId,
                type,
                q,
                r,
                name: unitDef.name,
                move: unitDef.move,
                atk: unitDef.atk,
                def: unitDef.def,
                hp: hp || unitDef.hp,
                maxHp: unitDef.hp,
                cost: unitDef.cost,
                vision: unitDef.vision || 2,
                attackRange: unitDef.attackRange || 1,
                hasMoved: false,
                hasAttacked: false,
                hasHealed: false,
                hasUsedAbility: false,
                isGeneral: type === 'general',
                ability: unitDef.ability || null,
                isNaval: unitDef.isNaval || false,
                active: true,
                boosted: false,
                boostedAtk: 0,
                boostedDef: 0,
                boostedTurns: 0,
                victories: 0,
                veteranLevel: 0,
                isRaft: false,
                originalType: null,
                originalAtk: 0,
                originalDef: 0,
                originalMove: 0,
                originalAttackRange: 0,
                originalIsNaval: false
            };
            G.units.push(unit);
            tile.unit = unit;
            tribe.units.push(unit);
            if (tribe.isPlayer) updateVisibility();
            return unit;
        }

        function upgradeUnit(unit, level) {
            if (level === 1 && unit.veteranLevel < 1) {
                unit.atk += 1;
                unit.def += 1;
                unit.maxHp += 5;
                unit.hp = unit.maxHp;
                unit.veteranLevel = 1;
                queueMessage(`💪 ${unit.name} is now a Veteran!`);
            } else if (level === 2 && unit.veteranLevel < 2) {
                unit.atk += 1;
                unit.def += 1;
                unit.maxHp += 5;
                unit.hp = unit.maxHp;
                unit.veteranLevel = 2;
                queueMessage(`🏆 ${unit.name} is now Legendary!`);
            }
            updateUI();
            render();
        }

        function removeUnit(unit) {
            const tile = G.map[unit.r]?.[unit.q];
            if (tile && tile.unit === unit) tile.unit = null;
            const tribe = G.tribes.find(t => t.id === unit.tribeId);
            if (tribe) { const idx = tribe.units.indexOf(unit); if (idx > -1) tribe.units.splice(idx, 1); }
            const idx = G.units.indexOf(unit);
            if (idx > -1) G.units.splice(idx, 1);
        }

        function getUnitAt(q, r) { const tile = G.map[r]?.[q]; return tile ? tile.unit : null; }

        function getTribe(id) { return G.tribes.find(t => t.id === id); }

        function isTilePassable(q, r, isNaval, unit) {
            const tile = G.map[r]?.[q];
            if (!tile) return false;
            if (isNaval) {
                return true; // allow any terrain (disembark will handle land)
            } else {
                if (tile.terrain === 'water') return false;
                return true;
            }
        }

        function getUnitMoveCost(unit, q, r) {
            const tile = G.map[r]?.[q];
            if (!tile) return 999;
            if (unit.isNaval) {
                if (tile.terrain === 'water') return 1;
                return 1;
            }
            if (tile.terrain === 'mountain') return 2;
            if (tile.terrain === 'forest') return 2;
            if (tile.terrain === 'hill') return 2;
            if (tile.terrain === 'desert') return 1;
            if (tile.terrain === 'water') return 999;
            return 1;
        }

        function findPath(startQ, startR, endQ, endR, unit, tribeId) {
            const queue = [{ q: startQ, r: startR, path: [{ q: startQ, r: startR }] }];
            const visited = new Set();
            visited.add(hexKey(startQ, startR));
            while (queue.length > 0) {
                const current = queue.shift();
                if (current.q === endQ && current.r === endR) return current.path;
                const neighbors = hexNeighbors(current.q, current.r);
                for (const n of neighbors) {
                    const key = hexKey(n.q, n.r);
                    if (visited.has(key)) continue;
                    if (!inMap(n.q, n.r)) continue;
                    const tile = G.map[n.r]?.[n.q];
                    if (!tile) continue;
                    if (tile.unit && tile.unit.tribeId !== tribeId) {
                        if (n.q === endQ && n.r === endR && hexDistance({ q: startQ, r: startR }, { q: endQ, r: endR }) <=
                            unit.attackRange) {} else {
                            continue;
                        }
                    }
                    const isNaval = unit.isNaval || (unit.type === 'raft');
                    let passable = true;
                    if (isNaval) {
                        passable = true;
                    } else {
                        passable = tile.terrain !== 'water';
                    }
                    if (!passable) continue;
                    const cost = getUnitMoveCost(unit, n.q, n.r);
                    if (current.path.length + cost > unit.move + 1) continue;
                    visited.add(key);
                    const newPath = [...current.path, { q: n.q, r: n.r }];
                    queue.push({ q: n.q, r: n.r, path: newPath });
                }
            }
            return null;
        }

        // ─── GOLD PURCHASE OF UNITS ──────────────────────────────
        function buyUnitWithGold(city, unitType) {
            const player = getTribe(city.owner);
            if (!player) return false;
            const tribeData = TRIBES_DATA.find(t => t.id === player.id);
            if (!tribeData) return false;
            const unitDef = tribeData.units[unitType];
            if (!unitDef) return false;
            let goldCost = unitDef.cost * 2;
            const discount = getCityUnitDiscount(city);
            goldCost = Math.ceil(goldCost * (1 - discount));
            if (player.gold < goldCost) { showAlert('Not enough gold', 'You need ' + goldCost + ' gold to purchase this unit.');
                return false; }
            const neighbors = hexNeighbors(city.q, city.r);
            const shuffled = neighbors.sort(() => Math.random() - 0.5);
            let placed = false;
            for (const n of shuffled) {
                if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false, null)) {
                    const unit = spawnUnit(player.id, n.q, n.r, unitType);
                    if (unit) { placed = true; break; }
                }
            }
            if (!placed) { showAlert('No space', 'No adjacent tile available to place the unit.'); return false; }
            player.gold -= goldCost;
            updateUI();
            render();
            saveGame();
            return true;
        }

        // ─── HARBOR GOLD PURCHASE ──────────────────────────────────
        function buyNavalUnitAtHarbor(harbor, unitType) {
            const player = getTribe(harbor.owner);
            if (!player) return false;
            const tribeData = TRIBES_DATA.find(t => t.id === player.id);
            if (!tribeData) return false;
            const unitDef = tribeData.units[unitType];
            if (!unitDef) return false;
            if (unitDef.techRequired && !player.techs.includes(unitDef.techRequired)) {
                showAlert('Tech required', 'You need to research ' + unitDef.techRequired + ' first.');
                return false;
            }
            let goldCost = unitDef.cost * 2;
            const city = G.cities.find(c => c.owner === player.id && hexDistance({ q: c.q, r: c.r }, { q: harbor.q,
                    r: harbor.r }) <= 2);
            if (city) {
                const discount = getCityUnitDiscount(city);
                goldCost = Math.ceil(goldCost * (1 - discount));
            }
            if (player.gold < goldCost) { showAlert('Not enough gold', 'You need ' + goldCost + ' gold.'); return false; }
            const unit = spawnUnit(player.id, harbor.q, harbor.r, unitType);
            if (!unit) { showAlert('Error', 'Could not spawn unit.'); return false; }
            player.gold -= goldCost;
            updateUI();
            render();
            saveGame();
            return true;
        }

        // ─── LIBRARY / UNIVERSITY ────────────────────────────────
        function buildLibrary(city) {
            const player = getTribe(city.owner);
            if (!player) return false;
            if (city.level < 4) { showAlert('City level too low', 'City must be a Metropolis (level 4) to build a library.');
                return false; }
            if (city.hasLibrary) { showAlert('Already built', 'Library already exists in this city.'); return false; }
            let cost = 100;
            const discount = getCityImprovementDiscount(city);
            cost = Math.ceil(cost * (1 - discount));
            if (player.gold < cost) { showAlert('Not enough gold', 'You need ' + cost + ' gold.'); return false; }
            player.gold -= cost;
            city.hasLibrary = true;
            updateUI();
            render();
            saveGame();
            return true;
        }

        function buildUniversity(city) {
            const player = getTribe(city.owner);
            if (!player) return false;
            if (city.level < 4) { showAlert('City level too low', 'City must be a Metropolis (level 4) to build a university.');
                return false; }
            if (!city.hasLibrary) { showAlert('Library required', 'You must first build a library in this city.'); return false; }
            if (city.hasUniversity) { showAlert('Already built', 'University already exists.'); return false; }
            let cost = 200;
            const discount = getCityImprovementDiscount(city);
            cost = Math.ceil(cost * (1 - discount));
            if (player.gold < cost) { showAlert('Not enough gold', 'You need ' + cost + ' gold.'); return false; }
            player.gold -= cost;
            city.hasUniversity = true;
            updateUI();
            render();
            saveGame();
            return true;
        }

        // ─── MINE / QUARRY ──────────────────────────────────────────
        function canBuildMine(unit) {
            if (!unit) return false;
            if (unit.hasMoved) return false;
            const tile = G.map[unit.r]?.[unit.q];
            if (!tile) return false;
            if (tile.resource !== '🪙') return false;
            if (tile.mine) return false;
            return true;
        }

        function buildMine(unit) {
            if (!canBuildMine(unit)) return false;
            const tile = G.map[unit.r]?.[unit.q];
            tile.mine = true;
            tile.resource = null;
            unit.hasMoved = true;
            queueMessage('⛏️ Mine built! +2 gold per turn.');
            updateVisibility();
            updateUI();
            render();
            saveGame();
            return true;
        }

        function canBuildQuarry(unit) {
            if (!unit) return false;
            if (unit.hasMoved) return false;
            const tile = G.map[unit.r]?.[unit.q];
            if (!tile) return false;
            if (tile.resource !== '🪨') return false;
            if (tile.quarry) return false;
            return true;
        }

        function buildQuarry(unit) {
            if (!canBuildQuarry(unit)) return false;
            const tile = G.map[unit.r]?.[unit.q];
            tile.quarry = true;
            tile.resource = null;
            unit.hasMoved = true;
            queueMessage('🪨 Quarry built! Unit production costs reduced by 20% in the controlling city.');
            updateVisibility();
            updateUI();
            render();
            saveGame();
            return true;
        }

        // ─── FISHING / FARM ──────────────────────────────────────────
        function canLaunchFishing(tile, playerId) {
            if (!tile) return false;
            if (tile.resource !== '🐟') return false;
            if (tile.fishing) return false;
            const playerTribe = getTribe(playerId);
            if (!playerTribe) return false;
            for (const city of playerTribe.cities) {
                const tiles = getCityInfluence(city);
                for (const t of tiles) {
                    if (t.q === tile.q && t.r === tile.r) {
                        return true;
                    }
                }
            }
            return false;
        }

        function launchFishing(tile) {
            if (!canLaunchFishing(tile, G.playerTribeId)) return false;
            tile.fishing = true;
            tile.resource = null;
            queueMessage('🎣 Fishing boats launched! Settlement improvements and unit production costs reduced.');
            updateVisibility();
            updateUI();
            render();
            saveGame();
            return true;
        }

        function canBuildFarm(tile, playerId) {
            if (!tile) return false;
            if (tile.resource !== '🌾') return false;
            if (tile.farm) return false;
            const playerTribe = getTribe(playerId);
            if (!playerTribe) return false;
            for (const city of playerTribe.cities) {
                const tiles = getCityInfluence(city);
                for (const t of tiles) {
                    if (t.q === tile.q && t.r === tile.r) {
                        return true;
                    }
                }
            }
            return false;
        }

        function buildFarm(tile) {
            if (!canBuildFarm(tile, G.playerTribeId)) return false;
            tile.farm = true;
            tile.resource = null;
            queueMessage('🌾 Farm built! Settlement improvements and unit production costs reduced.');
            updateVisibility();
            updateUI();
            render();
            saveGame();
            return true;
        }

        // ─── HARBOR BUILD FROM WATER TILE ─────────────────────────
        function canBuildHarborOnTile(tile, playerId) {
            if (!tile) return false;
            if (tile.terrain !== 'water') return false;
            if (tile.harbor) return false;
            if (tile.resource === '🐟') return false;
            const neighbors = hexNeighbors(tile.q, tile.r);
            let hasLandNeighbor = false;
            for (const n of neighbors) {
                if (!inMap(n.q, n.r)) continue;
                const nTile = G.map[n.r]?.[n.q];
                if (nTile && nTile.terrain !== 'water') { hasLandNeighbor = true; break; }
            }
            if (!hasLandNeighbor) return false;
            const playerTribe = getTribe(playerId);
            if (!playerTribe) return false;
            if (!playerTribe.techs.includes('sailing')) return false;
            for (const city of playerTribe.cities) {
                const tiles = getCityInfluence(city);
                for (const t of tiles) {
                    if (t.q === tile.q && t.r === tile.r) {
                        return true;
                    }
                }
            }
            return false;
        }

        function buildHarborOnTile(tile) {
            if (!canBuildHarborOnTile(tile, G.playerTribeId)) return false;
            const harbor = { id: G.harborIdCounter++, q: tile.q, r: tile.r, owner: G.playerTribeId, production: 0,
                project: null };
            G.harbors.push(harbor);
            tile.harbor = harbor;
            queueMessage('⛵ Harbor built! You can now produce ships.');
            updateVisibility();
            updateUI();
            render();
            saveGame();
            return true;
        }

        // ─── HARBOR FUNCTIONS (legacy) ─────────────────────────────
        function canBuildRaft(unit) {
            const tribe = getTribe(unit.tribeId);
            if (!tribe) return false;
            if (!tribe.techs.includes('sailing')) return false;
            if (unit.hasMoved) return false;
            if (unit.isNaval) return false;
            if (unit.type === 'tank') return false;
            if (tribe.gold < 20) return false;
            const neighbors = hexNeighbors(unit.q, unit.r);
            for (const n of neighbors) {
                if (!inMap(n.q, n.r)) continue;
                const waterTile = G.map[n.r]?.[n.q];
                if (waterTile && waterTile.terrain === 'water' && !waterTile.unit) {
                    return true;
                }
            }
            return false;
        }

        function buildRaft(unit) {
            if (!canBuildRaft(unit)) return false;
            const tribe = getTribe(unit.tribeId);
            const neighbors = hexNeighbors(unit.q, unit.r);
            for (const n of neighbors) {
                if (!inMap(n.q, n.r)) continue;
                const waterTile = G.map[n.r]?.[n.q];
                if (waterTile && waterTile.terrain === 'water' && !waterTile.unit) {
                    unit.originalType = unit.type;
                    unit.originalAtk = unit.atk;
                    unit.originalDef = unit.def;
                    unit.originalMove = unit.move;
                    unit.originalAttackRange = unit.attackRange;
                    unit.originalIsNaval = unit.isNaval;
                    unit.isRaft = true;

                    const raftDef = TRIBES_DATA.find(t => t.id === tribe.id).units['raft'];
                    if (!raftDef) return false;
                    unit.type = 'raft';
                    unit.name = raftDef.name;
                    unit.move = raftDef.move;
                    unit.atk = raftDef.atk;
                    unit.def = raftDef.def;
                    unit.maxHp = raftDef.hp;
                    unit.hp = Math.min(unit.hp, raftDef.hp);
                    unit.attackRange = raftDef.attackRange;
                    unit.isNaval = true;
                    const oldTile = G.map[unit.r]?.[unit.q];
                    if (oldTile) oldTile.unit = null;
                    unit.q = n.q;
                    unit.r = n.r;
                    G.map[unit.r][unit.q].unit = unit;
                    tribe.gold -= 20;
                    unit.hasMoved = true;
                    updateVisibility();
                    saveGame();
                    queueMessage('🪵 Raft built! Boarded and moved to water.');
                    return true;
                }
            }
            return false;
        }

        // ─── DISEMBARK NAVAL UNIT ──────────────────────────────────
        function disembarkNavalUnit(unit) {
            if (!unit.isNaval) return false;
            const tile = G.map[unit.r]?.[unit.q];
            if (!tile || tile.terrain === 'water') return false;

            const tribe = getTribe(unit.tribeId);
            if (!tribe) return false;
            const tribeData = TRIBES_DATA.find(t => t.id === tribe.id);
            if (!tribeData) return false;

            let landType = 'scout';
            if (unit.isRaft) {
                landType = 'scout';
            } else if (unit.type === 'galley') {
                landType = 'ranged';
            } else if (unit.type === 'warship') {
                landType = 'elite';
            } else {
                landType = 'scout';
            }

            const landDef = tribeData.units[landType];
            if (!landDef) return false;

            unit.type = landType;
            unit.name = landDef.name;
            unit.move = landDef.move;
            unit.atk = landDef.atk;
            unit.def = landDef.def;
            unit.maxHp = landDef.hp;
            unit.hp = Math.min(unit.hp, landDef.hp);
            unit.attackRange = landDef.attackRange;
            unit.isNaval = false;
            unit.isRaft = false;
            unit.originalType = null;
            unit.originalAtk = 0;
            unit.originalDef = 0;
            unit.originalMove = 0;
            unit.originalAttackRange = 0;
            unit.originalIsNaval = false;

            queueMessage(`🚢 ${unit.name} has disembarked!`);
            updateUI();
            render();
            saveGame();
            return true;
        }

        function processHarborProduction(harbor) {
            if (!harbor.project) return;
            const tribe = getTribe(harbor.owner);
            if (!tribe) return;
            let prodPerTurn = 2;
            if (tribe.wonders && tribe.wonders.includes('great_zimbabwe')) prodPerTurn += 3;
            harbor.production += prodPerTurn;
            const project = harbor.project;
            let cost = 0;
            if (project.type === 'unit') {
                const tribeData = TRIBES_DATA.find(t => t.id === tribe.id);
                if (!tribeData) return;
                const unitDef = tribeData.units[project.id];
                if (!unitDef) return;
                if (unitDef.techRequired && !tribe.techs.includes(unitDef.techRequired)) {
                    harbor.project = null;
                    harbor.production = 0;
                    return;
                }
                cost = unitDef.cost;
                const city = G.cities.find(c => c.owner === tribe.id && hexDistance({ q: c.q, r: c.r }, { q: harbor.q,
                        r: harbor.r }) <= 2);
                if (city) {
                    const discount = getCityUnitDiscount(city);
                    cost = Math.ceil(cost * (1 - discount));
                }
            }
            if (cost && harbor.production >= cost) {
                if (project.type === 'unit') {
                    const unit = spawnUnit(tribe.id, harbor.q, harbor.r, project.id);
                    if (unit) {
                        harbor.project = null;
                        harbor.production = 0;
                        updateVisibility();
                        saveGame();
                    }
                }
            }
        }

        // ─── CITY CAPTURE ─────────────────────────────────────────
        function captureNeutralVillage(city, newOwnerId) {
            if (city.owner === newOwnerId) return;
            const oldOwner = city.owner;
            city.owner = newOwnerId;
            city.isNeutral = false;
            city.name = getUniqueSettlementName();
            const tribe = getTribe(newOwnerId);
            if (tribe) {
                tribe.cities.push(city);
                if (oldOwner) {
                    const oldTribe = getTribe(oldOwner);
                    if (oldTribe) {
                        const idx = oldTribe.cities.indexOf(city);
                        if (idx > -1) oldTribe.cities.splice(idx, 1);
                    }
                }
            }
            G.map[city.r][city.q].owner = newOwnerId;
            const neighbors = hexNeighbors(city.q, city.r);
            const shuffled = neighbors.sort(() => Math.random() - 0.5);
            for (const n of shuffled) {
                if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false, null)) {
                    spawnUnit(newOwnerId, n.q, n.r, 'foot');
                    break;
                }
            }
            if (oldOwner) {
                const oldTribe = getTribe(oldOwner);
                if (oldTribe && oldTribe.cities.length === 0) {
                    eliminateTribe(oldOwner, newOwnerId);
                }
            }
            saveGame();
        }

        function captureCity(city, newOwnerId) {
            const oldOwnerId = city.owner;
            if (oldOwnerId === newOwnerId) return;
            if (city.isNeutral) {
                captureNeutralVillage(city, newOwnerId);
                return;
            }
            const oldTribe = G.tribes.find(t => t.id === oldOwnerId);
            if (oldTribe) {
                const idx = oldTribe.cities.indexOf(city);
                if (idx > -1) oldTribe.cities.splice(idx, 1);
            }
            city.owner = newOwnerId;
            const newTribe = G.tribes.find(t => t.id === newOwnerId);
            if (newTribe) newTribe.cities.push(city);
            G.map[city.r][city.q].owner = newOwnerId;
            city.project = null;
            city.progress = 0;
            city.stockpile = 0;
            const neighbors = hexNeighbors(city.q, city.r);
            for (const n of neighbors) {
                if (inMap(n.q, n.r) && !G.map[n.r][n.q].unit && isTilePassable(n.q, n.r, false, null)) {
                    spawnUnit(newOwnerId, n.q, n.r, 'foot');
                    break;
                }
            }
            // Check if old tribe has any cities left
            if (oldTribe && oldTribe.cities.length === 0) {
                eliminateTribe(oldOwnerId, newOwnerId);
            }
            saveGame();
        }

        function eliminateTribe(tribeId, killerId) {
            const tribe = getTribe(tribeId);
            if (!tribe || tribe.eliminated) return;
            const unitsToRemove = G.units.filter(u => u.tribeId === tribeId);
            for (const u of unitsToRemove) {
                removeUnit(u);
            }
            tribe.alive = false;
            tribe.active = false;
            tribe.eliminated = true;
            const idx = G.aliveTribes.indexOf(tribe);
            if (idx > -1) G.aliveTribes.splice(idx, 1);
            const killer = getTribe(killerId);
            const msg = `${tribe.name} has been eliminated by ${killer ? killer.name : 'unknown'}!`;
            queueMessage(msg);
            if (tribe.isPlayer) {
                G.gameOver = true;
                G.winner = 'AI';
                showGameOverModal('💀 Defeat', 'Your kingdom has fallen…');
            }
            checkWinConditions();
            saveGame();
        }

        // ─── COMBAT ──────────────────────────────────────────────
        function performAttack(attacker, defender) {
            let atk = attacker.atk + (attacker.boostedAtk || 0);
            let defDef = defender.def + (defender.boostedDef || 0);
            let atkDef = attacker.def + (attacker.boostedDef || 0);

            let damageToDefender = Math.max(1, atk - defDef);
            let damageToAttacker = 0;
            const dist = hexDistance({ q: attacker.q, r: attacker.r }, { q: defender.q, r: defender.r });
            if (dist <= defender.attackRange) {
                damageToAttacker = Math.max(1, defDef - atkDef);
            }

            defender.hp -= damageToDefender;
            attacker.hp -= damageToAttacker;
            attacker.hasAttacked = true;

            let killed = false;
            if (defender.hp <= 0) {
                const tile = G.map[defender.r]?.[defender.q];
                if (tile && tile.unit === defender) tile.unit = null;
                const tribe = G.tribes.find(t => t.id === defender.tribeId);
                if (tribe) { const idx = tribe.units.indexOf(defender); if (idx > -1) tribe.units.splice(idx, 1); }
                const idx = G.units.indexOf(defender);
                if (idx > -1) G.units.splice(idx, 1);
                attacker.victories = (attacker.victories || 0) + 1;
                if (attacker.victories >= 5 && attacker.veteranLevel < 2) {
                    upgradeUnit(attacker, 2);
                } else if (attacker.victories >= 3 && attacker.veteranLevel < 1) {
                    upgradeUnit(attacker, 1);
                }
                const defenderTribe = getTribe(defender.tribeId);
                if (defenderTribe && defenderTribe.cities.length === 0 && defenderTribe.units.length === 0) {
                    eliminateTribe(defender.tribeId, attacker.tribeId);
                }
                killed = true;
            }
            if (attacker.hp <= 0) {
                const tile = G.map[attacker.r]?.[attacker.q];
                if (tile && tile.unit === attacker) tile.unit = null;
                const tribe = G.tribes.find(t => t.id === attacker.tribeId);
                if (tribe) { const idx = tribe.units.indexOf(attacker); if (idx > -1) tribe.units.splice(idx, 1); }
                const idx = G.units.indexOf(attacker);
                if (idx > -1) G.units.splice(idx, 1);
                const attackerTribe = getTribe(attacker.tribeId);
                if (attackerTribe && attackerTribe.cities.length === 0 && attackerTribe.units.length === 0) {
                    eliminateTribe(attacker.tribeId, defender.tribeId);
                }
            }
            saveGame();
            return { killed, damage: damageToDefender, defDamage: damageToAttacker };
        }

        function checkWinConditions() {
            if (G.gameOver) return;
            const player = G.tribes.find(t => t.isPlayer);
            if (!player || !player.alive) { G.gameOver = true;
                G.winner = 'AI';
                showGameOverModal('💀 Defeat', 'Your kingdom has fallen…'); return; }
            const aliveOpponents = G.aliveTribes.filter(t => !t.isPlayer);
            if (aliveOpponents.length === 0) { G.gameOver = true;
                G.winner = 'Player';
                showGameOverModal('🏆 Victory!', 'All opposing kingdoms have been conquered!'); return; }
            if (G.gameMode === 'sandsoftime' && G.turn >= G.maxTurns) {
                G.gameOver = true;
                const playerTiles = getTribeControlledTiles(player.id);
                let oppTiles = 0;
                for (const t of aliveOpponents) oppTiles += getTribeControlledTiles(t.id);
                if (playerTiles > oppTiles) { G.winner = 'Player';
                    showGameOverModal('🏆 Victory!', 'You control more territory when time ran out!'); } else { G.winner =
                        'AI';
                    showGameOverModal('💀 Defeat', 'The enemy controls more territory.'); }
            }
            saveGame();
        }
