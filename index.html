<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Oba – Rise of Kingdoms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Afacad:ital,wght@0,400..700;1,400..700&display=swap');

        :root {
            --regal-plum: #4B167A;
            --antique-gold: #D4AF37;
            --amethyst-purple: #8E44AD;
            --warm-gold: #F2C14E;
            --midnight-blue: #1B2A6B;
            --coastal-gold: #C9A227;
            --terracotta: #A65A2A;
            --muted-gold: #BF922A;
            --near-black: #141218;
            --vivid-gold: #FFD700;
            --cream: #f0e6d3;
            --cream-muted: #d4c8bc;
            --tech-border: #3a2a1a;
        }
        body {
            font-family: 'Afacad', sans-serif;
            background: var(--near-black);
            color: var(--cream);
            overflow-y: auto;
            height: 100vh;
            width: 100vw;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y;
        }
        body.modal-open {
            overflow: hidden;
        }
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            z-index: 10;
            transition: opacity 0.4s ease;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--near-black);
        }
        .screen.active {
            display: flex;
        }

        /* ─── MAIN MENU ─── */
        #menu-screen {
            background: var(--near-black);
            padding-top: 0;
            padding-bottom: 0;
            position: relative;
            min-height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            justify-content: flex-start;
        }
        #menu-screen::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('menu_background.png');
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        #menu-screen>* {
            position: relative;
            z-index: 1;
        }

        .menu-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 792px;
            padding: 0 16px 20px 16px;
            flex: 1;
            margin-top: 0;
            justify-content: flex-start;
            gap: 6px;
        }

        #menu-logo-container {
            width: 100%;
            max-width: 435px;
            margin-top: 10px;
            margin-bottom: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        #menu-logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        #menu-text-logo {
            font-family: 'MedievalSharp', cursive;
            font-size: clamp(2.8rem, 10vw, 5rem);
            color: var(--antique-gold);
            text-shadow: 0 0 60px rgba(212, 175, 55, 0.2), 0 4px 12px rgba(0, 0, 0, 0.9);
            letter-spacing: 4px;
            line-height: 1.1;
            text-align: center;
        }
        #menu-text-logo::before,
        #menu-text-logo::after {
            content: '⚔';
            font-size: 2rem;
            opacity: 0.3;
            margin: 0 6px;
            color: var(--amethyst-purple);
        }
        .menu-subtitle {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: var(--vivid-gold);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            opacity: 0.85;
            font-weight: 300;
            text-align: center;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            flex-shrink: 0;
        }
        .menu-btn {
            font-family: 'Afacad', sans-serif;
            font-size: clamp(1rem, 3vw, 1.25rem);
            font-weight: 600;
            padding: 12px 24px;
            margin: 3px 0;
            border: 2px solid var(--antique-gold);
            border-radius: 8px;
            background: rgba(75, 22, 122, 0.3);
            color: var(--cream);
            cursor: pointer;
            transition: all 0.25s ease;
            min-width: 180px;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
            width: 100%;
            max-width: 300px;
            touch-action: manipulation;
        }
        .menu-btn:active {
            transform: scale(0.96);
        }
        .menu-btn.primary {
            border-color: var(--vivid-gold);
            background: rgba(212, 175, 55, 0.15);
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            padding: 14px 28px;
            color: var(--vivid-gold);
        }
        .menu-btn.primary:hover {
            background: rgba(212, 175, 55, 0.25);
        }
        .menu-btn.secondary {
            border-color: #4a3528;
            background: rgba(74, 53, 40, 0.15);
            color: #b8957a;
        }
        .menu-btn.secondary:hover {
            background: rgba(74, 53, 40, 0.35);
        }
        .menu-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .menu-decoration {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(142, 68, 173, 0.08) 0%, transparent 70%);
        }
        .menu-decoration.tl {
            top: -120px;
            left: -120px;
        }
        .menu-decoration.br {
            bottom: -120px;
            right: -120px;
        }
        .menu-decoration.tr {
            top: -120px;
            right: -120px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
        }

        /* ─── MOBILE OVERRIDES ─── */
        @media (max-width: 480px) {
            #menu-screen {
                overflow: hidden;
                height: 100vh;
                min-height: 100vh;
                padding: 0;
                justify-content: flex-start;
            }
            .menu-content {
                padding: 0 12px 10px 12px;
                gap: 4px;
                flex: 0 1 auto;
                justify-content: flex-start;
                max-width: 100%;
            }
            #menu-logo-container {
                max-width: 280px;
                margin-top: 6px;
                margin-bottom: 0;
            }
            #menu-text-logo {
                font-size: 2.6rem;
                letter-spacing: 2px;
            }
            #menu-text-logo::before,
            #menu-text-logo::after {
                font-size: 1.4rem;
                margin: 0 4px;
            }
            .menu-subtitle {
                font-size: 0.8rem;
                letter-spacing: 4px;
                margin-bottom: 0.6rem;
            }
            .menu-btn {
                font-size: 0.9rem;
                padding: 10px 18px;
                min-width: 140px;
                max-width: 260px;
                margin: 2px 0;
            }
            .menu-btn.primary {
                font-size: 1rem;
                padding: 12px 24px;
            }
            .menu-decoration {
                display: none;
            }

            /* ─── GAME UI MOBILE FONT INCREASE ─── */
            .gui-top-left .tribe-name {
                font-size: 1rem !important;
            }
            .gui-top-left .turn-counter {
                font-size: 0.95rem !important;
            }
            .gui-resource {
                font-size: 0.9rem !important;
                padding: 2px 10px !important;
            }
            .gui-top-btn {
                font-size: 0.85rem !important;
                padding: 4px 12px !important;
                min-height: 32px !important;
            }
            .gui-top-btn.menu-btn {
                font-size: 1.2rem !important;
                padding: 4px 8px !important;
                min-width: 30px !important;
            }
            .gui-unit-info .unit-name {
                font-size: 1rem !important;
            }
            .gui-unit-info .unit-stats {
                font-size: 0.9rem !important;
            }
            .gui-action-btn {
                font-size: 0.95rem !important;
                padding: 6px 14px !important;
                min-height: 44px !important;
            }
            .gui-action-btn.end-turn {
                font-size: 0.95rem !important;
                padding: 6px 16px !important;
            }
        }

        @media (max-width: 380px) {
            #menu-text-logo {
                font-size: 2.2rem;
            }
            #menu-text-logo::before,
            #menu-text-logo::after {
                font-size: 1rem;
                margin: 0 2px;
            }
            .menu-btn {
                font-size: 0.8rem;
                padding: 8px 14px;
                min-width: 120px;
                max-width: 220px;
            }
            .menu-btn.primary {
                font-size: 0.9rem;
                padding: 10px 18px;
            }
            #menu-logo-container {
                max-width: 220px;
                margin-top: 4px;
            }
            .menu-subtitle {
                font-size: 0.7rem;
                letter-spacing: 2px;
                margin-bottom: 0.4rem;
            }
        }

        /* ─── NEW GAME WIZARD ─── */
        #newgame-screen {
            background: var(--near-black);
            position: relative;
            padding: 16px 12px 40px 12px;
            overflow-y: auto;
            justify-content: flex-start;
            -webkit-overflow-scrolling: touch;
        }
        #newgame-screen::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('menu_background.png');
            background-size: cover;
            background-position: center;
            opacity: 0.3;
            z-index: 0;
            pointer-events: none;
        }
        #newgame-screen>* {
            position: relative;
            z-index: 1;
        }

        .ng-step {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            gap: 14px;
            padding: 6px 0 20px 0;
        }
        .ng-step.active {
            display: flex;
        }

        .ng-step-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 4px 10px 4px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.2);
        }
        .ng-step-header .back-btn {
            font-size: 1.2rem;
            padding: 6px 16px;
            border: none;
            background: rgba(20, 18, 24, 0.5);
            color: #b8957a;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 44px;
        }
        .ng-step-header .back-btn:active {
            background: rgba(74, 53, 40, 0.3);
        }
        .ng-step-header h2 {
            font-family: 'MedievalSharp', cursive;
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            color: var(--antique-gold);
            letter-spacing: 2px;
            margin: 0;
            flex: 1;
            text-align: center;
        }
        .ng-step-header .placeholder {
            width: 60px;
        }

        .ng-mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            padding: 4px 0;
        }
        .ng-mode-btn {
            padding: 16px 10px;
            background: rgba(27, 42, 107, 0.35);
            border: 2px solid rgba(201, 162, 39, 0.2);
            border-radius: 14px;
            color: var(--cream-muted);
            font-family: inherit;
            font-size: clamp(0.95rem, 2.5vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-height: 80px;
            justify-content: center;
            touch-action: manipulation;
        }
        .ng-mode-btn:active {
            transform: scale(0.96);
        }
        .ng-mode-btn.selected {
            border-color: var(--vivid-gold);
            background: rgba(255, 215, 0, 0.08);
            color: var(--vivid-gold);
        }
        .ng-mode-btn .mode-desc {
            font-size: 0.7rem;
            font-weight: 400;
            color: #6b5a4a;
        }
        .ng-mode-btn.selected .mode-desc {
            color: #b8957a;
        }

        .ng-tribe-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-height: 50vh;
            overflow-y: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
        }
        .ng-tribe-item {
            padding: 10px 4px;
            border-radius: 12px;
            border: 2px solid transparent;
            background: rgba(20, 18, 24, 0.4);
            cursor: pointer;
            transition: 0.15s;
            font-size: 0.8rem;
            text-align: center;
            color: #b8a898;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 70px;
        }
        .ng-tribe-item:active {
            background: rgba(212, 175, 55, 0.15);
        }
        .ng-tribe-item.active {
            border-color: var(--coastal-gold);
            background: rgba(212, 175, 55, 0.12);
            color: var(--cream);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.05);
        }
        .ng-tribe-item .tribe-icon {
            font-size: 2.2rem;
            display: block;
            line-height: 1.2;
        }
        .ng-tribe-item .tribe-name {
            font-size: 0.7rem;
            font-weight: 600;
        }
        .ng-tribe-item .tribe-desc {
            font-size: 0.55rem;
            color: #6b5a4a;
        }

        .ng-opponent-area {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            width: 100%;
            padding: 4px 0;
        }
        #opponent-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }
        #opponent-list .opp-tag {
            background: rgba(30, 18, 12, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #3a281e;
            font-size: clamp(0.75rem, 2vw, 0.85rem);
            color: var(--cream-muted);
        }
        .ng-actions-row {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            width: 100%;
        }
        .ng-actions-row button {
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            padding: 10px 16px;
            border: 1px solid #4a3528;
            background: rgba(20, 12, 8, 0.5);
            color: var(--cream-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            flex: 1;
            touch-action: manipulation;
            min-height: 44px;
        }
        .ng-actions-row button:active {
            background: rgba(74, 53, 40, 0.3);
        }
        .ng-actions-row button.danger {
            border-color: #6a2a1a;
            color: #b85a4a;
        }

        .ng-custom-options {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            padding: 8px 0;
            border-top: 1px solid rgba(42, 26, 16, 0.3);
            margin-top: 8px;
        }
        .ng-custom-options.show {
            display: flex;
        }
        .ng-custom-options .ng-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            background: rgba(20, 18, 24, 0.3);
            border-radius: 8px;
            flex-wrap: wrap;
        }
        .ng-custom-options .ng-option label {
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            color: var(--cream-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .ng-custom-options .ng-option input,
        .ng-custom-options .ng-option select {
            background: #1a0e08;
            border: 1px solid #3a281e;
            color: var(--cream);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-family: inherit;
            width: 70px;
            min-height: 38px;
        }
        .ng-custom-options .ng-option select {
            width: auto;
        }

        .ng-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 16px;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            color: var(--cream-muted);
            width: 100%;
            padding: 8px 0;
        }
        .ng-summary .sum-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(42, 26, 16, 0.2);
        }
        .ng-summary .sum-row .label {
            color: #6b5a4a;
        }
        .ng-summary .sum-row .value {
            color: var(--cream);
            font-weight: 500;
        }

        .ng-start-btn {
            width: 100%;
            padding: 16px;
            font-size: clamp(1.2rem, 3.5vw, 1.4rem);
            font-weight: 700;
            border: 2px solid var(--vivid-gold);
            border-radius: 12px;
            background: rgba(255, 215, 0, 0.08);
            color: var(--vivid-gold);
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 56px;
        }
        .ng-start-btn:active {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(0.98);
        }

        /* ─── GAME SCREEN ─── */
        #game-screen {
            background: var(--near-black);
            padding: 0;
            justify-content: flex-start;
            overflow: hidden;
        }
        #game-canvas-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #1B2A6B 0%, #0a0f2a 100%);
            cursor: grab;
            touch-action: none;
        }
        #gameCanvas:active {
            cursor: grabbing;
        }

        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #game-ui>* {
            pointer-events: auto;
        }

        /* ─── TOP BAR ─── */
        .gui-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: linear-gradient(180deg, rgba(27, 42, 107, 0.85) 0%, transparent 100%);
            flex-wrap: nowrap;
            gap: 4px;
            min-height: 44px;
        }
        .gui-top-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        .gui-top-left .tribe-name {
            font-size: clamp(0.85rem, 2.5vw, 1.1rem);
            color: var(--warm-gold);
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .gui-top-left .tribe-name .tribe-icon img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }
        .gui-top-left .turn-counter {
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            color: var(--coastal-gold);
            font-weight: 600;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(201, 162, 39, 0.2);
        }
        .gui-top-right {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
        }
        .gui-resource {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: clamp(0.7rem, 1.8vw, 0.9rem);
            color: var(--cream-muted);
            background: rgba(20, 18, 24, 0.6);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(201, 162, 39, 0.15);
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }
        .gui-resource .icon {
            font-size: clamp(0.8rem, 2vw, 1rem);
        }
        .gui-resource .val {
            font-weight: 700;
            color: var(--cream);
            min-width: 20px;
            text-align: center;
        }
        .gui-resource.gold .val {
            color: var(--vivid-gold);
        }

        .gui-top-btn {
            padding: 4px 10px;
            border: 1px solid #4a3528;
            background: rgba(20, 18, 24, 0.6);
            color: #b8957a;
            border-radius: 6px;
            cursor: pointer;
            font-size: clamp(0.65rem, 1.6vw, 0.85rem);
            transition: 0.2s;
            letter-spacing: 0.5px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            min-height: 32px;
            font-weight: 600;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .gui-top-btn:active {
            background: rgba(74, 53, 40, 0.4);
        }
        .gui-top-btn.tech-btn {
            border-color: var(--coastal-gold);
            color: var(--coastal-gold);
        }
        .gui-top-btn.tech-btn:hover {
            background: rgba(201, 162, 39, 0.1);
        }
        .gui-top-btn.menu-btn {
            padding: 4px 6px;
            min-width: 28px;
            width: auto;
            font-size: 1.2rem;
            border-color: #4a3528;
            color: #b8957a;
            line-height: 1;
        }

        /* ─── BOTTOM BAR ─── */
        .gui-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 10px 12px 10px;
            background: linear-gradient(0deg, rgba(27, 42, 107, 0.92) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
        }
        .gui-unit-info {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(20, 18, 24, 0.85);
            border-radius: 10px;
            border: 1px solid rgba(166, 90, 42, 0.3);
            min-height: 46px;
            flex: 1 1 160px;
            flex-wrap: wrap;
            backdrop-filter: blur(4px);
        }
        .gui-unit-info .unit-name {
            font-weight: 700;
            color: var(--terracotta);
            font-size: clamp(0.85rem, 2.4vw, 1.05rem);
            min-width: 50px;
        }
        .gui-unit-info .unit-stats {
            font-size: clamp(0.75rem, 2vw, 0.9rem);
            color: #b8957a;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .gui-unit-info .unit-stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .gui-unit-info .unit-stats .stat-val {
            color: var(--cream);
            font-weight: 600;
        }

        .gui-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }
        .gui-action-btn {
            padding: 8px 14px;
            border: 1px solid #3a281e;
            background: rgba(20, 18, 24, 0.7);
            color: var(--cream-muted);
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(0.8rem, 2.2vw, 0.95rem);
            transition: 0.2s;
            letter-spacing: 0.3px;
            font-family: inherit;
            font-weight: 600;
            -webkit-tap-highlight-color: transparent;
            min-height: 44px;
            min-width: 48px;
            backdrop-filter: blur(2px);
            touch-action: manipulation;
        }
        .gui-action-btn:active:not(:disabled) {
            background: rgba(74, 53, 40, 0.4);
            transform: scale(0.96);
        }
        .gui-action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .gui-action-btn.primary {
            border-color: var(--coastal-gold);
            color: var(--coastal-gold);
            background: rgba(201, 162, 39, 0.12);
        }
        .gui-action-btn.primary:active:not(:disabled) {
            background: rgba(201, 162, 39, 0.25);
        }
        .gui-action-btn.danger {
            border-color: #6a2a1a;
            color: #b85a4a;
        }
        .gui-action-btn.end-turn {
            border-color: var(--vivid-gold);
            background: rgba(255, 215, 0, 0.08);
            color: var(--vivid-gold);
            font-weight: 700;
            padding: 8px 18px;
            min-width: 64px;
            font-size: clamp(0.85rem, 2.4vw, 1rem);
        }
        .gui-action-btn.end-turn:active:not(:disabled) {
            background: rgba(255, 215, 0, 0.18);
        }
        .gui-action-btn.heal {
            border-color: #4caf50;
            color: #4caf50;
            background: rgba(76, 175, 80, 0.08);
        }
        .gui-action-btn.heal:active:not(:disabled) {
            background: rgba(76, 175, 80, 0.2);
        }
        .gui-action-btn.invigorate {
            border-color: #9b59b6;
            color: #9b59b6;
            background: rgba(155, 89, 182, 0.08);
        }
        .gui-action-btn.invigorate:active:not(:disabled) {
            background: rgba(155, 89, 182, 0.2);
        }

        /* ─── POPUP ACTION MENU — GAME-STYLE ─── */
        #action-popup {
            position: absolute;
            background: rgba(12, 10, 16, 0.96);
            backdrop-filter: blur(16px);
            border: 2px solid var(--coastal-gold);
            border-radius: 16px;
            padding: 8px 6px;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 160px;
            z-index: 50;
            pointer-events: auto;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 215, 0, 0.1);
            transition: opacity 0.15s ease, transform 0.15s ease;
            transform: scale(0.95);
            opacity: 0;
        }
        #action-popup.show {
            opacity: 1;
            transform: scale(1);
        }
        #action-popup button {
            background: rgba(27, 42, 107, 0.25);
            border: 1px solid rgba(201, 162, 39, 0.10);
            border-radius: 8px;
            color: var(--cream);
            padding: 12px 16px;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            font-family: 'Afacad', sans-serif;
            cursor: pointer;
            transition: 0.15s;
            text-align: left;
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: 0.5px;
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        #action-popup button:hover:not(:disabled) {
            background: rgba(201, 162, 39, 0.15);
            border-color: rgba(201, 162, 39, 0.3);
        }
        #action-popup button:active:not(:disabled) {
            transform: scale(0.96);
            background: rgba(201, 162, 39, 0.2);
        }
        #action-popup button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #action-popup button .action-icon {
            font-size: 1.2rem;
            min-width: 28px;
            text-align: center;
        }
        #action-popup button .action-label {
            flex: 1;
        }
        #action-popup button .action-shortcut {
            font-size: 0.6rem;
            color: #6b5a4a;
            letter-spacing: 1px;
            opacity: 0.6;
        }
        #action-popup button.primary {
            border-color: var(--vivid-gold);
            color: var(--vivid-gold);
            background: rgba(255, 215, 0, 0.06);
        }
        #action-popup button.primary:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.15);
        }
        #action-popup button.danger {
            border-color: #6a2a1a;
            color: #b85a4a;
        }
        #action-popup button.danger:hover:not(:disabled) {
            background: rgba(106, 42, 26, 0.2);
        }
        #action-popup button.heal-btn {
            border-color: #4caf50;
            color: #4caf50;
        }
        #action-popup button.heal-btn:hover:not(:disabled) {
            background: rgba(76, 175, 80, 0.15);
        }
        #action-popup button.invigorate-btn {
            border-color: #9b59b6;
            color: #9b59b6;
        }
        #action-popup button.invigorate-btn:hover:not(:disabled) {
            background: rgba(155, 89, 182, 0.15);
        }
        #action-popup button.mine-btn {
            border-color: #f1c40f;
            color: #f1c40f;
        }
        #action-popup button.mine-btn:hover:not(:disabled) {
            background: rgba(241, 196, 15, 0.12);
        }
        #action-popup button.quarry-btn {
            border-color: #95a5a6;
            color: #95a5a6;
        }
        #action-popup button.quarry-btn:hover:not(:disabled) {
            background: rgba(149, 165, 166, 0.12);
        }
        #action-popup button.fish-btn {
            border-color: #00bcd4;
            color: #00bcd4;
        }
        #action-popup button.fish-btn:hover:not(:disabled) {
            background: rgba(0, 188, 212, 0.12);
        }
        #action-popup button.farm-btn {
            border-color: #4caf50;
            color: #4caf50;
        }
        #action-popup button.farm-btn:hover:not(:disabled) {
            background: rgba(76, 175, 80, 0.12);
        }
        #action-popup button.harbor-btn {
            border-color: #00bcd4;
            color: #00bcd4;
        }
        #action-popup button.harbor-btn:hover:not(:disabled) {
            background: rgba(0, 188, 212, 0.12);
        }
        #action-popup .popup-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.15), transparent);
            margin: 2px 8px;
        }
        #action-popup .popup-title {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6b5a4a;
            padding: 4px 12px 2px 12px;
            text-align: center;
            border-bottom: 1px solid rgba(42, 26, 16, 0.3);
            margin-bottom: 2px;
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: radial-gradient(ellipse at 50% 40%, var(--regal-plum) 0%, var(--near-black) 100%);
            border: 2px solid var(--antique-gold);
            border-radius: 16px;
            padding: 24px 20px;
            max-width: 620px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9);
            -webkit-overflow-scrolling: touch;
        }
        .modal-box h2 {
            font-family: 'MedievalSharp', cursive;
            font-size: clamp(1.3rem, 4vw, 1.6rem);
            color: var(--antique-gold);
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: 2px;
        }
        .modal-box p {
            color: var(--cream-muted);
            line-height: 1.5;
            font-size: clamp(0.9rem, 2.2vw, 1rem);
            text-align: left;
        }
        .modal-box .gameplay-section {
            margin-top: 10px;
            padding: 12px;
            background: rgba(20, 18, 24, 0.4);
            border-radius: 10px;
        }
        .modal-box .gameplay-section strong {
            color: var(--warm-gold);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal-box .modal-actions button {
            padding: 10px 24px;
            border: 1px solid var(--vivid-gold);
            background: rgba(255, 215, 0, 0.08);
            color: var(--vivid-gold);
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            transition: 0.2s;
            letter-spacing: 1px;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
            touch-action: manipulation;
        }
        .modal-box .modal-actions button:active {
            background: rgba(255, 215, 0, 0.18);
        }
        .modal-box .modal-actions button.primary {
            background: rgba(255, 215, 0, 0.15);
        }
        .modal-box .modal-actions button.danger {
            border-color: #6a2a1a;
            color: #b85a4a;
        }

        /* ─── TECH TREE VISUAL ─── */
        .tech-tree-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 6px 0;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .tech-row {
            display: flex;
            align-items: center;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tech-node {
            background: rgba(20, 18, 24, 0.6);
            border: 2px solid #4a3528;
            border-radius: 6px;
            padding: 4px 8px;
            min-width: 70px;
            text-align: center;
            font-size: 0.7rem;
            transition: 0.2s;
            cursor: default;
        }
        .tech-node.researched {
            border-color: var(--vivid-gold);
            background: rgba(255, 215, 0, 0.08);
        }
        .tech-node.available {
            border-color: var(--coastal-gold);
            cursor: pointer;
            background: rgba(201, 162, 39, 0.08);
        }
        .tech-node.available:hover {
            background: rgba(201, 162, 39, 0.2);
            transform: scale(1.02);
        }
        .tech-node.locked {
            opacity: 0.5;
        }
        .tech-node .tech-name {
            font-weight: 600;
            color: var(--cream);
        }
        .tech-node .tech-cost {
            font-size: 0.55rem;
            color: #b8957a;
        }
        .tech-node .tech-status {
            font-size: 0.5rem;
            display: block;
            margin-top: 1px;
        }
        .tech-node .tech-status.done {
            color: #4caf50;
        }
        .tech-node .tech-status.avail {
            color: var(--coastal-gold);
        }
        .tech-node .tech-status.locked {
            color: #6b5a4a;
        }
        .tech-node .tech-status.inprogress {
            color: #ff9800;
        }
        .tech-group-label {
            font-size: 0.6rem;
            color: #6b5a4a;
            text-align: center;
            width: 100%;
            margin: 2px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(74, 53, 40, 0.3);
            padding-bottom: 2px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1a0e08;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--coastal-gold);
            border-radius: 2px;
        }

        /* ─── AI TURN OVERLAY ─── */
        #ai-turn-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
        }
        #ai-turn-overlay.active {
            display: flex;
        }
        #ai-turn-box {
            background: radial-gradient(ellipse at 50% 40%, var(--regal-plum) 0%, var(--near-black) 100%);
            border: 2px solid var(--antique-gold);
            border-radius: 16px;
            padding: 24px 32px;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            max-width: 90%;
        }
        #ai-turn-box h2 {
            font-family: 'MedievalSharp', cursive;
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            color: var(--antique-gold);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        #ai-turn-box p {
            color: var(--cream-muted);
            font-size: clamp(1rem, 2.8vw, 1.2rem);
        }
        #ai-turn-icon {
            font-size: 2.5rem;
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <!-- ════════════════════════════════════════════════════════════════ -->
    <!-- MAIN MENU -->
    <!-- ════════════════════════════════════════════════════════════════ -->
    <div id="menu-screen" class="screen active">
        <div class="menu-decoration tl"></div>
        <div class="menu-decoration br"></div>
        <div class="menu-decoration tr"></div>
        <div class="menu-content">
            <div id="menu-logo-container">
                <img id="main-logo" src="logo_oba.png" alt="Oba Logo" style="display: none; width:100%; height:auto;" />
                <div id="menu-text-logo" style="display: block;">OBA</div>
            </div>
            <div class="menu-subtitle">— Rise of Kingdoms —</div>
            <button class="menu-btn primary" onclick="showNewGameWizard()">⚔ New Game</button>
            <button class="menu-btn secondary" id="load-game-btn" onclick="loadGame()" disabled>📂 Load Game</button>
            <button class="menu-btn secondary" disabled>🌐 Multiplayer</button>
            <button class="menu-btn secondary" onclick="showHowToPlay()">📖 How to Play</button>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════ -->
    <!-- NEW GAME WIZARD -->
    <!-- ════════════════════════════════════════════════════════════════ -->
    <div id="newgame-screen" class="screen">
        <!-- Step 1: Mode -->
        <div id="step-mode" class="ng-step active">
            <div class="ng-step-header">
                <button class="back-btn" onclick="showScreen('menu-screen')">←</button>
                <h2>Choose Mode</h2>
                <div class="placeholder"></div>
            </div>
            <div class="ng-mode-grid">
                <button class="ng-mode-btn selected" data-mode="conquest" onclick="selectMode(this)">
                    ⚔ Conquest
                    <span class="mode-desc">Defeat all enemies</span>
                </button>
                <button class="ng-mode-btn" data-mode="sandsoftime" onclick="selectMode(this)">
                    ⏳ Sands of Time
                    <span class="mode-desc">Control most hexes</span>
                </button>
                <button class="ng-mode-btn" data-mode="oba" onclick="selectMode(this)">
                    👑 Oba
                    <span class="mode-desc">Conquest · Aggressive AI</span>
                </button>
                <button class="ng-mode-btn" data-mode="custom" onclick="selectMode(this)">
                    ⚙️ Custom
                    <span class="mode-desc">Configure your game</span>
                </button>
            </div>
            <button class="ng-start-btn" onclick="goToStep('step-tribe')">Next →</button>
        </div>

        <!-- Step 2: Tribe -->
        <div id="step-tribe" class="ng-step">
            <div class="ng-step-header">
                <button class="back-btn" onclick="goToStep('step-mode')">←</button>
                <h2>Choose Your Tribe</h2>
                <div class="placeholder"></div>
            </div>
            <div class="ng-tribe-grid" id="tribe-grid"></div>
            <button class="ng-start-btn" onclick="goToStep('step-opponents')">Next →</button>
        </div>

        <!-- Step 3: Opponents & Options -->
        <div id="step-opponents" class="ng-step">
            <div class="ng-step-header">
                <button class="back-btn" onclick="goToStep('step-tribe')">←</button>
                <h2>Setup Opponents</h2>
                <div class="placeholder"></div>
            </div>
            <div class="ng-opponent-area">
                <div id="opponent-list"></div>
            </div>
            <div class="ng-actions-row">
                <button id="add-ai-btn">+ Add AI</button>
                <button id="remove-ai-btn" class="danger">− Remove</button>
            </div>

            <!-- Custom options (hidden by default) -->
            <div id="custom-options" class="ng-custom-options">
                <div class="ng-option">
                    <label>Turns: <input type="number" id="custom-turns" value="50" min="10" max="200" /></label>
                </div>
                <div class="ng-option">
                    <label>Opponents: <input type="number" id="custom-opponents" value="5" min="1" max="11" /></label>
                </div>
                <div class="ng-option">
                    <label>Difficulty: <select id="custom-difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
                </div>
            </div>

            <div class="ng-summary" id="campaign-summary">
                <div class="sum-row"><span class="label">Tribe</span><span class="value" id="sum-tribe">—</span></div>
                <div class="sum-row"><span class="label">Mode</span><span class="value" id="sum-mode">Conquest</span></div>
                <div class="sum-row"><span class="label">Opponents</span><span class="value" id="sum-opps">5</span></div>
                <div class="sum-row"><span class="label">Difficulty</span><span class="value" id="sum-diff">Normal</span></div>
                <div class="sum-row"><span class="label">Turn Limit</span><span class="value" id="sum-turns">∞</span></div>
            </div>

            <button class="ng-start-btn" id="start-game-btn">⚔ Begin Campaign ⚔</button>
        </div>
    </div>

    <!-- ════════════════════════════════════════════════════════════════ -->
    <!-- GAME SCREEN -->
    <!-- ════════════════════════════════════════════════════════════════ -->
    <div id="game-screen" class="screen">
        <div id="game-canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
            <div id="game-ui">
                <!-- TOP BAR -->
                <div class="gui-top">
                    <div class="gui-top-left">
                        <span class="tribe-name" id="gui-tribe-name"></span>
                        <span class="turn-counter" id="gui-turn">Turn 0</span>
                    </div>
                    <div class="gui-top-right">
                        <div class="gui-resource gold"><span class="icon">🪙</span><span class="val" id="gui-gold">0</span></div>
                        <div class="gui-resource"><span class="icon">🔬</span><span class="val" id="gui-research">0</span></div>
                        <button class="gui-top-btn tech-btn" onclick="showTechTree()">📜 Tech</button>
                        <button class="gui-top-btn menu-btn" onclick="showInGameMenu()">☰</button>
                    </div>
                </div>

                <!-- BOTTOM BAR -->
                <div class="gui-bottom">
                    <div class="gui-unit-info" id="gui-unit-info">
                        <span class="unit-name" id="unit-name-display">No selection</span>
                        <span class="unit-stats">
                            <span>⚔ <span class="stat-val" id="unit-atk">—</span></span>
                            <span>🛡 <span class="stat-val" id="unit-def">—</span></span>
                            <span>👣 <span class="stat-val" id="unit-mov">—</span></span>
                            <span>❤️ <span class="stat-val" id="unit-hp">—</span></span>
                        </span>
                    </div>
                    <div class="gui-actions">
                        <button class="gui-action-btn" id="btn-progress" onclick="showProgressModal()">📊</button>
                        <button class="gui-action-btn end-turn" id="btn-end-turn" onclick="endTurn()">⏭ End</button>
                    </div>
                </div>

                <!-- ─── POPUP ACTION MENU ─── -->
                <div id="action-popup">
                    <div class="popup-title">— Actions —</div>
                    <button data-action="move"><span class="action-icon">🚶</span><span class="action-label">Move</span><span class="action-shortcut">M</span></button>
                    <button data-action="attack"><span class="action-icon">⚔️</span><span class="action-label">Attack</span><span class="action-shortcut">A</span></button>
                    <button data-action="skip"><span class="action-icon">⏭</span><span class="action-label">Skip</span><span class="action-shortcut">SPACE</span></button>
                    <div class="popup-divider"></div>
                    <button data-action="heal" class="heal-btn"><span class="action-icon">💚</span><span class="action-label">First Aid</span><span class="action-shortcut">H</span></button>
                    <button data-action="invigorate" class="invigorate-btn"><span class="action-icon">✨</span><span class="action-label">Invigorate</span><span class="action-shortcut">I</span></button>
                    <div class="popup-divider"></div>
                    <button data-action="build-raft"><span class="action-icon">🪵</span><span class="action-label">Build Raft</span></button>
                    <div class="popup-divider"></div>
                    <button data-action="build-mine" class="mine-btn"><span class="action-icon">⛏️</span><span class="action-label">Build Mine</span></button>
                    <button data-action="build-quarry" class="quarry-btn"><span class="action-icon">🪨</span><span class="action-label">Build Quarry</span></button>
                    <!-- Fishing, Farm, Harbor (shown conditionally) -->
                    <button data-action="launch-fishing" class="fish-btn" style="display:none;"><span class="action-icon">🎣</span><span class="action-label">Launch Fishing Boats</span></button>

        // ─── TECH HELPERS ────────────────────────────────────────────
        function isTechAvailable(tribe, techId) {
            if (tribe.techs.includes(techId)) return true;
            const tech = TECH_TREE.find(t => t.id === techId);
            if (!tech) return false;
            if (tech.requires && tech.requires.length > 0) {
                for (const req of tech.requires) {
                    if (!tribe.techs.includes(req)) return false;
                }
            }
            return true;
        }

        function getAvailableTechs(tribe) {
            return TECH_TREE.filter(t => !tribe.techs.includes(t.id) && isTechAvailable(tribe, t.id));
        }

        function getAvailableUnits(tribe) {
            const tribeData = TRIBES_DATA.find(t => t.id === tribe.id);
            if (!tribeData) return {};
            const result = {};
            for (const [type, def] of Object.entries(tribeData.units)) {
                if (!def.techRequired || tribe.techs.includes(def.techRequired)) {
                    result[type] = def;
                }
            }
            return result;
        }

        function getAvailableWonders(tribe) {
            return WONDERS.filter(w => !tribe.wonders.includes(w.id) && (w.requires ? tribe.techs.includes(w.requires) :
            true));
        }

        function getTechCost(techId) { const tech = TECH_TREE.find(t => t.id === techId); return tech ? tech.cost : 999; }

        function getWonderCost(wonderId) { const w = WONDERS.find(w => w.id === wonderId); return w ? w.cost : 999; }

        function isTechResearched(tribe, techId) { return tribe.techs.includes(techId); }

        function isWonderBuilt(tribe, wonderId) { return tribe.wonders.includes(wonderId); }

        // ─── TECH TREE VIEW ──────────────────────────────────────────
        function showTechTree() {
            const player = G.tribes.find(t => t.isPlayer);
            if (!player) return;
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = '📜 Technology Tree';

            const tiers = getTechsByTier();
            const tierNames = ['Foundations', 'Craftsmanship', 'Advancement', 'Mastery'];
            let html = `<div class="tech-tree-container">`;

            for (let tier = 0; tier <= 3; tier++) {
                const techs = tiers[tier] || [];
                if (techs.length === 0) continue;
                html += `<div class="tech-group-label">— ${tierNames[tier] || `Tier ${tier}`} —</div>`;
                html += `<div class="tech-row">`;
                for (const tech of techs) {
                    const researched = player.techs.includes(tech.id);
                    const available = isTechAvailable(player, tech.id);
                    const inProgress = isTechBeingResearched(tech.id);
                    let status = researched ? '✅ Researched' : (inProgress ? `⏳ ${getTechResearcher(tech.id)}` : (
                        available ? '🔓 Available' : '🔒 Locked'));
                    let statusClass = researched ? 'done' : (inProgress ? 'inprogress' : (available ? 'avail' : 'locked'));
                    let nodeClass = 'tech-node';
                    if (researched) nodeClass += ' researched';
                    else if (available && !inProgress) nodeClass += ' available';
                    else nodeClass += ' locked';

                    let onclick = '';
                    if (available && !researched && !inProgress) {
                        onclick = `onclick="assignTechToCity('${tech.id}')"`;
                    } else if (inProgress) {
                        onclick = `onclick="alert('Already being researched in ${getTechResearcher(tech.id)}')"`;
                    }

                    html += `<div class="${nodeClass}" ${onclick}>
                <div class="tech-name">${tech.name}</div>
                <div class="tech-cost">${tech.cost} 🔬</div>
                <div class="tech-status ${statusClass}">${status}</div>
                <div style="font-size:0.5rem;color:#6b5a4a;margin-top:2px;">${tech.desc}</div>
              </div>`;
                }
                html += `</div>`;
                if (tier < 3 && tiers[tier + 1] && tiers[tier + 1].length > 0) {
                    html += `<div style="text-align:center;color:#4a3528;font-size:1.2rem;">⬇</div>`;
                }
            }

            // Wonders
            html += `<div class="tech-group-label" style="margin-top:12px;">— Wonders —</div>`;
            html += `<div class="tech-row">`;
            for (const wonder of WONDERS) {
                const built = player.wonders.includes(wonder.id);
                const available = wonder.requires ? player.techs.includes(wonder.requires) : true;
                let inProgress = false;
                let cityName = '';
                for (const city of player.cities) {
                    if (city.project && city.project.type === 'wonder' && city.project.id === wonder.id) {
                        inProgress = true;
                        cityName = city.name;
                        break;
                    }
                }
                let status = built ? '✅ Built' : (inProgress ? `⏳ ${cityName}` : (available ? '🔓 Available' :
                    '🔒 Locked'));
                let statusClass = built ? 'done' : (inProgress ? 'inprogress' : (available ? 'avail' : 'locked'));
                let nodeClass = 'tech-node';
                if (built) nodeClass += ' researched';
                else if (available && !inProgress) nodeClass += ' available';
                else nodeClass += ' locked';
                let onclick = '';
                if (available && !built && !inProgress) {
                    onclick = `onclick="assignWonderToCity('${wonder.id}')"`;
                } else if (inProgress) {
                    onclick = `onclick="alert('Already being built in ${cityName}')"`;
                }
                html += `<div class="${nodeClass}" ${onclick}>
              <div class="tech-name">${wonder.name}</div>
              <div class="tech-cost">${wonder.cost} 🏗️</div>
              <div class="tech-status ${statusClass}">${status}</div>
              <div style="font-size:0.5rem;color:#6b5a4a;">${wonder.desc}</div>
            </div>`;
            }
            html += `</div>`;

            html += `</div>`;
            html +=
                `<div style="text-align:center;font-size:0.7rem;color:#6b5a4a;margin-top:8px;">💡 Click a tech to assign to a city, or click a wonder to start building it.</div>`;

            document.getElementById('modal-body').innerHTML = html;
            const actions = document.getElementById('modal-actions');
            actions.innerHTML = `<button class="primary" onclick="closeModal()">Close</button>`;
            overlay.classList.add('active');
        }

        // ─── ASSIGN WONDER TO CITY ──────────────────────────────────
        function assignWonderToCity(wonderId) {
            const player = G.tribes.find(t => t.isPlayer);
            if (!player) return;
            if (player.wonders.includes(wonderId)) {
                showAlert('Already built', 'This wonder has already been constructed.');
                return;
            }
            const wonder = WONDERS.find(w => w.id === wonderId);
            if (!wonder) return;
            if (wonder.requires && !player.techs.includes(wonder.requires)) {
                showAlert('Prerequisite missing', 'You need to research the required technology first.');
                return;
            }

            const idleCities = player.cities.filter(c => !c.project);
            if (idleCities.length === 0) {
                showAlert('No idle cities', 'All your cities are busy. Free one up first.');
                return;
            }

            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-title').textContent = 'Build Wonder: ' + wonder.name;
            let html =
                '<p>Choose a city to construct this wonder:</p><div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">';
            for (const city of idleCities) {
                html +=
                    `<button style="padding:10px;background:rgba(20,12,8,0.7);border:1px solid #3a281e;border-radius:6px;color:var(--cream);cursor:pointer;font-family:inherit;font-size:clamp(0.9rem,2.2vw,1rem);min-height:44px;touch-action:manipulation;"
